goal: |
  Desplegar el Worker `cuestionarios-worker` que recibe la entrega del alumno,
  la califica con la clave guardada como secreto y archiva el resultado en el
  repositorio privado `cero97-ctrl/cuestionarios-resultados`.

  La página publicada es estática y no puede escribir en GitHub ni calcular la
  nota sin exponer la clave. El Worker mueve ambas cosas al servidor: la clave
  vive en `CLAVE_JSON` y el navegador solo recibe `{recibido: true}`.

  El examen se rinde a distancia: el Worker aplica además tres barreras que la
  página no puede imponer — ventana horaria, nómina de inscritos y un único
  intento — y archiva las justificaciones de evidencia que el alumno escribe
  para dos preguntas, que son lo que el docente revisa para detectar trabajo
  con IA.

layer: orchestration

references:
  orchestrator: flujo_desplegar_worker_cuestionarios.py
  worker: Proyectos/cuestionarios-worker (src/logica.js, src/index.js, wrangler.jsonc)
  tests: cd Proyectos/cuestionarios-worker && npm test
  input: cursos/<CURSO>/evaluaciones/web/fuentes/<CUESTIONARIO>.md (+ _respuestas.md)
  output: |
    Un Worker por grupo: `https://cuestionarios-worker.cero-agents.workers.dev`
    (ROL ROJO, base) y `https://cuestionarios-worker-<grupo>.cero-agents.workers.dev`
    (`--env azul`, `--env purpura`, `--env legal`). La clave de un grupo nunca
    viaja al Worker de otro ni a su repositorio de resultados.
  archivo: resultados/<cuestionario>/grupo_<NN>/<cedula>.json en el repo privado

required_inputs:
  - name: sesión OAuth de wrangler (o .env → CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID)
    description: |
      Ruta habitual: `wrangler login` una vez; la sesión queda en
      `~/.config/.wrangler/config/default.toml` y caduca (verificar
      `wrangler whoami`). El account id se puede leer de
      `Proyectos/BMR/.wrangler/cache/wrangler-account.json` sin desplegar nada.
      Alternativa sin navegador: `CLOUDFLARE_API_TOKEN` (`Workers Scripts: Edit`)
      y `CLOUDFLARE_ACCOUNT_ID` en `.env`. Sin una de las dos, el flujo sale con
      código 4 y no toca nada.
  - name: .env → GITHUB_TOKEN_RESULTADOS[_<ENTORNO>]
    description: |
      PAT fine-grained con `Contents: Read and write` **solo** en el repo de
      resultados del curso. El flujo lo sube como secreto `GITHUB_TOKEN` por
      stdin (nunca como argumento de shell). No reutilizar el `GITHUB_TOKEN`
      general de `.env`: ese token no debe acabar en Cloudflare.
      **Un token por entorno:** con `--env <nombre>` el flujo prefiere
      `GITHUB_TOKEN_RESULTADOS_<NOMBRE>` (en mayúsculas, `-` → `_`; p. ej.
      `--env lab2` → `GITHUB_TOKEN_RESULTADOS_LAB2`) y cae a
      `GITHUB_TOKEN_RESULTADOS` si no existe. Cada curso archiva en su propio
      repo y su PAT suele estar scoped a él, así que sin esta separación
      redesplegar un curso pisaría el secreto del otro con un token sin acceso
      a su repo (el Worker arrancaría y fallaría en cada entrega).
      **El mismo nombre lo deriva el acta** (`execution/descargar_resultados.py`,
      regla única en `execution/token_resultados.py`) a partir del sufijo del
      repo (`...-resultados-lab2` → `_LAB2`), así que desplegar con `--env lab2`
      y leer con `--repo ...-lab2` usan la misma variable sin pasar
      `--token-env`. Si los dos nombres divergen, el despliegue sale en verde y
      el 404 aparece en la primera entrega o al sacar el acta.
  - name: --nomina <alumnos.csv>
    description: |
      Nómina con la cédula en la primera columna (TSV del sistema de la
      universidad, CSV o una cédula por línea). El flujo la normaliza igual que
      el Worker (`V-12345678`) y la sube como **secreto** `CEDULAS`: va como
      secreto, no como `vars`, porque `wrangler.jsonc` se commitea en un repo
      público y la lista de alumnos no debe viajar en él.
  - name: --inicio / --fin
    description: |
      Ventana del examen en ISO 8601 UTC (`2026-11-16T14:40:00Z` /
      `2026-11-16T15:35:00Z`). Se suben como secretos `VENTANA_INICIO` /
      `VENTANA_FIN`, así se cambia la hora sin redesplegar. Sin ellas la ventana
      queda abierta (los secretos persisten entre despliegues: para cerrar de
      nuevo hay que sobreescribirlos).

      **La hora se escribe en UTC, no en VET.** Venezuela es UTC−4 todo el año
      (no aplica horario de verano), así que un examen de las 08:00 VET empieza a
      las `12:00:00Z`. Escribir `08:00:00Z` abre la ventana cuatro horas antes y
      no lo delata ningún `/salud`: la ventana simplemente estará abierta cuando
      no toca.

      El fin lleva **5 minutos de margen** sobre la duración real del examen
      (45 min de trabajo + 5 de holgura): el día del examen la página se abre a
      las 10:40 y Pages puede tardar ~1 minuto en servirla, así que la holgura
      es lo que garantiza los 45 minutos completos a quien entre en cuanto
      aparezca. El cierre es **común para todos** (11:35) y no se mueve por
      retrasos: un cierre distinto por alumno exigiría un endpoint de inicio y
      no existe (el Worker solo ve el POST).
  - name: --fuente <cuestionario.md>
    description: |
      Fuente con front matter. La clave NO se escribe a mano: se lee de
      `<fuente>_respuestas.md` con el parser de `execution/md_a_html.py`.
  - name: --check
    description: |
      Valida la clave y el bundle (`wrangler deploy --dry-run`) sin cuenta ni red
      de despliegue. Es la forma de comprobar que todo está en su sitio.

contract:
  validacion: |
    El Worker exige `cuestionario` (slug exacto), `nombre` (3..80, solo letras,
    espacios, punto, apóstrofo y guion), `cedula` (V/E/J + 5..9 dígitos,
    normalizada a `V-12345678`), `grupo` (entero 1..GRUPOS) y `respuestas`
    (exactamente 1..total, letras A..E). Opcionales: `justificaciones`
    (`{n: texto}`, solo las preguntas de `ITEMS_JUSTIFICACION`, 40..1500
    caracteres con espacios colapsados), `duracion_s` (0..7200) y `pegas`
    (0..500). Cuerpo máximo **16 KiB** (diez justificaciones caben de sobra).
    `duracion_s` y `pegas` se miden desde la **primera** carga de la página, no
    desde la última: el borrador local del alumno (ver `evaluacion_web.yaml` →
    `contract.borrador`) restaura el reloj y el contador, así que un corte de luz
    no reinicia la medición ni olvida los pegados ya contabilizados.
  barreras: |
    1. **Ventana**: fuera de `[VENTANA_INICIO, VENTANA_FIN]` → 403 antes de leer
       el cuerpo. Sin secretos la ventana está abierta; una fecha mal escrita la
       deja cerrada con el motivo (`/salud` lo publica).
    2. **Nómina**: una cédula que no está en `CEDULAS` → 403 «no estás
       inscrito». La nómina completa va en los cuatro Workers: el grupo lo
       declara el alumno y el archivo se archiva en `grupo_<NN>`, que es donde
       el docente detecta un grupo incoherente.
    3. **Un intento**: si el archivo de esa cédula ya existe → 409 «ya
       registraste una entrega». El repo es la fuente de verdad, así que la
       barrera sobrevive a un redespliegue.
  calificacion: |
    `nota = 10 * aciertos / total`, redondeada a 2 decimales. El total sale de la
    clave, no de un número escrito en el Worker: una clave de 8 preguntas
    califica sobre 8.
  archivo: |
    `resultados/<cuestionario>/grupo_<NN>/<cedula>.json`, con nombre, cédula,
    grupo, respuestas, aciertos, total, nota y `enviado_en`. La ruta depende de
    la cédula, así que un reenvío sobrescribe el mismo archivo (idempotente).
  cors: |
    Solo se acepta el `Origin` listado en `ORIGENES` (`https://cero97-ctrl.github.io`
    y `http://localhost:8788`). Un origen desconocido recibe 403; una petición sin
    `Origin` (curl) se acepta para poder probar.
  secreto: |
    La respuesta al alumno es `{"recibido": true}`. Ni nota, ni aciertos, ni qué
    preguntas falló: con la entrega remota y un solo intento, devolver la nota
    convertiría la página en un oráculo para probar respuestas. El alumno ve
    «Entrega registrada» y la nota se publica en el acta.

steps:
  - paso: 1
    script: cd Proyectos/cuestionarios-worker && npm test
    description: |
      Lógica pura (validación, calificación, ventana, nómina, justificaciones,
      ruta y contenido del archivo) sin red ni cuenta. Debe dar 32/32.
  - paso: 2
    script: python3 flujo_desplegar_worker_cuestionarios.py [--env <grupo>] --check
    description: |
      Comprueba que la fuente y `_respuestas.md` coinciden, que el bundle
      compila y —esto es lo que evita la avería cara— que el
      `CUESTIONARIO_ID` de `wrangler.jsonc` es el de ESTA fuente. Sin `--env`
      usa el Worker base (ROL ROJO). Reporta el sha256 de la clave; si cambia
      sin haber tocado el cuestionario, algo se movió donde no debía.
  - paso: 3
    script: |
      python3 flujo_desplegar_worker_cuestionarios.py [--env <grupo>] \
        --nomina <alumnos.csv> --inicio <ISO> --fin <ISO>
    description: |
      Despliega, sube `CLAVE_JSON`, `CEDULAS`, `ITEMS_JUSTIFICACION`,
      `VENTANA_INICIO`, `VENTANA_FIN` y `MIN_JUSTIFICACION`, comprueba que
      `GITHUB_TOKEN` existe (lo sube desde `.env` si falta) y llama a `/salud`,
      que debe devolver `{ok, ventana, inscritas}` con el número de la nómina. Con `--env` el despliegue y los
      secretos van al Worker de ese entorno (`cuestionarios-worker-<grupo>`) y
      se verifica que la URL devuelta sea la suya antes de escribir nada.
  - paso: 4
    script: python3 flujo_desplegar_worker_cuestionarios.py [--env <grupo>] --actualizar-fuente
    description: |
      Escribe `entrega_url:` en el front matter de la fuente con la URL real.
      Sin este paso la página no muestra el botón de envío.
  - paso: 5
    script: python3 flujo_evaluacion_web.py --fuente <fuente> && python3 flujo_publicar_cuestionario.py --push
    description: |
      Regenerar el HTML (ahora con botón) y republicarlo. Verificar en el
      navegador que el botón se habilita con los datos y las 10 respuestas.
      El publicador recolecta todos los `*_alumno.html`, así que un cuestionario
      nuevo entra al índice solo; no hay que tocar el índice a mano.
  - paso: 6
    script: |
      curl -X POST <url> -H 'Content-Type: application/json' \
        -d '{"cuestionario":"rol_rojo_cuestionario","nombre":"Prueba Eme","cedula":"V-12345678","grupo":1,"respuestas":{"1":"A"},"justificaciones":{"7":"<40+ caracteres>"}}'
    description: |
      Prueba de humo con una cédula REAL de la nómina (una inventada da 403).
      Con la ventana puesta, fuera de horario da 403 «fuera de la ventana»: es
      la comprobación más rápida de que la ventana está activa. `nombre` no
      admite dígitos («Prueba E2E» da `nombre inválido`). Borrar después la
      entrega de prueba con `gh api -X DELETE`.

expected_outputs:
  - "Worker desplegado y respondiendo `{\"ok\":true,\"ventana\":{…},\"inscritas\":N}` en `/salud`."
  - "Secretos `CLAVE_JSON`, `GITHUB_TOKEN`, `CEDULAS`, `ITEMS_JUSTIFICACION`, `VENTANA_INICIO`, `VENTANA_FIN` y `MIN_JUSTIFICACION` presentes (`wrangler secret list`)."
  - "`entrega_url:` escrito en la fuente y botón «Enviar mis respuestas» en el HTML del alumno."
  - "Una entrega de prueba aparece en `resultados/<cuestionario>/grupo_<NN>/` del repo privado, con la nota calculada."
  - "Códigos de salida: 0 ok · 1 E/S · 3 fuente/clave inválida · 4 wrangler/secretos · 5 `/salud` no responde."

edge_cases:
  - caso: "`wrangler whoami` falla"
    respuesta: |
      Código 4 antes de desplegar. La causa más frecuente no es la falta de
      credenciales sino la **caducidad** de la sesión OAuth (`expiration_time` en
      `~/.config/.wrangler/config/default.toml`): volver a ejecutar
      `wrangler login`. Alternativa sin navegador: `CLOUDFLARE_API_TOKEN` y
      `CLOUDFLARE_ACCOUNT_ID` en `.env`.
  - caso: "El chequeo de `/salud` responde 403 aunque el Worker funciona"
    respuesta: |
      Cloudflare bloquea el `User-Agent` por defecto de urllib en dominios
      `workers.dev` («error code: 1010»): el mismo Worker devuelve 200 con curl
      y 403 con `urllib.request.urlopen` a pelo (verificado 2026-11-11). El flujo
      ya envía UA de navegador en `_salud` (`USER_AGENT`, mismo criterio que
      `execution/scrape_single_site.py`). Cualquier chequeo HTTP nuevo desde
      Python debe repetir esas cabeceras antes de concluir que el Worker cayó.
  - caso: "Se despliega un grupo nuevo y se rompe el que ya funcionaba"
    respuesta: |
      Es la avería que este flujo evita: `wrangler.jsonc` tiene un Worker base
      (ROL ROJO) y un `env.<grupo>` por cada grupo extra, con su propio `name`,
      `CUESTIONARIO_ID` y `GRUPOS`. En wrangler los `vars` de un `env` **no se
      heredan**, así que hay que repetirlos. El flujo lee el archivo y compara
      `CUESTIONARIO_ID` con el slug de la fuente ANTES de tocar la cuenta: si
      no coinciden, sale con código 3 y no sube nada. Nunca desplegar un grupo
      sin `--env`: eso escribiría su clave en el Worker base y dejaría a ambos
      rechazando entregas (el base por id y el nuevo por clave).
  - caso: "El Worker responde 500 «servicio no configurado»"
    respuesta: |
      Falta `CLAVE_JSON`, `CUESTIONARIO_ID` o `GRUPOS`. Repetir el paso 3: sube
      `CLAVE_JSON` y verifica los secretos.
  - caso: "El Worker responde 502 «no se pudo registrar la entrega»"
    respuesta: |
      El PAT no tiene `Contents: Read and write` sobre el repo privado, o el repo
      no existe. Revisar el token y `gh repo view cero97-ctrl/cuestionarios-resultados`.
  - caso: "El navegador bloquea el envío por CORS"
    respuesta: |
      El `Origin` no está en `ORIGENES`. Añadirlo en `wrangler.jsonc` y volver a
      desplegar; no abrir la política a `*` (cualquier web podría enviar).
  - caso: "Se cambia la clave del cuestionario"
    respuesta: |
      Editar `_respuestas.md`, repetir el paso 2 (el sha256 debe cambiar) y el
      paso 3. Los archivos ya archivados conservan la nota que se calculó con la
      clave vigente en su momento: no se recalculan.
  - caso: "Un alumno reenvía"
    respuesta: |
      La página fija las respuestas y el Worker responde 409: el archivo ya
      existe. Para corregir una entrega legítima (se equivocó de grupo, el
      navegador se cayó a mitad) hay que borrar el archivo del repo privado con
      `gh api -X DELETE` y avisar al alumno; no hay endpoint de reemplazo a
      propósito.
  - caso: "La ventana sigue cerrada el día del examen"
    respuesta: |
      Mirar `/salud`: publica `{abierta, motivo}`. Si dice «VENTANA_INICIO
      inválida», el secreto se subió con otro formato (se espera ISO 8601 UTC);
      corregirlo con el paso 3, que no requiere cambiar el código.
  - caso: "Un alumno entrega desde el Worker de otro grupo"
    respuesta: |
      Se acepta: la nómina está en los cuatro Workers y el grupo lo declara el
      alumno. La incoherencia se ve en el acta (el archivo queda en
      `grupo_<NN>` según lo declarado) y se corrige a mano en el registro.
  - caso: "Llega spam al endpoint público"
    respuesta: |
      Validación estricta y cuerpo acotado reducen el daño, pero no hay rate
      limiting (requiere KV o la función de pago). Auditar el repo privado y
      borrar lo que no corresponda.

contingencia:
  disparador: |
    Un alumno no pudo presentar el examen remoto por un **corte eléctrico** (no
    por falta de internet: eso lo resuelve el propio alumno con datos móviles).
    El alumno avisa por WhatsApp; el docente verifica y, solo si el corte se
    solapa con la ventana del examen, le da un **examen nuevo al día siguiente**.

    Un examen de recuperación no es «reabrir la ventana»: las preguntas ya se
    conocieron y, sobre todo, el acta recalcula las notas con la clave vigente de
    su fuente. Si la recuperación compartiera `cuestionario_id` con el examen
    regular, el acta reprocesaría las entregas regulares contra la clave nueva y
    cambiaría notas ya publicadas. Por eso cada recuperación tiene su propia
    fuente, su propio Worker y su propia acta; la fusión las une después.

  protocolo_verificacion:
    evidencia: |
      El alumno envía la captura o el PDF del **reporte de la app** que registra
      el inicio y el fin del **corte eléctrico** (no del internet). La app no
      prueba que se haya quedado sin datos, así que además se le pregunta si
      tenía datos móviles disponibles; si los tenía y no los usó, no hay
      contingencia que aplicar.
    criterio: |
      El intervalo reportado debe **solaparse con la ventana del examen**
      (10:40–11:35 local del 16-nov). Un corte a las 07:00 no explica una
      ausencia a las 11:00.
    registro: |
      Las cédulas verificadas se anotan en `.tmp/verificados_<grupo>.csv` con
      cabecera `cedula,nombre,grupo` (la misma nómina reducida que se sube como
      secreto `CEDULAS` al Worker de recuperación y que se pasa a `--lista` en el
      acta). Esa lista es la que hace cumplir la regla: un alumno no verificado
      recibe 403 «no inscrita» aunque tenga el enlace.

  examen_de_recuperacion:
    alcance: |
      **Un examen por grupo** (hasta 4), porque cada grupo rindió preguntas
      distintas y la recuperación debe cubrir el mismo contenido. Si un grupo no
      tuvo afectados, no se genera examen para ese grupo.
    cuando: |
      **Al día siguiente (17-nov), por la mañana.** Ventana fijada
      09:00–09:45 local (`2026-11-17T13:00:00Z`–`2026-11-17T13:45:00Z`); se
      cambia con `--inicio/--fin`, sin tocar código. La misma duración de 45 min
      y el mismo cierre común para todos.
    sitio: |
      El **mismo sitio de GitHub Pages** del examen regular. Los HTML regulares
      se archivan en local antes de publicar los de recuperación, y al cerrar se
      vuelve a ocultar el repo (`--visibilidad private`).
    preguntas: |
      Las escribe el docente, **distintas** a las del examen regular. Formato
      canónico de siempre (fuente + `_respuestas.md` hermano), y se procesan con
      `barajar_cuestionario.py` y `dividir_cuestionario.py` igual que los
      regulares: nada de HTML escrito a mano.
    nombres: |
      Fuente `ROL_<GRUPO>_RECUPERACION_Cuestionario.md` (para Legal,
      `ROL_LEGAL_REPORTE_TECNICO_RECUPERACION_Cuestionario.md`) → slug
      `rol_<grupo>_recuperacion_cuestionario`. Worker
      `cuestionarios-worker-<grupo>-recuperacion`; entorno de wrangler
      `<grupo>_recuperacion` (incluido Rojo, que es el Worker base y por eso
      también necesita su `env.rojo_recuperacion`). HTML
      `rol_<grupo>_recuperacion_cuestionario_alumno.html`.

  pipeline_por_grupo:
    - name: preparar el entorno de wrangler
      run: |
        Añadir a `Proyectos/cuestionarios-worker/wrangler.jsonc` un bloque
        `env.<grupo>_recuperacion` con `name`, `REPO_RESULTADOS`,
        `CUESTIONARIO_ID` (el slug de la fuente de recuperación), `GRUPOS: "4"`
        y `ORIGENES`. Los `vars` no se heredan: hay que repetirlos. Sin este
        bloque el flujo se niega a desplegar (código 3).
    - name: desplegar el Worker cerrado
      run: |
        python3 flujo_desplegar_worker_cuestionarios.py \
          --fuente cursos/CYBERSEGURIDAD/evaluaciones/web/fuentes/ROL_<GRUPO>_RECUPERACION_Cuestionario.md \
          --env <grupo>_recuperacion \
          --nomina .tmp/verificados_<grupo>.csv \
          --inicio 2026-11-17T13:00:00Z --fin 2026-11-17T13:45:00Z \
          --actualizar-fuente
      description: |
        Se despliega el 16-nov por la tarde, con la ventana del 17: queda cerrado
        hasta entonces y `/salud` lo confirma (`abierta: false`, `inscritas` = los
        verificados). `--actualizar-fuente` escribe `entrega_url` en la fuente;
        el HTML se genera **después**, o el botón saldría sin destino.
    - name: archivar los HTML del examen regular
      run: |
        mkdir -p cursos/CYBERSEGURIDAD/evaluaciones/web/archivo/regular_2026-11-16
        find cursos/CYBERSEGURIDAD/evaluaciones/web -maxdepth 1 \
          -name '*_alumno.html' ! -name '*_recuperacion_*' \
          -exec mv {} cursos/CYBERSEGURIDAD/evaluaciones/web/archivo/regular_2026-11-16/ \;
      description: |
        Se guardan en local (la carpeta `web/` está ignorada por git) para poder
        reutilizarlos si hiciera falta otra recuperación. El `find` excluye los
        de recuperación a propósito: el glob `rol_*_cuestionario_alumno.html`
        también los capturaría.
    - name: generar el HTML de recuperación
      run: |
        python3 flujo_evaluacion_web.py \
          --fuente cursos/CYBERSEGURIDAD/evaluaciones/web/fuentes/ROL_<GRUPO>_RECUPERACION_Cuestionario.md \
          --variantes alumno
      description: |
        Escribe `web/rol_<grupo>_recuperacion_cuestionario_alumno.html`. Se
        genera con el mismo conversor determinista: sin CDN, con datos
        obligatorios, bloqueo al primer clic y borrador local.
    - name: publicar y abrir
      run: |
        python3 flujo_publicar_cuestionario.py --push --visibilidad public
      description: |
        Con los HTML regulares archivados, el publicador solo ve los de
        recuperación. El flip tarda 40–50 s medidos; por eso se publica a las
        08:50, diez minutos antes de la ventana, y se comprueba con un `curl` a
        los 60 s. Un 404 cacheado del día anterior no se queda pegado.
    - name: cerrar
      run: python3 flujo_publicar_cuestionario.py --visibilidad private
      description: |
        A las 09:45, igual que el examen regular. Ocultar no es instantáneo (el
        CDN puede seguir sirviendo 200 hasta ~10 min), así que el cierre efectivo
        lo marca el Worker: fuera de la ventana responde 403.
    - name: acta por grupo
      run: |
        python3 flujo_acta_cuestionario.py \
          --fuente cursos/CYBERSEGURIDAD/evaluaciones/web/fuentes/ROL_<GRUPO>_RECUPERACION_Cuestionario.md \
          --lista .tmp/verificados_<grupo>.csv --sin-pdf
      description: |
        Genera `resultados/acta_rol_<grupo>_recuperacion_cuestionario.csv`. La
        clave es la de la fuente de recuperación, no la del examen regular.
    - name: fusionar
      run: |
        python3 flujo_fusionar_actas.py \
          --acta cursos/CYBERSEGURIDAD/evaluaciones/resultados/acta_rol_rojo_cuestionario.csv \
          --recuperacion cursos/CYBERSEGURIDAD/evaluaciones/resultados/acta_rol_<grupo>_recuperacion_cuestionario.csv \
          --lista cursos/CYBERSEGURIDAD/evaluaciones/alumnos_cyberseguridad.csv \
          --salida cursos/CYBERSEGURIDAD/evaluaciones/resultados/acta_fusionada.csv
      description: |
        Una sola acta con todas las entregas y la columna `origen`. La invariante
        que verifica el orquestador es `filas == regular + recuperación`: si no
        cuadra, se perdió o duplicó una entrega y falla. Una cédula en las dos
        actas es conflicto (código 3): se resuelve a mano, no se elige una.

  edge_cases:
    - caso: "Un alumno no verificado intenta entregar la recuperación"
      respuesta: |
        El Worker de recuperación tiene `CEDULAS` = solo los verificados, así que
        responde 403 «no inscrita». Es la barrera: el enlace puede circular, la
        nómina no.
    - caso: "No hubo ningún afectado"
      respuesta: |
        No se despliega nada y el acta regular es la definitiva. No generar
        exámenes ni actas de recuperación vacíos: un acta sin filas no es un
        resultado, es una entrada que no se leyó.
    - caso: "La misma cédula aparece en el acta regular y en la de recuperación"
      respuesta: |
        `flujo_fusionar_actas.py` sale con código 3 y dice en qué actas aparece.
        Puede ser que la entrega regular llegara tarde (el Worker la archivó
        después del cierre) o un archivo cruzado. Revisar a mano: si la entrega
        regular es posterior al corte, la válida es la de recuperación; el script
        no decide eso por ti.
    - caso: "El corte fue durante el envío, después de las 11:35"
      respuesta: |
        Antes de dar recuperación, mirar el repo privado: si el archivo existe,
        la entrega llegó y no hay nada que recuperar. Si no existe, el caso es el
        mismo que un corte durante el examen. El 409 del Worker solo protege
        contra reenvíos, no contra un envío que nunca llegó.
    - caso: "El alumno dice que se le cortó la luz pero la app no lo respalda"
      respuesta: |
        No hay recuperación. El reporte de la app es la evidencia; sin él, la
        regla se vuelve «el que avisa se lleva otro examen», que no es
        verificable ni justo con el resto.
    - caso: "El sitio no carga el 17 a las 09:00"
      respuesta: |
        Misma rutina que el examen regular: `--visibilidad private` y luego
        `--visibilidad public`; el flip tarda 40–50 s. Si el repo quedó en 404
        por caché, el reintento lo resuelve. Verificar con `curl` a los 60 s.
    - caso: "Se quiere reutilizar el HTML del examen regular"
      respuesta: |
        Está en `web/archivo/regular_2026-11-16/`. Copiarlo de vuelta a `web/`
        solo si se va a publicar el mismo examen; para una recuperación nueva,
        generar el HTML de la fuente nueva (las preguntas deben ser distintas).
