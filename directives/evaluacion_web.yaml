goal: |
  Convertir los cuestionarios de examen del curso (Markdown privado) en HTML
  autocontenido para publicarlos a los estudiantes, sin filtrar la clave de
  respuestas y sin depender de la red **salvo MathJax**.

  MathJax se carga desde su CDN (`cdn.jsdelivr.net`) y es la **única** URL
  externa admitida: los cuestionarios de física llevan matemática y sin él se
  leería `$R = V/I$` en crudo. El alumno ya necesita internet para entregar en
  el Worker, así que el CDN no añade un requisito nuevo. Auto-hospedar ~1,5 MB
  de fuentes se descartó por peso y porque obliga a tocar también el publicador.

  El repositorio es público y los exámenes son material privado: la fuente vive
  en `cursos/<CURSO>/evaluaciones/web/fuentes/` (o en
  `.../web/SEMANA_NN/fuentes/`) y la salida en la carpeta que contiene `fuentes/`,
  ambas rutas ignoradas por git. La variante
  `_alumno.html` no contiene la clave; la `_docente.html` sí, y por eso lleva un
  aviso visible y nunca debe compartirse con estudiantes.

layer: orchestration

references:
  orchestrator: flujo_evaluacion_web.py
  scripts: execution/md_a_html.py, execution/test_md_a_html.py
  input: cursos/<CURSO>/evaluaciones/web/[SEMANA_NN/]fuentes/*.md
  output: cursos/<CURSO>/evaluaciones/web/[SEMANA_NN/]<slug>_alumno.html, <slug>_docente.html, index.html
  tests: python3 execution/test_md_a_html.py

required_inputs:
  - name: --fuente PATRÓN
    description: |
      Repetible. Ruta o glob al .md de origen. Si se omite, se usan los
      `cursos/*/evaluaciones/web/SEMANA_*/fuentes/*.md` y los
      `cursos/*/evaluaciones/web/fuentes/*.md` de los cursos aún no organizados
      por semana.
  - name: --variantes alumno,docente
    description: |
      Variantes a generar. `alumno` no lleva clave; `docente` la exige y falla
      con código 4 si no hay `clave:` en el front matter ni archivo de
      respuestas.
  - name: --respuestas <md>
    description: |
      Archivo con las respuestas (`**Answer:** X. ...`). Se valida contra la
      fuente (mismo número de preguntas, enunciado y opciones) y de ahí sale la
      clave de la variante docente. El orquestador lo detecta solo cuando existe
      el hermano `<fuente>_respuestas.md` en la misma carpeta; nunca se convierte
      ese archivo como si fuera un cuestionario.
  - name: --check
    description: Valida las fuentes sin escribir nada.
  - name: --dry-run
    description: Muestra las rutas de salida sin escribir nada.
  - name: --json
    description: Salida JSON por stdout.
  - name: --no-alert
    description: No emite la alerta audible final.

contract:
  front_matter: |
    ---
    curso: CYBERSEGURIDAD
    tipo: cuestionario
    titulo: "ROL ROJO — Cuestionario"
    aviso: "Texto del encabezado"  # opcional; se muestra en un recuadro bajo el título
    semana: 1                  # opcional
    grupo: 1                   # opcional
    variante: 1                # opcional
    grupos: 4                  # opcional; nº de grupos del curso (1..20) para el selector del alumno
    entrega_url: https://...   # opcional; URL https del Worker que recibe y califica la entrega
    puntaje_total: 10          # opcional; por defecto, número de preguntas
    puntos: {1: 1.5, 2: 0.5}   # opcional; debe sumar puntaje_total
    clave: {1: B, 2: A}        # alternativa a --respuestas; si se dan las dos, deben coincidir
    justificacion_items: [7, 10]  # opcional; preguntas que exigen justificación de evidencia
    justificacion_evidencia: [10]  # opcional; subconjunto de justificacion_items que pide pegar un artefacto literal
    retroalimentacion: {1: "..."}  # opcional; solo se muestra en docente
    ---
  aviso: |
    `aviso:` es texto libre escapado y se imprime en `<p class="aviso-cabecera">`
    dentro de `<header class="banda">`, en ambas variantes y también en el
    índice (el publicador lo lee de las páginas de alumno). Sirve para
    instrucciones vigentes para todo el grupo, como «NO consulten sus
    repositorios GitHub para responder el cuestionario». No cambia la huella
    del cuestionario, así que no invalida entregas ya realizadas; por eso se
    decide antes de publicar. Un valor no-texto se rechaza con código 3.

    El bloque «Antes de empezar» que el conversor añade cuando hay
    `entrega_url` NO debe contradecir este aviso: no manda abrir ni consultar
    el repositorio del grupo, solo explica el borrador local, la caducidad y
    que cada pregunta se fija al primer clic. Si el aviso prohíbe consultar el
    repo, las dos instrucciones deben apuntar en el mismo sentido.
  respuestas: |
    Archivo hermano opcional `fuentes/<fuente>_respuestas.md` con la misma
    estructura de preguntas y opciones, más una línea `**Answer:** X. ...` por
    pregunta (`**Hint:**` y `**Explanation:**` se toleran y se ignoran por
    ahora). Es la fuente recomendada de la clave: una sola copia privada, y el
    conversor falla con código 3 si el cuestionario y sus respuestas divergen
    (enunciado, opciones o numeración), que es como se detecta una copia
    desactualizada antes de corregir mal.
  justificaciones: |
    Dos preguntas por cuestionario exigen que el alumno escriba una
    justificación con evidencia de su propio repositorio (archivo, línea, hash,
    salida de `grep`/`diff`). El marcador va en el canónico, después de las
    opciones:

        **Justificación:** Cita el archivo y la línea de tu repositorio que ...

    `justificacion_items` del front matter es la única fuente de verdad de qué
    preguntas la exigen: si el marcador y la lista no coinciden (falta, sobra,
    se repite o menciona una pregunta inexistente), `validar()` falla con código
    3 en vez de elegir en silencio cuál manda. La lista viaja al HTML
    (`const JUSTIFICAR`) y al Worker (`ITEMS_JUSTIFICACION`), y el mínimo de
    caracteres es `MIN_JUSTIFICACION` (40) en los dos lados. La justificación
    se compara también en el cruce fuente/respuestas: una copia desactualizada
    del archivo de respuestas se detecta antes de publicar.

    `justificacion_evidencia` declara, dentro de `justificacion_items`, las
    preguntas cuya respuesta es un artefacto literal que se pide pegar (el árbol
    del repositorio, una línea de `grep`, una fila de tabla). No cambia la
    exigencia ni el mínimo de caracteres; solo evita que el acta marque como
    copia un texto idéntico que dos compañeros del mismo grupo producen sin
    copiar. Debe ser un subconjunto de `justificacion_items`: eximir una pregunta
    que no exige justificación es un error (código 3). El divisor la conserva
    desde el canónico al generar la fuente, y no se embebe en el HTML (la huella
    depende solo de las preguntas).
  borrador: |
    Solo en la variante alumno con `entrega_url` (examen remoto desde casa): la
    página guarda un borrador en `localStorage` y lo restaura al recargar, porque
    un corte de luz o de conexión no puede costar el examen. Guarda datos del
    estudiante, respuestas marcadas, texto de las justificaciones, `pegas` e
    `inicio` (para que `duracion_s` se mida desde la primera carga, no desde la
    última).

    La clave del registro es `cuestionario.v<BORRADOR_VERSION>.<id>.<huella>`,
    donde `huella` son 12 hexadecimales de SHA-256 sobre número, enunciado y
    opciones (`_huella_cuestionario`). La huella NO incluye la respuesta ni la
    instrucción de justificación: retocar esa redacción no invalida lo ya
    respondido, pero un re-barajado sí cambia las opciones y el borrador se
    descarta con un aviso visible en vez de restaurarse sobre otro examen. Caduca
    a las `BORRADOR_CADUCIDAD_HORAS` (24) horas.

    Al enviar con éxito el borrador se **sustituye** por un registro mínimo
    (`enviado`, `enviado_en`, nombre y cédula): no queda el examen resuelto en el
    navegador, y una recarga muestra «Entrega registrada a nombre de ... (C.I.
    ...) el ...» con los controles deshabilitados, en vez de un examen en blanco
    que invite a entregar otra vez (el Worker respondería 409).

    Dos consecuencias deliberadas: el candado de «respuesta fijada» sobrevive a la
    recarga, así que recargar ya no sirve para re-responder, y por eso mismo no
    hay botón de borrar el borrador. `beforeunload` avisa al salir con respuestas
    sin enviar. Si el navegador bloquea `localStorage`, la página degrada al
    comportamiento anterior (sin borrador) y lo dice en la línea de estado.
  preguntas: |
    ## Question N        (o `## Pregunta N`)
    Enunciado en una o varias líneas.
    - A. Texto de la opción.
    - B. ...
    Reglas: numeración 1..N sin huecos, entre 2 y 6 opciones por pregunta,
    letras únicas (A-F), ninguna opción vacía. El markdown inline soportado es
    `código`, **negrita** y *cursiva*. Las fórmulas `$...$` se muestran
    literalmente en esta versión; un examen con matemáticas requiere la fase
    MathML antes de publicarse.

steps:
  - paso: 0
    script: execution/dividir_cuestionario.py --canonico <md_canonico> [--dry-run]
    description: |
      Solo si la fuente llega en formato canónico (con `**Answer:**`, `**Hint:**`,
      `**Explanation:**` dentro de cada bloque). El conversor NO acepta eso:
      `cargar_clave()` lo rechaza como «archivo de respuestas» y, si se colara,
      `_parsear_cuestionario()` pegaría las pistas al texto de la última opción.
      El divisor escribe la fuente sin clave, deja el canónico íntegro en
      `<fuente>_respuestas.md` y verifica la ida y vuelta antes de escribir.
      Es idempotente en el sentido seguro: si el archivo ya no tiene
      `**Answer:**`, falla en vez de sobrescribirlo a ciegas.
  - paso: 1
    script: execution/md_a_html.py --fuente <md> [--respuestas <md_respuestas>] --check
    description: |
      Validar el contrato antes de generar: numeración, opciones y, si hay
      archivo de respuestas, que describa exactamente el mismo examen.
  - paso: 2
    script: execution/md_a_html.py --fuente <md> --variantes alumno
    description: Generar la versión para estudiantes, sin clave.
  - paso: 3
    script: execution/md_a_html.py --fuente <md> [--respuestas <md_respuestas>] --variantes alumno,docente
    description: |
      Generar ambas variantes. La clave sale de `clave:` en el front matter o
      del archivo de respuestas; sin ninguna de las dos, código 4.
  - paso: 4
    script: execution/md_a_html.py (índice)
    description: Regenerar `index.html` con los cuestionarios disponibles.
  - paso: 5
    script: flujo_evaluacion_web.py [--variantes alumno,docente]
    description: |
      Camino recomendado: resuelve todas las fuentes, ignora los
      `*_respuestas.md`, empareja cada cuestionario con su archivo de respuestas
      hermano y encadena el conversor con trazabilidad.

expected_outputs:
  - "HTML autocontenido: CSS inline; la única URL externa es el CDN de MathJax."
  - "`_alumno.html` sin `const CLAVE`; `_docente.html` con clave y aviso."
  - |
    En `_alumno.html`, la respuesta de una pregunta queda **fijada al primer
    clic**: sus radios se deshabilitan y aparece «Respuesta fijada». No hay
    margen para corregir. En `_docente.html` no se fija nada, porque el profesor
    necesita cambiar respuestas para corregir.
  - |
    `_alumno.html` abre con un módulo **Datos del estudiante** (nombre y apellidos,
    cédula de identidad y grupo) como campos obligatorios; no se guardan en el
    archivo ni se envían a ningún lado, y en impresión se dibujan como líneas para
    escribir. El grupo es un selector `1..N` cuando el front matter declara
    `grupos: N` (1..20); sin `grupos`, es un campo numérico. **Mientras falte
    alguno, no se puede responder**: el clic en una opción se revierte, los campos
    vacíos se resaltan y aparece un aviso. La variante docente no lo lleva.
  - "Con `entrega_url`, `_alumno.html` añade el botón «Enviar mis respuestas»: nace deshabilitado y se habilita solo con los datos completos y todas las preguntas respondidas; envía un POST con nombre, cédula, grupo y respuestas, y muestra la nota devuelta. Sin `entrega_url` no hay botón ni peticiones de entrega (MathJax sigue siendo la única URL externa)."
  - "`index.html` determinista, ordenado por nombre de fuente."
  - "Código de salida 0; 3 fuente inválida; 4 falta la clave; 5 ruta rechazada."

edge_cases:
  - caso: "Falta la clave y se pidió docente"
    respuesta: "Código 4. No se inventan respuestas: se pide la clave al usuario o el archivo de respuestas."
  - caso: "El archivo de respuestas no coincide con el cuestionario"
    respuesta: |
      Código 3 con la pregunta concreta que difiere (enunciado, opciones o
      numeración). Es el caso de la copia desactualizada: corregir con esa clave
      calificaría otro examen. Se actualiza el archivo de respuestas, nunca se
      relaja la comprobación.
  - caso: "`clave:` del front matter y archivo de respuestas en desacuerdo"
    respuesta: |
      Código 3: dos fuentes de verdad que divergen. Se elige una (se recomienda
      borrar `clave:` del front matter y dejar solo el archivo de respuestas).
  - caso: "Se pasa el archivo de respuestas como --fuente"
    respuesta: |
      Código 3: la fuente contiene `**Answer:**`. El mensaje remite a
      `--respuestas`. El orquestador además excluye `*_respuestas.md` del glob
      por defecto.
  - caso: "La fuente no tiene front matter"
    respuesta: "El título se toma del primer `# `, el curso de la ruta y el tipo es opcional; la clave sigue siendo obligatoria para docente."
  - caso: "Numeración con huecos o letras duplicadas"
    respuesta: "Código 3 con la lista de problemas; no se genera nada."
  - caso: "La salida no está ignorada por git"
    respuesta: "Código 5. Un examen en un repo público es una fuga, no un detalle."
  - caso: "El examen contiene `$...$`"
    respuesta: "Se renderiza literal y se advierte; no se simula Matemáticas. La fase MathML es un trabajo aparte."
  - caso: "Se pide sobrescribir un HTML existente"
    respuesta: "Se sobrescribe: el HTML es derivado y regenerable; la fuente nunca se toca."

  - caso: "Se va la luz o se cae la conexión a mitad del examen"
    respuesta: |
      El borrador de `localStorage` está en disco y sobrevive: al reabrir la misma
      URL en el mismo navegador y perfil, la página restaura datos, respuestas,
      justificaciones y el reloj, y vuelve a fijar las preguntas ya contestadas.
      Verificado el 2026-11-14 con Chrome headless contra un Worker de pega, en
      cuatro fases: responder y guardar, recargar y restaurar, retomar y enviar,
      recargar tras enviar (más las ramas de caducidad y de huella distinta). No
      sobrevive en incógnito ni en otro navegador o perfil, y el aviso de la
      página se lo dice al alumno antes de que empiece.
  - caso: "El cuestionario se regenera después de que un alumno ya lo abrió"
    respuesta: |
      Cambia la `huella` y el borrador anterior se descarta con el aviso «El
      cuestionario cambió desde tu última visita». Por eso no se re-baraja ni se
      regenera un examen ya publicado: quien hubiera empezado perdería lo
      respondido. Si hay que corregir una errata, se corrige y se asume que nadie
      había entrado todavía.
  - caso: "El enunciado trae una tabla ASCII entre triple backtick"
    respuesta: |
      Se renderiza como `<pre class="bloque-codigo"><code>` con desplazamiento
      horizontal, no como texto corrido dentro de `<p>`. El bloque llega desde
      el markdown porque `unir_enunciado()` conserva los saltos y el separador
      usa la misma función; la huella del cuestionario cambia al corregirlo,
      así que la corrección se hace antes de publicar o con nadie aún dentro.
  - caso: "El navegador del alumno bloquea `localStorage`"
    respuesta: |
      Todo el acceso va dentro de `try/catch`: la página funciona igual que antes
      (sin borrador) y lo dice en la línea de estado («Este navegador no permite
      guardar el borrador: no cierres la pestaña»). No hay fallo silencioso ni se
      bloquea la entrega.
  - caso: "El alumno recarga después de enviar"
    respuesta: |
      Sale «Entrega registrada a nombre de ... (C.I. ...) el ...» con el
      formulario deshabilitado y sin sus respuestas: el registro de entrega no
      guarda el examen resuelto (decisión deliberada, minimiza el dato personal
      que queda en un PC que puede ser prestado). El Worker, además, responde 409
      a una segunda entrega con la misma cédula.

security:
  - "Solo se escribe dentro de cursos/<CURSO>/evaluaciones/web/ o web/SEMANA_NN/, nunca en fuentes/."
  - "La barrera exige que `git check-ignore` confirme que la ruta está ignorada."
  - "La variante alumno no contiene la clave ni retroalimentación."
  - "La variante docente advierte que la clave es visible en el código fuente."
  - "Sin red salvo MathJax: ningún otro recurso externo, ninguna fuente remota, ningún script de CDN."
