name: instrucciones_semana_curso
description: >-
  Emite las instrucciones paso a paso de una semana del curso: qué hacer antes de la
  sesión, objetivo, contenidos, escenario, procedimiento, rol de cada grupo esa
  semana, qué se entrega, cómo se corrige y lista de verificación antes del corte.
  Documento único para todo el curso (no por grupo), guardado como
  `<curso>/docs/semana_NN.{tex,pdf}`. Con `grupo: N` emite además el ejemplo de
  trabajo de ese grupo para la semana, `<curso>/docs/grupo_N_NN.{tex,pdf}`. Con
  `cierre: true` emite el ejemplo único de cierre individual de la semana,
  `<curso>/docs/cierre_NN.{tex,pdf}`, tomado de la entrada `grupo: 0`.
version: 1.2

goal: >-
  Que el estudiante sepa exactamente qué hacer esta semana sin adivinar nada: qué
  preparar en casa, qué pasos ejecutar en el laboratorio, qué aporta su rol y cuándo
  y dónde entregar. El rol de cada grupo es una función pura de `(fase, grupo)`; no
  se sortea ni se decide en el chat.

required_inputs:
  - name: curso
    description: >-
      Ruta al descriptor `curso.yaml`. Bloques consumidos: `meta` (codigo, titulo,
      autor, fecha, fecha_iso, semanas, dedicacion_semanal), `fases`, `semanas`
      (numero, fase, titulo, objetivo, contenidos, herramientas, evaluacion y practica
      con titulo, escenario, pasos, entregable y criterios que suman 10), `grupos`
      (roles, asignacion_inicial, fase_con_roles), `entregas` (plataforma, corte,
      estructura, reglas) y `glosario` (termino, definicion). Si la semana declara
      `glosario: [términos...]`, se imprime la sección "Glosario de la semana" con esas
      entradas del glosario del curso, en el orden declarado. Cada semana puede declarar
      `ejemplos` (lista con `grupo` y `titulo`) para el documento por grupo.

  - name: semana
    description: >-
      Número de semana a emitir (1-based). Debe existir en `semanas` y su fase debe
      existir en `fases`. Si la fase está en `grupos.fase_con_roles`, el documento
      incluye la tabla de roles; si no, se emite como trabajo individual.

  - name: grupo
    description: >-
      Número de grupo (1-based). Si se indica, emite el ejemplo de trabajo de ese grupo
      en vez del documento de la semana. El grupo debe existir, tener rol esa semana y
      la semana debe declarar un `ejemplos` con ese `grupo`; en otro caso es código 3.
      Cada ejemplo consumido: `titulo`, `intro`, `bloques` (titulo, texto, comandos),
      `tabla` (columnas, filas, `anchos` en cm para >4 columnas, nota), `entregable`,
      `estructura`, `comprobaciones` y `avisos`.

  - name: cierre
    description: >-
      Booleano. Si es verdadero, emite el ejemplo único de cierre (trabajo individual)
      desde la entrada `ejemplos` con `grupo: 0`. La cabecera dice "Trabajo individual"
      en vez de "Grupo N"; el resto de la composición es la misma. Mutuamente excluyente
      con `grupo`. Una semana sin entrada `grupo: 0` es código 3.

  - name: salida
    description: >-
      Directorio de salida. Por defecto `<curso>/docs`. El nombre del fichero es
      `semana_<NN>.tex` con su PDF al lado (`grupo_<G>_<NN>.tex` con `--grupo`,
      `cierre_<NN>.tex` con `--cierre`), para que una semana se localice sin abrir el
      descriptor.

steps:
  - action: validar_semana
    script: execution/generar_instrucciones_semana.py
    description: >-
      Comprueba meta, semana existente, fase existente, título, objetivo, contenidos,
      herramientas, práctica completa, criterios que suman 10 y bloque `entregas`. Un
      problema es un fallo ruidoso (código 3), no una omisión.

  - action: redactar_ejemplo
    script: execution/generar_instrucciones_semana.py
    description: >-
      Con `--grupo N` compone el ejemplo de trabajo: ficha (grupo, rol, entrega, corte),
      rol en la práctica, qué aporta al entregable, pasos con comandos en bloque de
      código, tabla de ejemplo, qué guardar en el repositorio (árbol), comprobaciones,
      rúbrica de la semana y avisos. Los títulos de sección llevan `\needspace` para no
      quedarse solos al pie de página, y las tablas de más de 4 columnas usan anchos
      declarados en `anchos` (cm) con `\footnotesize`.

  - action: redactar_instrucciones
    script: execution/generar_instrucciones_semana.py
    description: >-
      Compone el documento: ficha con semana, fase, modalidad, dedicación, instrumento,
      entrega y corte; tareas previas (la semana 1 crea el repositorio y añade al
      docente; las demás lo mantienen); objetivo; contenidos; escenario; pasos;
      herramientas; tabla grupo-rol de esa semana; qué se entrega; rúbrica de la
      semana y lista de verificación.

  - action: compilar_y_verificar
    script: flujo_instrucciones_semana.py
    description: >-
      Compila con `SOURCE_DATE_EPOCH` fijado por `meta.fecha_iso` y comprueba en el
      `.log` que no haya líneas `!` ni `Overfull \hbox`; después verifica en disco que
      el `.tex` y el PDF existen y que el PDF supera el tamaño mínimo.

  - action: alertar
    script: execution/alert_user.py
    description: >-
      Alerta audible al terminar, salvo `--no-alert`. Si el flujo se detiene, alerta de
      error con el motivo.

expected_outputs:
  - "`<curso>/docs/semana_<NN>.tex` y `<curso>/docs/semana_<NN>.pdf`; con `--grupo`, `grupo_<G>_<NN>.{tex,pdf}`; con `--cierre`, `cierre_<NN>.{tex,pdf}`."
  - "El ejemplo no duplica datos de la práctica: los reutiliza del descriptor (criterios, corte, estructura)."
  - "Tabla grupo-rol idéntica a la de la guía y a la del documento de tareas de la fase (misma fuente)."
  - "Glosario al final, solo si `semana.glosario` declara términos; una página propia."
  - "Código de salida 0 solo si compiló sin errores y la entrega existe en disco."

edge_cases:
  - case: La semana no existe
    protocol: >-
      Código 3 con el número pedido y el rango disponible. No se emite un documento
      vacío ni se aproxima a la semana siguiente.

  - case: La semana pertenece a una fase sin roles (evaluación individual)
    protocol: >-
      Se emite igualmente, pero con la sección "Trabajo individual" en lugar de la tabla
      de roles. No se inventan roles para una prueba individual.

  - case: Los criterios de la práctica no suman 10
    protocol: >-
      Código 3: la rúbrica de la semana es un dato del descriptor y debe cerrar en la
      escala del curso. Se corrige `curso.yaml`, nunca el `.tex` de salida.

  - case: Error de LaTeX
    protocol: >-
      Código 4, se conserva el `.log` en `.tmp/latex_build/semana_<codigo>_<NN>/` y se
      informa la primera línea `!`. Se corrige el generador o el dato.

  - case: Se regenera una semana ya emitida
    protocol: >-
      Se sobrescriben `semana_<NN>.tex` y `.pdf`. Mismo descriptor -> mismos bytes; si
      el PDF cambia sin cambiar el YAML, hay un fallo de reproducibilidad que se
      investiga antes de entregar.

  - case: La semana declara un término que no está en el glosario del curso
    protocol: >-
      Código 3 con el término y la semana. El glosario es un dato compartido: se añade
      la entrada en `glosario` (termino + definicion) y se regenera; no se escribe la
      definición en el generador.

  - case: Se pide el cierre y la semana no declara la entrada con grupo 0
    protocol: >-
      Código 3 con la lista de grupos declarados, igual que con `--grupo`. El cierre es
      dato del descriptor, no texto inventado por el orquestador.

  - case: Se pasan `--grupo` y `--cierre` a la vez
    protocol: >-
      Error de uso (código 3 del generador): son dos formas excluyentes de elegir el
      ejemplo; el programa no adivina cuál manda.

  - case: Se pide el ejemplo de un grupo que la semana no declara
    protocol: >-
      Código 3 con la semana y el grupo. El ejemplo es dato del descriptor
      (`semana.ejemplos`), no texto del generador: se añade el bloque con el contenido y
      se regenera.

  - case: Una celda de tabla vale `No`, `Sí`, `On` u `Off` sin comillas
    protocol: >-
      YAML lo convierte en booleano y el PDF imprime `False` en vez de `No`. Toda celda
      que sea literalmente una palabra reservada de YAML va entrecomillada; la
      validación no puede distinguirla de un booleano legítimo, así que la regla es de
      escritura en `curso.yaml`.

  - case: Una tabla del ejemplo tiene más de 4 columnas y no declara `anchos`
    protocol: >-
      Código 3. Con celdas `c` el texto se sale del margen (Overfull \hbox); `anchos`
      (cm) fija el ancho de cada columna y la tabla se compone en `\footnotesize`.

  - case: El docente cambia los pasos de la práctica
    protocol: >-
      Se edita `practica.pasos` en `curso.yaml` y se regeneran la práctica, la semana y
      la tarea de la fase para que los tres documentos coincidan.
