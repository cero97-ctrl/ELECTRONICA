# Directiva: Resolver un problema usando un skill estructurado (Fase 2)
---
goal: >
  Dado un problema de ingeniería/electrónica y uno o más skills destilados de
  libros afines del mismo dominio (SKILL.md + references/ cada uno), resolverlo
  siguiendo las metodologías de los skills y verificar el resultado con un
  oráculo simbólico (SymPy) antes de entregarlo. El resolver hace retrieval
  sobre TODOS los skills y combina los resultados (Opción C): cada skill del
  dominio amplía el campo de conocimiento. El LLM solo formula (análisis +
  código); el retrieval, la ejecución del oráculo y el juicio de éxito son
  deterministas (execution/resolver_skill.py). Si el problema es difícil y la
  confianza del retrieval queda baja, eso indica que conviene añadir más PDFs/skills
  del dominio al campo de conocimiento.

required_inputs:
  - name: problema
    description: Enunciado del problema a resolver (texto libre).
    required: true
  - name: skill
    description: >
      Uno o más directorios de skill generados por flujo_libro_a_skill.py
      (cada uno con SKILL.md y, preferiblemente, references/ con las
      estructuras enriquecidas: metodologías, límites, prerrequisitos, fórmulas).
      Se aceptan varios (--skill a b c); el retrieval se hace sobre todos y se
      combina. Los skills deben ser del mismo dominio o afines (ej. electrónica,
      física) para que la teoría sea complementaria.
    required: true

optional_inputs:
  - name: critico
    description: Escala el tier del enrutador si la tarea es de alto impacto.
    default: false
  - name: task
    description: Tipo de tarea del vocabulario controlado para el enrutador.
    default: calculo_formal
  - name: modelo
    description: ID de modelo OpenRouter explícito (salta el enrutador).
    default: null
  - name: max_reflexion
    description: Rondas máx de reflexión ante errores del oráculo (límite 3).
    default: 3
  - name: top_k / min_score
    description: Afinación del retrieval por embeddings.
    default: 6 / 0.05
  - name: alerta_score / abortar_debil
    description: >
      Umbral de confianza del retrieval. Si el mejor score de las secciones
      recuperadas es < alerta_score (default 0.35) se marca la confianza como
      'baja' y se avisa al usuario; con abortar_debil=true se aborta (exit 3)
      en lugar de solo avisar. Umbral de 'alta' en 0.55. Calibrados con
      evidencia medida (dentro de alcance ~0.45-0.75, fuera ~0.25).
    default: 0.35 / false

steps:
  - step: 1
    name: validacion_entradas
    script: flujo_resolver_skill.py (validación inline, orquestación)
    description: >
      Comprueba que el problema no esté vacío y que TODOS los skills tengan
      SKILL.md. Si algo falla, abortar con código de salida 1.
  - step: 2
    name: enrutamiento_llm
    script: execution/enrutador.py --task <tipo> --tokens N [--critico]
    description: >
      Decisión 100% determinista del tier/modelo (NUNCA razonar el modelo en el
      chat). Si el usuario nombró --modelo, respetarlo como override sin enrutar.
      Default: task calculo_formal → opus (riguroso); rutina → flash.
  - step: 3
    name: resolucion
    script: execution/resolver_skill.py
    description: >
      Sub-etapas internas deterministas y LLM dentro del script:
      a) retrieval por embeddings sobre TODOS los skills → combine y corta al
         top-k global (0 créditos); cada sección se etiqueta con su skill de
         origen; clasifica la confianza del fundamento (alta/media/baja según el
         mejor score vs alerta_score=0.35 y alta=0.55) y reporta el mejor score
         por skill (detección de qué skill aporta y si hace falta añadir más
         PDFs); con confianza baja avisa, o aborta si --abortar-debil;
      b) formulador LLM → análisis paso a paso + bloque SymPy autocontenido;
         con fundamento débil se inyecta un aviso para no forzar fórmulas;
      c) oráculo → ejecución del bloque en sandbox aislado (0 créditos);
      d) reflexión (máx 3) → ante error del oráculo, re-formulación con el error.
  - step: 4
    name: reporte
    script: flujo_resolver_skill.py (guardado + alerta)
    description: >
      Persiste el resultado en .tmp/resolucion_<fecha>.json, registra el estado
      en .tmp/run_state.json y emite alerta audible (success/error).

expected_outputs:
  - >
    JSON en .tmp/resolucion_<fecha>.json con status (ok|error), code, problema,
    skills [lista de directorios], modelo, enrutamiento, confianza_retrieval
    {nivel: alta|media|baja, mejor_score, alerta, alerta_score,
     skills_consultados, skills_sin_secciones, mejor_skill, por_skill
     [{skill, ruta, secciones_recuperadas, mejor_score}]},
    secciones_usadas [{fuente, skill, archivo, titulo, score}],
    analisis, codigo_sympy, resultado_esperado, resultado_oraculo
    {exit_code, stdout, stderr}, resultado_final, reflexiones_usadas y tokens.
  - >
    Exit code del script de ejecución: 0 si el oráculo verificó la solución;
    3 si no se resolvió tras agotar las reflexiones.

edge_cases:
  - case: problema vacío o sin context
    protocol: Abortar (exit 1) antes de gastar créditos.
  - case: skill sin SKILL.md o sin references/
    protocol: >
      Abortar (exit 2 de resolver_skill.py) con mensaje claro. En modo multi-skill,
      un skill sin secciones se omite del retrieval (se reporta en
      skills_sin_secciones) sin abortar, siempre que al menos otro skill aporte
      secciones; si NINGUNO aporta, abortar.
  - case: retrieval sin secciones afines (score < umbral)
    protocol: Abortar (exit 3) y sugerir bajar --min-score o revisar/añadir skills.
  - case: retrieval con fundamento débil (score < alerta_score pero >= min_score)
    protocol: >
      Reportar confianza 'baja' (mejor_score y alerta) en el JSON y avisar al
      usuario en consola, mostrando el mejor score por skill. La resolución
      continúa por defecto (inyectando un aviso al formulador para no forzar
      fórmulas); con --abortar-debil se aborta (exit 3) en su lugar. La confianza
      baja en un problema difícil señala que hace falta añadir más PDFs/skills del
      dominio al campo de conocimiento.
  - case: LLM devuelve JSON inválido o sin codigo_sympy
    protocol: Inyectar feedback y reintentar (cuenta como reflexión).
  - case: oráculo falla (sintaxis, NameError, inseguro, timeout)
    protocol: Inyectar el stderr real al LLM y re-formular; máx 3 rondas.
  - case: 429 / límite de API del proveedor
    protocol: Repetir la llamada con el fallback del enrutador (cadena del
      tier); tras 3 intentos totales, detener y reportar.
  - case: saldo OpenRouter bajo
    protocol: Con saldo < $3, evitar tiers caros (opus) para esta tarea;
      avisar al usuario antes si --critico fuerza opus.
  - case: timeout del sandbox (bloque más lento de N s)
    protocol: Informar en el resultado y sugerir subir --timeout-s.

retry_budget: 3
notas: >
  La capa "razonamiento" del LLM nunca es la validación final: la decisión de
  éxito la toma el oráculo SymPy. La fidelidad de los claims al libro se puede
  auditar después con las secciones_usadas (contraste con los chunks de origen).