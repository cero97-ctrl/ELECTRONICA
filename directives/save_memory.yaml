# Estado HONESTO: capacidad declarada y NO implementada. Los scripts de los
# pasos de abajo no existen en execution/, y esta directiva no tiene orquestador.
# Falta: la capa de datos existe (chroma_db/, rag_system.py) pero no el CLI ni su orquestador.
# Se conserva como roadmap declarado, no como SOP ejecutable. Mientras no se implemente,
# la dimension 'directivas' de la auditoria la cuenta como aviso nombrandola, no
# como fallo silencioso. Ver directives/auditar_repo.yaml (edge case
# declaracion_honesta) y docs/MATENIMIENTO/como_evaluar_higiene.md seccion 3.
Status: planificado

Goal: "Guardar un fragmento de información, aprendizaje o preferencia en la memoria a largo plazo."

Required inputs:
  - content: "El texto o la información que se debe memorizar."
  - category: "Categoría de la memoria (ej. 'error', 'preferencia', 'contexto')."

Steps:
  - step: 1
    action: "Guardar en la base de datos vectorial (ChromaDB)"
    script: "execution/db_save_memory.py"
    inputs:
      content: "{{content}}"
      category: "{{category}}"

Expected outputs:
  - "Confirmación (JSON) de que la memoria se ha guardado exitosamente con su ID generado."

Edge cases:
  - error: "Fallo de conexión a ChromaDB."
    recovery: "Verificar si el directorio de ChromaDB tiene permisos correctos o está corrupto, notificar al usuario."
