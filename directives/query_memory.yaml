# Estado HONESTO: capacidad declarada y NO implementada. Los scripts de los
# pasos de abajo no existen en execution/, y esta directiva no tiene orquestador.
# Falta: la capa de datos existe (chroma_db/, rag_system.py) pero no el CLI ni su orquestador.
# Se conserva como roadmap declarado, no como SOP ejecutable. Mientras no se implemente,
# la dimension 'directivas' de la auditoria la cuenta como aviso nombrandola, no
# como fallo silencioso. Ver directives/auditar_repo.yaml (edge case
# declaracion_honesta) y docs/MATENIMIENTO/como_evaluar_higiene.md seccion 3.
Status: planificado

Goal: "Recuperar información relevante de la memoria a largo plazo basada en una consulta semántica."

Required inputs:
  - query: "La cadena de búsqueda o pregunta sobre la información pasada."
  - limit: "Número máximo de resultados a recuperar (por defecto 3)."

Steps:
  - step: 1
    action: "Buscar en la base de datos vectorial (ChromaDB)"
    script: "execution/db_query_memory.py"
    inputs:
      query: "{{query}}"
      limit: "{{limit}}"

Expected outputs:
  - "Una lista en formato JSON con los fragmentos de memoria recuperados y su puntuación de similitud."

Edge cases:
  - error: "No se encontraron resultados relevantes."
    recovery: "Devolver una lista vacía sin fallar, el agente debe manejar la falta de contexto."
