name: Publicar cuestionario desde Telegram
description: >-
  SOP para publicar los cuestionarios SEMANA_02 de Ciberseguridad desde el bot
  de Telegram del usuario, con comando fijo y doble confirmación.
version: 1.0.0

goal: >-
  Permitir que el usuario autorizado ordene la publicación de la variante alumno
  de los cuatro cuestionarios de SEMANA_02 sin que la lógica de decisión viva en
  el chat ni en un prompt: el bot solo analiza comandos fijos y delega en la capa 3.

security:
  chat_ids: [8671067338]   # procede de telegram_gateway.yaml (fuente única)
  reason: >-
    Sólo el celular del usuario, ya autorizado en el gateway. Los chats no
    incluidos se registran en el log y NO reciben respuesta (política existente).
  token:
    origen: TELEGRAM_PUBLISH_SECRET o, si falta, TELEGRAM_BOT_TOKEN (.env)
    formula: HMAC-SHA256(chat_id|curso|nonce_epoch)[:16]
    window_seconds: 900
    note: >-
      El token se emite en el dry-run y se valida en execution/telegram_publicar.py
      con compare_digest. No se almacena en disco ni viaja a ningún repo.

commands:
  - name: /publicar s02
    effect: solo dry-run; muestra los *_alumno.html que se publicarían
    delegate: execution/telegram_publicar.py -> flujo_publicar_cuestionario.py --dry-run
  - name: "/confirmar s02 <token>"
    effect: push + visibilidad public; el token debe ser el del dry-run reciente
    delegate: execution/telegram_publicar.py -> flujo_publicar_cuestionario.py --push --visibilidad public
  - name: /ocultar s02
    effect: (fuera de este flujo) se ejecuta desde la terminal con --visibilidad private

allowed_courses:
  s02:
    web_dir: cursos/CYBERSEGURIDAD/evaluaciones/web/SEMANA_02
    repo: cero97-ctrl/cuestionarios-ciberseguridad-s02
    label: Ciberseguridad SEMANA_02 (4 roles)

steps:
  - step: 1
    action: >-
      El usuario escribe `/publicar s02`. El gateway verifica el chat_id contra
      directives/telegram_gateway.yaml y llama a execution/telegram_publicar.py.
    layer: orchestration (flujo_telegram.py)
  - step: 2
    action: >-
      telegram_publicar.py valida el comando con vocabulario cerrado, calcula el
      token HMAC y construye el argv de flujo_publicar_cuestionario.py --dry-run.
    layer: execution (telegram_publicar.py)
  - step: 3
    action: >-
      El publicador recolecta SOLO `*_alumno.html`, rechaza marcas de clave y
      arma el índice sin docente. El bot devuelve el resumen con el token.
    layer: execution (publicar_cuestionario.py)
  - step: 4
    action: >-
      Tras revisar el resumen, el usuario escribe `/confirmar s02 <token>`.
      La capa 3 valida el token (caduca en 900 s) y ejecuta push + visibilidad public.
    layer: execution (telegram_publicar.py)
  - step: 5
    action: >-
      El bot responde con repo, visibilidad y URL. Para volver a ocultar se usa
      el flujo de publicación desde la terminal con --visibilidad private.
    layer: orchestration (flujo_telegram.py)

expected_outputs:
  - Mensaje de Telegram con el dry-run y el token de confirmación.
  - Mensaje de Telegram con el resultado del push (repo/visibilidad/URL).
  - Trazabilidad en .tmp/session_log_*.jsonl y bitácora de sesión actualizada.

edge_cases:
  - id: chat_no_autorizado
    protocol: registrar en log y NO responder (hereda la política del gateway).
  - id: comando_texto_libre
    protocol: >-
      rechazar con código 2. No se interpreta lenguaje natural: eso metería
      decisión en el prompt y violaría el guardrail determinista del proyecto.
  - id: token_caducado_o_equivocado
    protocol: rechazar con código 2 y pedir un nuevo /publicar s02.
  - id: curso_desconocido_o_ruta_inyectada
    protocol: >-
      el vocabulario es cerrado (sólo `s02`); nunca se acepta una ruta ni un
      nombre de repo desde Telegram. Cualquier argumento extra se rechaza.
  - id: fuga_de_clave
    protocol: >-
      la barrera vive en execution/publicar_cuestionario.py (código 3). Esta
      capa NO la duplica: delega y reporta el resultado.
  - id: publicador_cae
    protocol: máximo 1 reintento por mensaje; si falla, reportar error al usuario
      y escalar en la sesión. Nunca repetir un push ya confirmado sin orden nueva.
