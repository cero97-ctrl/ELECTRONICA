goal: >
  Enrutar cada requerimiento a un modelo LLM mediante UNA DECISIÓN DETERMINISTA:
  el orquestador (opencode) solo extrae el descriptor estructurado de la petición
  (tipo de tarea, tamaño de entrada medido, criticidad, visión) y delega la elección
  de tier/modelo en execution/enrutador.py, que aplica reglas puras. El mismo
  descriptor produce siempre el mismo resultado.

required_inputs:
  - name: requerimiento
    description: >
      La solicitud del usuario tal como llega al agente. Debe traducirse a un
      descriptor estructurado (parsing de intención, no decisión).
    example: "Genera un examen de la Semana 4 sobre condensadores"

optional_inputs:
  - name: contexto
    description: >
      Contexto adicional de la sesión (archivos mencionados, logs, repositorios,
      resultados previos en .tmp/) que ayude a extraer el descriptor.
    default: ""
  - name: modelo_explicito
    description: >
      Modelo indicado explícitamente por el usuario. Se pasa al enrutador como
      --modelo-explicito (override total).
    default: ""

steps:
  - step: 1
    description: >
      Extraer el descriptor estructurado del requerimiento: --task (vocabulario
      controlado), --tokens o --archivos (tamaño MEDIDO, nunca estimado a ojo),
      --critico, --vision. No decidir el tier en el chat: es parsing, no decisión.
    script: "N/A (extracción del orquestador)"
    inputs:
      requerimiento: "{{requerimiento}}"
      contexto: "{{contexto}}"
    expected_output: >
      Descriptor: {task, tokens|archivos, critico, vision, modelo_explicito}.

  - step: 2
    description: >
      Invocar el router determinista con el descriptor. Reglas puras en el script:
      modelo explícito > umbral de tokens (>50k) > tipo de tarea > criticidad.
    script: "execution/enrutador.py"
    inputs:
      "--task": "{{task}}"
      "--tokens": "{{tokens}}"
      "--archivos": "{{archivos}}"
      "--critico": "{{critico}}"
      "--vision": "{{vision}}"
      "--modelo-explicito": "{{modelo_explicito}}"
    expected_output: >
      JSON: {status, tier, model, fallback, reason, tokens}. Código 0 si ok,
      1 si el tipo de tarea no está en el vocabulario controlado,
      2 si falta --tokens y --archivos.

  - step: 3
    description: >
      Ejecutar el script de execution/ correspondiente al flujo solicitado,
      pasando --api-backend openrouter y --modelo <model> devuelto por el router.
      Si el script falla con 429/error de servicio, escalar por la cadena
      'fallback' devuelta (máx 3 intentos).
    script: "execution/<script_seleccionado>.py"
    inputs:
      "--api-backend": "openrouter"
      "--modelo": "{{model}}"
    expected_output: >
      Salida JSON con status ok (0) o código de error categorizado (1+).

  - step: 4
    description: >
      Validar la salida del script contra los expected_outputs de su directiva.
      Si difiere, diagnosticar causa raíz (lógica, entorno o recursos) antes de
      reintentar; no escalar de tier por motivos de calidad, solo por fallo de
      servicio.
    script: "N/A (validación del orquestador)"
    expected_output: >
      Confirmación de salida correcta o plan de corrección.

  - step: 5
    description: >
      Notificar al usuario el resultado. Emitir alerta audible si el flujo fue
      largo o terminó correctamente.
    script: "execution/alert_user.py"
    inputs:
      tipo: "success"
    expected_output: >
      JSON con status ok.

expected_outputs:
  - name: tarea_enrutada
    description: >
      El script correcto ejecutado con el modelo devuelto por execution/enrutador.py,
      sin llamadas LLM directas desde el chat ni decisión subjetiva del tier.
  - name: telemetria
    description: >
      Cada decisión del router queda registrada en .tmp/routing_log.jsonl
      (tier, tokens, modelo, timestamp) para poder afinar la política.
  - name: resultado_validado
    description: >
      Salida del script verificada contra las expectativas de su directiva.
  - name: notificacion
    description: >
      Alerta audible emitida al completar flujos largos.

edge_cases:
  - case: "El tier elegido devuelve 429 o errores repetidos (capacity limit)"
    recovery: >
      Escalar por la cadena 'fallback' devuelta por el router (determinista y
      cost-aware: flash->deepseek->glm; deepseek->glm->opus;
      opus->deepseek->glm). Máximo 3 intentos totales; si todos fallan,
      detener y reportar.

  - case: "El tipo de tarea no está en el vocabulario controlado"
    recovery: >
      El router devuelve código 1 con tier 'desconocido'. Revisar el descriptor
      extraído (posible error de parsing) o añadir el tipo nuevo al vocabulario
      en execution/enrutador.py (nunca decidir el tier a mano).

  - case: "Falta --tokens y --archivos en la invocación del router"
    recovery: >
      El router devuelve código 2. Medir la entrada (tamaño de archivos o tokens
      de la sesión) antes de re-invocar; el tamaño siempre se mide, nunca se estima.

  - case: "El modelo no devuelve JSON válido o lo entrega truncado"
    recovery: >
      Extraer JSON con el algoritmo de llaves balanceadas (_find_balanced_json,
      .agent/python.md), nunca regex non-greedy. Reintentar el mismo tier hasta
      agotar el retry budget (máx 3); no escalar de tier por calidad de la salida.

  - case: "El backend directo (Groq/OpenAI) devuelve 403 por geo-bloqueo (VE)"
    recovery: >
      Usar siempre OpenRouter o Gemini. Los IDs del enrutamiento funcionan vía
      OpenRouter sin VPN.

  - case: "OpenRouter devuelve 402 por saldo bajo (falta max_tokens o presupuesto)"
    recovery: >
      Respetar OPENROUTER_MAX_TOKENS del .env (default 2048, activo 8192). Vigilar
      saldo con execution/monitor_saldo_openrouter.py; cerca del auto top-up de $10,
      priorizar tiers baratos (flash/deepseek) y evitar opus para no agotar saldo.

  - case: "Kimi K3 no soporta el rol 'developer'"
    recovery: >
      Usar roles system/user con este modelo; pasar el límite de salida como
      max_completion_tokens. Kimi K3 solo se usa por petición explícita del
      usuario (--modelo-explicito); no se enruta automáticamente por su 429
      de capacidad (MODELOS_OPCIONALES en llm_client.py).

metadata:
  version: "2.1"
  created: "2026-08-20"
  author: "opencode"
  referencias:
    - "docs/ARQUITECTURA_ENRUTAMIENTO_LLM/arquitectura_enrutamiento_llm.md"
    - ".agent/enrutamiento.md"
    - "execution/enrutador.py"
    - "execution/llm_client.py"
  env_vars_requeridas:
    - "OPENROUTER_API_KEY"
    - "OPENROUTER_MAX_TOKENS"
  notas: >
    La decisión de tier/modelo es DETERMINISTA y vive en execution/enrutador.py.
    El orquestador (opencode) nunca elige el modelo razonando: solo extrae el
    descriptor y ejecuta. Cambios de política (umbrales, vocabulario, cadenas de
    fallback) se hacen editando ese script y la directiva, no en el chat.