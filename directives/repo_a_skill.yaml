goal: >
  Convertir un repositorio de código (GitHub o directorio local) en un skill de
  agente de referencia rápida de código/API, instalado como skill global en
  ~/.config/opencode/skills/<nombre>/. El skill documenta cómo el repo resuelve
  problemas (funciones y clases públicas con firmas, patrones de uso, ejemplos
  de código reutilizable, configuración, prerrequisitos y glosario) para que el
  asistente pueda aplicar la misma metodología/código en el workspace. El flujo
  entrevista al usuario (fuente, tema, nombre, idioma, filtros de archivos),
  extrae y filtra el contenido del repo de forma determinista, destila el
  contenido con un LLM en un SKILL.md con frontmatter válido y una carpeta
  references/ (perfil referencia_codigo, adaptado a API/código y NO a fórmulas
  SymPy), valida de forma neuro-simbólica los bloques de código generados (con
  bucle de reflexión opcional), y lo instala en el directorio global de skills
  de opencode. Reutilizable para cualquier lenguaje/framework.

required_inputs:
  - name: fuente
    description: >
      URL de un repositorio GitHub (https://github.com/owner/repo, se clona con
      --depth 1 sobre .tmp/) o ruta a un directorio local. Determina la fuente
      de extracción.
    example: "https://github.com/cloudflare/workers-sdk  |  /ruta/a/mi/repo"
  - name: nombre
    description: >
      Nombre del skill en snake_case (solo [a-z0-9_-]). Nombra la carpeta
      destino en global (~/.config/opencode/skills/<nombre>/) y el 'name' del
      frontmatter del SKILL.md. Debe coincidir entre ambos. Default: derivado
      del nombre del repo.
    example: "cloudflare_workers"
    optional_cli: true
  - name: tema
    description: >
      Dominio/para qué sirve el repo (ej. Cloudflare Workers, red de sensores,
      librería de álgebra lineal). Guía el vocabulario y las instrucciones del
      skill de API. Se pregunta si no se provee por CLI.
    example: "Cloudflare Workers — SDK de agentes"
    optional_cli: true

optional_inputs:
  - name: idioma
    description: "Idioma del contenido del skill."
    default: "es"
  - name: incluir
    description: >
      Lista de globs de archivos a INCLUIR (ej. '*.py' '*.md'). Si se omite, se
      incluyen por defecto docs + código fuente (ver extraer_repo_github.py ->
      _EXTENSIONES_DEFAULT), excluyendo binarios/vendor/build/.git/node_modules.
      Opción A confirmada con el usuario.
    default: null
  - name: excluir
    description: >
      Lista de globs de archivos a EXCLUIR (ej. 'tests/*' 'docs/desactualizado/*').
      Se aplica después de incluir.
    default: null
  - name: modelo
    description: "ID de modelo OpenRouter explícito (override del tier del enrutador)."
    default: null
  - name: sobrescribir
    description: "Sobrescribir un skill global existente con el mismo nombre."
    default: false
  - name: dry_run
    description: "Generar el skill en .tmp/ sin instalarlo en global."
    default: false
  - name: no_latex
    description: >
      Saltar la generación del reporte LaTeX (docs/SKILL/<nombre>/). Por defecto
      el flujo convierte SKILL.md + references/ a un documento infográfico con
      PREAMBULO_INFOGRAFIA, lo compila con pdflatex (2 pasadas) y limpia los
      auxiliares, dejando .tex y .pdf en la carpeta destino.
    default: false
  - name: validar_estricto
    description: >
      Abortar la instalación si la validación neuro-simbólica (paso 5) encuentra
      bloques de código inválidos.
    default: false
  - name: reflexion
    description: >
      Número de re-síntesis con --feedback (bucle de reflexión) si la validación
      encuentra bloques inválidos. Máximo respetado: 3 (retry budget del
      framework). Cada re-síntesis consume créditos OpenRouter.
    default: 0

steps:
  - step: 1
    description: >
      Validar la fuente (URL GitHub o ruta local). Conducir la entrevista ligera
      si faltan nombre/tema/idioma (progreso guardado en
      .tmp/entrevista_skill_<nombre>.json). Preguntar el filtrado de archivos
      (opción A: docs+código por defecto, extensible con --incluir/--excluir).
      Confirmar con el usuario el destino global y si se desea sobrescribir.
    script: null
    actor: orquestador

  - step: 2
    description: >
      Extracción determinista del repo. Si la fuente es URL de GitHub se clona
      con --depth 1 a .tmp/repo_clone_<owner-repo>/ (respeta rama si se indica);
      si es local, se usa la ruta tal cual. Lista archivos recursivamente
      (saltando .git/node_modules/vendor/build/venv/__pycache__), filtra por
      extensión (docs+código) con --incluir/--excluir globs opcionales y límite
      de archivos/bytes, y concatena a texto_completo.txt con cabeceras
      '=== ARCHIVO: <ruta> ==='. Genera indice.json (incluidos/excluidos, árbol
      de estructura).
    script: "execution/extraer_repo_github.py"
    inputs:
      --fuente: "{{fuente}}"
      --salida: ".tmp/repo_{{nombre}}_texto/"
      --incluir: "{{incluir}}"
      --excluir: "{{excluir}}"
    expected_output: >
      JSON {status ok, num_archivos, num_excluidos, caracteres, tokens_estimados,
      archivo_texto, fuente}. Código 2 si el repo queda vacío tras filtrar.

  - step: 3
    description: >
      Decisión determinista de tier/modelo para la síntesis. Descriptor:
      --task contexto_masivo (destilación de corpus de código, vocabulario del
      enrutador), --archivos <texto_completo.txt> (token medido por el enrutador).
      No se razona en el chat. Si el usuario pasó --modelo, se respeta como
      override explícito.
    script: "execution/enrutador.py"
    inputs:
      --task: "contexto_masivo"
      --archivos: ".tmp/repo_{{nombre}}_texto/texto_completo.txt"

  - step: 4
    description: >
      Síntesis del skill con PERFIL referencia_codigo. Chunking determinista del
      texto y destilación con LLM vía openrouter_chat (default deepseek, o el
      modelo del enrutador/explícito). Genera SKILL.md (frontmatter name/
      description válido) + references/*.md del esquema de API:
      api.md (funciones/clases públicas con firmas), patrones.md (cómo se
      combinan para resolver problemas típicos), ejemplos.md (código real del
      repo, reutilizable), configuracion.md, prerrequisitos.md, glosario.md.
      NO fuerza formulas.md SymPy: el perfil referencia_codigo usa prompts y
      esquema de archivos adaptados. Aplica _find_balanced_json para extraer el
      JSON del LLM. Reintenta hasta 3 veces si el JSON/skill es inválido.
    script: "execution/sintetizar_skill.py"
    inputs:
      --texto: ".tmp/repo_{{nombre}}_texto/texto_completo.txt"
      --entrevista: ".tmp/entrevista_skill_{{nombre}}.json"
      --nombre: "{{nombre}}"
      --tema: "{{tema}}"
      --idioma: "{{idioma}}"
      --perfil: "referencia_codigo"
      --modelo: "{{modelo}}"
      --salida: ".tmp/skill_{{nombre}}/"
    expected_output: >
      JSON {status ok, skill_dir, archivos, modelo, tokens_consumidos}.

  - step: 5
    description: >
      Validación neuro-simbólica del skill (determinista, sin LLM ni créditos).
      validar_skill_formulas.py --perfil referencia_codigo extrae los bloques
      ```python de SKILL.md + references/ y los valida: sintaxis (ast),
      seguridad de imports y ejecución en sandbox aislado con timeout. Informa
      la presencia de las estructuras de referencia del perfil (api.md,
      patrones.md, ejemplos.md, configuracion.md, glosario.md) como warning.
      Con --reflexion N, si hay bloques inválidos y queda budget (máx 3),
      re-sintetizar pasando --feedback <errores.json> a sintetizar_skill.py
      (consumo de créditos) y revalidar. Con --validar-estricto, abortar antes
      de instalar si quedan bloques inválidos.
    script: "execution/validar_skill_formulas.py"
    inputs:
      --skill: ".tmp/skill_{{nombre}}/"
      --perfil: "referencia_codigo"
    expected_output: >
      JSON {status ok, oraculo, estructuras, bloques[], resumen{total,ok,errores}}.
      Exit 0 sin errores; 3 si hay bloques inválidos; 2 si falta SKILL.md.

  - step: 6
    description: >
      Reporte LaTeX del skill (determinista, sin LLM ni créditos). Convierte
      SKILL.md + references/*.md a un documento con el estilo infográfico
      compartido (PREAMBULO_INFOGRAFIA + \bandaTitulo). Compila con
      compile_latex_code (pdflatex, 2 pasadas), que limpia los auxiliares
      dejando .tex + .pdf en docs/SKILL/<nombre>/. Con --no-latex se salta.
    script: "execution/generar_latex_skill.py"
    inputs:
      --skill: ".tmp/skill_{{nombre}}/"
      --nombre: "{{nombre}}"
      --tema: "{{tema}}"
      --idioma: "{{idioma}}"
      --salida: "docs/SKILL/{{nombre}}/"
    expected_output: >
      JSON {status ok, tex, pdf, compilado, archivos}. El .tex siempre se guarda
      aunque la compilación falle (compilado=false); en ese caso el flujo avisa
      pero NO aborta la instalación del skill.

  - step: 7
    description: >
      Revisión humana del skill generado (resumen de archivos/secciones). Si el
      usuario corrige, re-sintetizar (paso 4) sin superar 3 reintentos. Si
      aprueba, instalar el skill en global.
    script: null
    actor: orquestador + usuario

  - step: 8
    description: >
      Instalación en el directorio global de opencode
      (~/.config/opencode/skills/<nombre>/). Valida el frontmatter y la
      estructura antes de copiar. Con --dry-run solo valida, sin copiar.
      Emite alerta audible y recuerda reiniciar opencode.
    script: "execution/instalar_skill.py"
    inputs:
      --origen: ".tmp/skill_{{nombre}}/"
      --nombre: "{{nombre}}"
      --destino: "~/.config/opencode/skills/"
    expected_output: >
      JSON {status ok|dry_run, destino, archivos_copiados, reiniciar_opencode:true}.

expected_outputs:
  - name: skill_global
    description: >
      Skill instalado en ~/.config/opencode/skills/<nombre>/ con SKILL.md
      (frontmatter name/description) y references/ (api, patrones, ejemplos,
      configuracion, prerrequisitos, glosario).
  - name: skill_local
    description: >
      Copia intermedia en .tmp/skill_<nombre>/ para revisión antes de instalar.
  - name: entrevista_json
    description: >
      Registro de la entrevista en .tmp/entrevista_skill_<nombre>.json (fuente,
      tema, nombre, idioma, filtros, confirmación de instalación global).
  - name: texto_extraido
    description: >
      Texto del repo en .tmp/repo_<nombre>_texto/texto_completo.txt + indice.json
      (archivos incluidos/excluidos, caracteres, tokens estimados, árbol).
  - name: reporte_latex
    description: >
      Reporte del skill en docs/SKILL/<nombre>/ con <nombre>.tex y <nombre>.pdf.
  - name: validacion_skill
    description: >
      Resultado de la validación neuro-simbólica del paso 5, persistido en
      state.validacion_skill.

edge_cases:
  - case: "La URL de GitHub es privada o no existe"
    recovery: >
      extraer_repo_github.py intenta git clone --depth 1; si falla (repo privado
      sin credenciales, o 404), retorna código 1 con el mensaje de git. El flujo
      se detiene. Para repos privados, ofrecer clonar manualmente y usar ruta
      local, o configurar GITHUB_TOKEN para el clone.
  - case: "El repo no tiene código ni docs (solo binarios/imágenes)"
    recovery: >
      Tras el filtrado, extraer_repo_github.py retorna código 2 (0 archivos). El
      flujo avisa y sugiere revisar --incluir para forzar extensiones o acotar la
      fuente. No instalar nada.
  - case: "El repo es enorme y el presupuesto de costo es alto"
    recovery: >
      Antes de la síntesis se muestra el tier/modelo y tokens medidos. Si el
      costo estimado es alto y el usuario lo desea, se propone acotar con
      --incluir/--excluir o --max-archivos/--max-bytes. La decisión es consciente
      del usuario, no automática.
  - case: "El LLM devuelve JSON inválido o skill sin frontmatter válido"
    recovery: >
      sintetizar_skill.py aplica _find_balanced_json y revalida el frontmatter
      (name coincide con carpeta, description presente). Reintenta hasta 3 veces
      (retry budget del framework); si agota, retorna código 3/4 y escala al usuario.
  - case: "El perfil referencia_codigo no genera formulas.md (esperado)"
    recovery: >
      El validador con --perfil referencia_codigo NO lo reporta como faltante
      esperado: usa el esquema de API (api/patrones/ejemplos/configuración/
      glosario). Los warnings de 'estructuras faltantes' corresponden al esquema
      del perfil, no al de libro.
  - case: "Bloques Python inválidos en ejemplos/api (sintaxis, import inseguro)"
    recovery: >
      validar_skill_formulas.py reporta cada bloque con su estado. El flujo avisa
      y continúa por defecto. Con --validar-estricto aborta antes de instalar.
      Con --reflexion N>0 re-sintetiza con --feedback (créditos, budget máx 3).
  - case: "El repo cambia o la ruta local deja de existir"
    recovery: >
      Paso 1 valida la fuente. Para URLs, cada corrida re-clona (--depth 1 sobre
      .tmp/). Para rutas locales, si el directorio no existe, extraer retorna
      código 1 y el flujo se detiene.

metadata:
  version: "1.0"
  created: "2026-09-05"
  author: "agente"
  activacion: >
    Frase típica: "Quiero crear un skill desde un repositorio (GitHub o local)".
    Extraer --repo y opcionalmente --tema/--nombre, e iniciar el paso 1
    (validar fuente + entrevista + filtrado).
  script_principal: "flujo_repo_a_skill.py"
  scripts_ejecucion:
    - "execution/extraer_repo_github.py"
    - "execution/sintetizar_skill.py"
    - "execution/validar_skill_formulas.py"
    - "execution/generar_latex_skill.py"
    - "execution/instalar_skill.py"
  enrutamiento:
    task: "contexto_masivo"
    notas: >
      La síntesis default usa deepseek (contexto masivo). Si el usuario pasa
      --modelo, se respeta como override explícito. La etapa de estructura del
      skill puede requerir max_tokens altos (8192) para ensamblar SKILL.md +
      references.
  consumo_creditos: true
  env_vars_requeridas:
    - "OPENROUTER_API_KEY"
  dependencias_python:
    - "openai"
    - "yaml"
  dependencias_sistema:
    - "git (para clonar repos de GitHub)"
  reiniciar_opencode: >
    Tras instalar un skill, el usuario debe reiniciar opencode: la config no se
    recarga en caliente y el skill no se detectará hasta entonces.
  notas: >
    Este flujo genera skills de REFERENCIA DE CÓDIGO/API (cómo el repo resuelve
    problemas y cómo aplicar su metodología/código en el workspace), no libros
    de fórmulas. Usa --perfil referencia_codigo en sintetizar_skill.py y
    --perfil referencia_codigo en validar_skill_formulas.py (esquema api/
    patrones/ejemplos/configuración en lugar de formulas/metodologias). El
    agente orquestador vive en el repo ELECTRONICA (3 capas, versionable); solo
    el skill generado se instala en global.
