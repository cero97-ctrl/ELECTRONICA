goal: |
  Recoger las entregas que el Worker archivó en el repo privado y convertirlas en
  un acta legible —CSV y PDF— con la nota de cada estudiante, quién no entregó y
  qué filas hay que revisar a mano.

  Sin esto, ver los resultados significaba abrir el repo privado JSON por JSON.
  El acta es de solo lectura sobre lo archivado: no recalifica a nadie ni borra
  entregas, y la nota que devuelve el Worker **no se toma como verdad**: se
  recalcula con la clave vigente y se compara. Si difieren (la clave cambió
  después del envío, o alguien editó el JSON a mano) la fila se marca `revisar` y
  el flujo termina en aviso, porque una nota que no se puede reproducir con la
  clave local no es publicable tal cual.

layer: orchestration

references:
  orchestrator: flujo_acta_cuestionario.py
  scripts: execution/descargar_resultados.py, execution/test_descargar_resultados.py
  input: repo privado `cero97-ctrl/cuestionarios-resultados` → `resultados/<cuestionario>/grupo_<NN>/<cedula>.json`
  clave: cursos/<CURSO>/evaluaciones/web/fuentes/<CUESTIONARIO>.md (+ `_respuestas.md`)
  output: cursos/<CURSO>/evaluaciones/resultados/acta_<cuestionario>.{csv,pdf}
  backend: directives/entregar_respuestas_worker.yaml (quien archiva las entregas)
  tests: python3 execution/test_descargar_resultados.py

required_inputs:
  - name: --fuente MD
    description: |
      Cuestionario del que salen la clave vigente, el número de preguntas, los
      grupos declarados, el curso y el título. La clave se lee con
      `md_a_html.cargar_clave()`, la misma función que usa el flujo de despliegue
      del Worker: una sola definición, para que el acta y el Worker no puedan
      calificar distinto. Por defecto, el cuestionario de Rol Rojo.
  - name: .env → GITHUB_TOKEN_RESULTADOS[_<SUFIJO>]
    description: |
      PAT con `Contents: Read and write` sobre el repo de resultados. Aquí solo se
      usa para **leer**. La variable se **deriva del repo** con la misma regla que
      usa el despliegue del Worker (`execution/token_resultados.py`):
      `cero97-ctrl/cuestionarios-resultados` → `GITHUB_TOKEN_RESULTADOS`;
      `.../cuestionarios-resultados-lab2` → `GITHUB_TOKEN_RESULTADOS_LAB2`. Así un
      curso no despliega con un token y lee con otro. `--token-env <NOMBRE>` manda
      si se pasa. Si la variable no existe, se intenta con `GITHUB_TOKEN`
      (funciona, pero ese token ve todos los repos: preferir el acotado). Sin
      ninguno, código 4.
  - name: --lista CSV|YAML
    description: |
      Nómina opcional con columnas `nombre`, `cedula`, `grupo` (o claves
      `cédula`/`ci`/`documento`). Con ella el acta dice quién no entregó y
      detecta entregas de cédulas que no están en la lista. Sin ella, la
      cobertura no es verificable y el acta lo declara en vez de suponer que
      entregaron todos.
  - name: --repo / --rama
    description: |
      Por defecto salen de `vars.REPO_RESULTADOS` en
      `Proyectos/cuestionarios-worker/wrangler.jsonc` y de la rama `main`. No
      duplicar el nombre del repo en un segundo lugar: el Worker y el acta deben
      mirar al mismo sitio.
  - name: --sin-pdf
    description: |
      Solo CSV. El PDF se compila con `execution/compile_latex.py` en
      `.tmp/latex_build/acta_<cuestionario>/` y se copia al destino; si pdflatex
      deja líneas `!` en el log, el acta CSV sigue siendo válida y el flujo lo
      reporta como aviso en vez de dar por bueno un PDF roto.

contract:
  recalculo: |
    `nota = round(10 * aciertos / preguntas, 2)`, la misma fórmula que
    `calificar()` en `Proyectos/cuestionarios-worker/src/logica.js`. Se comparan
    además `aciertos` y `nota` archivados contra los recalculados; cualquier
    diferencia mayor a 0.005 marca la fila `estado: revisar` y el flujo sale con
    código 5. El acta muestra las dos notas en columnas separadas
    (`nota`, `nota_recalculada`): decidir cuál vale es del docente, no del script.
  normalizacion: |
    Cédula y nombre se normalizan con las mismas reglas que el Worker
    (`v 12.345.678` → `V-12345678`; letras, marcas, espacio, punto, apóstrofo y
    guión en el nombre). Si cambian allá, cambian aquí: una normalización
    divergente rompería el cruce con la nómina en silencio.
  justificaciones: |
    Cada fila trae además `justificaciones` (`ok` / `falta` / `copiada` /
    `n/a`), `duracion_s` y `pegas` (cambios de pestaña o salidas de pantalla que
    la página cuenta). `falta` significa que el archivo no trae la justificación
    de una pregunta declarada en `justificacion_items` o que tiene menos de 40
    caracteres: la nota sigue siendo válida y la fila se marca `revisar`, porque
    el defecto está en la evidencia, no en las respuestas.
    `copiada` lo decide `marcar_copias()`: dos justificaciones de la misma
    pregunta con similitud >= 0.85 (`difflib`) entre alumnos distintos marcan
    **ambas** filas y dejan el aviso con la cédula de la otra. Es una señal para
    leerlas a mano, no una acusación: dos alumnos pueden citar el mismo archivo
    del repositorio compartido y describirlo con palabras parecidas. Por eso la
    fuente puede declarar `justificacion_evidencia`: los ítems que piden pegar
    un artefacto literal (el árbol del repositorio, una salida de consola) quedan
    exentos de la comparación, porque ahí el texto idéntico es lo esperado.
  integridad_de_ruta: |
    La cédula y el grupo del **contenido** deben coincidir con los de la **ruta**
    (`resultados/<cid>/grupo_<NN>/<cedula>.json`). Un archivo movido o renombrado
    a mano se rechaza: el acta se ordena por grupo y un JSON en la carpeta
    equivocada inventaría un grupo.
  privacidad: |
    El acta lleva nombres y cédulas. Antes de escribir, la capa 3 exige que la
    ruta de destino esté ignorada por git (`git check-ignore`); si no lo está,
    código 3 y no escribe nada. El destino por defecto
    (`cursos/<CURSO>/evaluaciones/resultados/`) ya está en `.gitignore`.
  orden: |
    Grupo ascendente, nota recalculada descendente, cédula ascendente. Mismo
    contenido del repo → mismos bytes de acta. No hay "fecha de hoy": la fecha
    del acta es la del último envío (`--fecha` la sobrescribe).

steps:
  - paso: 1
    script: python3 execution/test_descargar_resultados.py
    description: |
      83 aserciones sobre las funciones puras, sin red. Correrlo tras cualquier
      cambio en la normalización, el recálculo o el LaTeX del acta.
  - paso: 2
    script: python3 flujo_acta_cuestionario.py
    description: |
      Descarga y arma el acta. Con 0 entregas termina en 0 y lo dice: no es un
      fallo, es que nadie ha enviado todavía.
  - paso: 3
    script: python3 flujo_acta_cuestionario.py --lista <nomina.csv>
    description: |
      Igual, pero con cobertura: el acta lista a los que no entregaron. Es la
      forma de correrlo cuando la nota va a publicarse.
  - paso: 4
    script: revisión manual del CSV/PDF
    description: |
      Mirar las filas `revisar` y los avisos antes de usar las notas. El flujo
      las imprime y termina con código 5 justamente para que no pasen desapercibidas.

expected_outputs:
  - "CSV con cabecera `grupo,cedula,nombre,aciertos,total,nota,nota_recalculada,enviado_en,estado,archivo,avisos,justificaciones,duracion_s,pegas`, una fila por entrega."
  - "PDF infográfico (longtable de 7 columnas —incluye `J` de justificación—, una fila por estudiante, resumen, caja de cobertura y, si hay filas `revisar`, caja «A revisar a mano» con el motivo de cada una) compilado sin errores `!` ni `Overfull \\hbox`."
  - "Resumen por consola o JSON: entregas, promedio, mejor/peor, por grupo, último envío y cuántas filas hay que revisar."
  - "Con `--lista`: faltantes, sobrantes y cédulas cuyo grupo no coincide con la nómina."
  - "El flujo verifica lo que la capa 3 dijo haber escrito: que el CSV existe, que sus filas coinciden con `entregas` y que el PDF existe y no es un archivo vacío."
  - "Códigos de salida: 0 ok · 1 E/S o verificación fallida · 3 fuente/clave inválida, uso incorrecto o ruta no ignorada · 4 red/credenciales · 5 entregas inválidas o notas que no cuadran."

edge_cases:
  - caso: "Todavía no hay entregas"
    respuesta: |
      Código 0 con `entregas: 0` y un acta que dice «Sin entregas». No es un
      fallo: confundirlo con un error llevaría a sospechar del Worker cuando lo
      que pasa es que nadie envió.
  - caso: "HTTP 401 / 403 / 404 al listar el repo"
    respuesta: |
      Código 4 con el motivo traducido (token inválido / sin permiso / repo o rama
      inexistente). Comprobar el token con
      `gh api repos/cero97-ctrl/cuestionarios-resultados` usando ese mismo PAT.
  - caso: "El árbol del repo llega truncado"
    respuesta: |
      La API trunca árboles grandes. Se aborta con error en vez de generar un
      acta incompleta que parecería completa: un acta que omite estudiantes es
      peor que ninguna.
  - caso: "La nota archivada no coincide con la recalculada"
    respuesta: |
      Fila `estado: revisar`, aviso con las dos notas y código 5. Causa típica: la
      clave cambió después del envío (ver `entregar_respuestas_worker.yaml` →
      «Se cambia la clave del cuestionario»). Decidir cuál vale es del docente.
  - caso: "Cédula o grupo del contenido distintos de los de la ruta"
    respuesta: |
      Registro rechazado y listado en los avisos con la ruta: indica un archivo
      movido a mano. No se incluye en el acta.
  - caso: "Entrega de una cédula que no está en la nómina"
    respuesta: |
      Aparece en `sobrantes` y en los avisos, pero **sí** entra en el acta: pudo
      escribir mal su cédula y borrar la entrega es perderla.
  - caso: "Un estudiante declara en la nómina un grupo distinto del que envió"
    respuesta: |
      Se lista en `grupo_distinto`. Vale el grupo del envío (es el que el
      estudiante eligió en la página), pero hay que mirarlo: puede ser un alumno
      que cambió de grupo y la nómina está vieja.
  - caso: "El PDF no compila"
    respuesta: |
      El CSV se conserva y el PDF se reporta como `null` con el error en los
      avisos; el flujo lo convierte en problema de verificación (código 1). Causa
      vista de verdad: más celdas por fila que columnas declaradas en la
      `longtable` («Extra alignment tab»). Los tests comparan las columnas de la
      cabecera, de las filas y de la especificación para que no vuelva a pasar.
  - caso: "Se quiere el acta fuera de `resultados/`"
    respuesta: |
      Solo en rutas ignoradas por git. `--salida .tmp/acta.csv` sirve para una
      revisión rápida; una ruta trackeable se rechaza con código 3.

consolidar_semana:
  goal: |
    Unir las actas por grupo de una semana en **un solo** documento `(tex, pdf)`
    archivable en `evaluaciones/resultados/SEMANA_NN/`. El acta por rol responde
    «cómo le fue a este grupo»; esta responde «cómo le fue a la semana», en una
    sola tabla donde cada fila conserva su grupo y los faltantes se ven juntos.

    Si el docente decide calificar una inasistencia no justificada con 0, esa
    decisión entra como un descriptor YAML (`--calificaciones`) y se convierte en
    filas con estado `sin_entrega`. **Nunca se edita el CSV ni el PDF a mano**:
    las notas finales salen de las entregas más ese descriptor, y la cobertura se
    mide antes de añadir las filas para que un ausente no se cuente como entrega.

  layer: orchestration
  references:
    orchestrator: flujo_acta_cuestionario.py --consolidar
    scripts: execution/acta_semana.py, execution/calificaciones_inasistencia.py
    input: cursos/<CURSO>/evaluaciones/resultados/acta_*.csv (uno por grupo)
    nominas: .tmp/grupo_<N>.csv con cabecera `grupo,cedula,nombre`
    decision: cursos/<CURSO>/evaluaciones/resultados/calificaciones_inasistencia.yaml
    output: cursos/<CURSO>/evaluaciones/resultados/SEMANA_<NN>/acta_semana_<NN>.{tex,pdf}
    tests: python3 execution/test_acta_semana.py, python3 execution/test_calificaciones_inasistencia.py

  required_inputs:
    - name: --semana N
      description: "Semana a consolidar (entero >= 1). Fija la carpeta `SEMANA_NN` y el nombre base."
    - name: --listas-dir DIR
      description: |
        Carpeta con `grupo_1.csv` … `grupo_N.csv` (misma cabecera que el `--lista`
        del acta). **Sin nómina no se inventan faltantes**: el documento sale con
        «Cobertura no verificable» en vez de decir que todos entregaron.
    - name: --salida-dir DIR
      description: "Destino explícito; por defecto `<resultados>/SEMANA_<NN>`."
    - name: --actas-dir DIR
      description: "Default `cursos/CYBERSEGURIDAD/evaluaciones/resultados`."
    - name: --calificaciones YAML
      description: |
        Opcional. Descriptor de la decisión docente. Debe traer `fecha_decision`
        (ISO), `total_preguntas`, `motivo` y una lista `calificaciones` con
        `cedula`, `nombre`, `grupo` y `nota` (0..10) por ausente. Solo se acepta
        una cédula que figure como faltante en la nómina y que **no** aparezca en
        ningún acta; cualquier otra cosa es código 3 sin escribir nada.

  steps:
    - paso: 1
      script: python3 execution/test_acta_semana.py y python3 execution/test_calificaciones_inasistencia.py
      description: |
        Sin red ni pdflatex: unión por cédula normalizada, orden estable,
        columnas de la tabla (7), faltantes desde la nómina, la caja «A revisar a
        mano», el pie sin remisiones muertas, y las barreras del descriptor de
        inasistencias (cédula ya entregada, foránea, grupo distinto, nota fuera
        de rango, total distinto al de las actas).
    - paso: 2
      script: python3 flujo_acta_cuestionario.py --consolidar --semana 1 --listas-dir .tmp --calificaciones <yaml>
      description: |
        Genera el `.tex`, compila el `.pdf`, y verifica que ambos existen, que el
        `.tex` cierra con `\end{document}`, que el PDF no está vacío y que
        `notas_finales == entregas + sin_entrega_calificados`. Sin
        `--calificaciones` el acta queda como registro de entregas, sin ceros.
    - paso: 3
      script: python3 execution/verificar_pdf.py --pdf <pdf> --log .tmp/latex_build/<job>/<job>.log
      description: |
        Confirmar 0 errores `!` y 0 `Overfull \hbox`. El consolidador ya falla
        con `!`, pero el log es la única fuente de verdad del overfull.

  expected_outputs:
    - "Un `.tex` y un `.pdf` por semana, con resumen (entregas, promedio, mejor/peor, a revisar) y tabla de 7 columnas: G, cédula, nombre, aciertos, nota, J, estado."
    - "Caja de cobertura con los faltantes de **toda** la semana, con su grupo. Si todos están calificados, la caja se llama «Cobertura cerrada» y dice `N entregas + M calificados con 0 · cobertura T/T`, con el motivo de cada uno."
    - "Con `--calificaciones`: resumen con `Calificados con 0`, `Calificaciones finales` y `Promedio final`; el promedio final divide entre TODAS las filas, no solo entre las entregas. La fila del ausente lleva `0/preguntas`, estado `sin_entrega` (icono azul, NO el ⚠ de revisar) y el motivo en la caja."
    - "Fecha del acta = último envío real de la semana (no la del reloj)."
    - "JSON con `entregas` (solo envíos reales), `sin_entrega_calificados`, `notas_finales`, `promedio_final`, `por_grupo`, `faltantes_sin_calificar`, `a_revisar`, `overfull`."
    - "Códigos: 0 ok (overfull solo informa) · 1 E/S o pdflatex sin PDF válido · 3 datos inválidos."

  edge_cases:
    - caso: "Una cédula aparece en dos actas"
      respuesta: |
        Código 3 y no se escribe nada. Es la señal de un alumno que entregó dos
        veces con el mismo `cuestionario_id` o de dos actas generadas con la
        misma nómina; elegir una en silencio perdería la otra entrega.
    - caso: "Se consolidan actas de semanas distintas"
      respuesta: |
        La selección es `acta_*.csv` de **una** carpeta y no lee fechas para
        filtrar. Si la carpeta mezcla semanas, el documento lo dice con la fecha
        del último envío: archivar cada semana en su `SEMANA_NN/` evita el cruce.
    - caso: "Nómina incompleta"
      respuesta: |
        Los faltantes salen de la nómina que se pasa. Si `--listas-dir` trae solo
        dos grupos, los otros dos no figuran como «sin entrega»: se declara la
        cobertura que se verificó, no la que se supone.
    - caso: "El PDF sale con Overfull \\hbox"
      respuesta: |
        Se informa y no falla (cosmético). Si el texto se sale del margen, mirar
        el nombre más largo de la columna `p{5.0cm}` antes de tocar la tabla.
    - caso: "El descriptor califica a alguien que sí entregó"
      respuesta: |
        Código 3 y no se escribe nada. Un mismo alumno no puede tener dos notas:
        la del Worker y la del docente. Si lo que se quiere es corregir la nota,
        se corrige la fuente y se regenera el acta; no se añade una fila.
    - caso: "El descriptor nombra a alguien que no está en la nómina"
      respuesta: |
        Código 3. La cobertura se calcula ANTES de añadir las filas, así que un
        nombre ajeno no puede entrar «porque sí»: o está en `grupo_N.csv` como
        faltante, o la decisión es inventada.
    - caso: "El grupo del descriptor difiere del de la nómina"
      respuesta: |
        Código 3. El acta se ordena por grupo; un grupo divergente colocaría la
        nota en la fila equivocada sin que nadie lo notara en la tabla.
    - caso: "`total_preguntas` no coincide con el de las entregas"
      respuesta: |
        Código 3. Un `0/8` mezclado con entregas `0/10` haría creer que el ausente
        rindió otro cuestionario. El total lo fijan las actas reales.
    - caso: "Falta la recuperación"
      respuesta: |
        No se inventa: si no hay artefactos verificables de una segunda sesión,
        no se fusionan actas y la decisión se registra con su `motivo` y su
        `referencia`. `flujo_fusionar_actas.py` exige actas de recuperación
        reales; forzarlo sería fabricar datos.
