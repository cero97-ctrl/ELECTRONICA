Goal: "Crear diseños de PCB automatizados y generar archivos de fabricación (Gerbers) mediante scripting de KiCad."

Required inputs:
  - netlist: "Archivo netlist o JSON con la definición de componentes y conexiones."
  - output_dir: "Directorio de salida para los Gerbers y archivos de KiCad."

Steps:
  - step: 1
    action: "Ejecutar script de automatización de KiCad"
    script: "execution/kicad_auto_pcb.py"
    inputs:
      netlist_path: "{{netlist}}"
      out_dir: "{{output_dir}}"

Expected outputs:
  - "Archivos .kicad_pcb y conjunto de archivos Gerber listos para fabricación en el directorio indicado."

Edge cases:
  - error: "Librería de footprints no encontrada."
    recovery: "Revisar la configuración de fp-lib-table de KiCad o instalar repositorios necesarios."
