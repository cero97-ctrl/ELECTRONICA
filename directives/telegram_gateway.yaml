name: Telegram Gateway Orchestrator
description: SOP and configuration for the Telegram Long Polling Bot acting as an MCP Gateway
version: 1.0.0

configuration:
  telegram:
    poll_timeout: 30
    parse_mode: Markdown
  
  security:
    # Celular nuevo (reemplaza al ID antiguo 1315284048, dispositivo ya retirado).
    # Obtenido vía modo descubrimiento el 2026-08-22.
    allowed_chat_ids: [8671067338]
    
  mcp_servers:
    # Mapeo de prefijos/comandos a servidores MCP (Layer 2) locales
    # Comando : Script a ejecutar
    latex: mcp_latex_server.py
    evaluar: mcp_evaluar_server.py
    elaborar: mcp_elaborar_server.py
    analizar: mcp_analizar_server.py
    diagnostico: mcp_diagnostico_server.py
    sistema: mcp_sistema_server.py

guidelines:
  - "SECURITY FIRST: Only process commands from chat_ids present in the allowed_chat_ids list. Log rejected attempts but do not reply to them."
  - "LONG POLLING: Use a while loop with HTTP timeouts slightly larger than the Telegram poll_timeout to avoid dropped connections."
  - "ERROR HANDLING: If a local MCP server crashes or times out, format a clean error message for the Telegram user."
  - "JSON-RPC: Convert Telegram commands into properly structured JSON-RPC 2.0 payloads for the local MCP servers."
  - "RESPONSES: Keep responses concise. If an MCP server returns large outputs, consider truncating."
