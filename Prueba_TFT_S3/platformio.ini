[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Configuración del puerto serial
monitor_speed = 115200

; Descargar la librería de la pantalla
lib_deps = 
	bodmer/TFT_eSPI@^2.5.31

; --- CONFIGURACIÓN DE LA PANTALLA ---
build_flags =
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=280
  -D TFT_MOSI=11
  -D TFT_SCLK=12
  -D TFT_CS=10
  -D TFT_DC=9
  -D TFT_RST=14
  -D TFT_BL=21
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D SPI_FREQUENCY=27000000
  -D CGRAM_OFFSET=1
  -D TFT_INVERSION_ON=1
  -D TFT_RGB_ORDER=TFT_RGB
  -D USE_FSPI_PORT=1

