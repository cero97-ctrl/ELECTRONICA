.node circle, .node polygon {

  transition: all 0.2s ease;
}
.node circle:hover, .node polygon:hover { filter: brightness(1.2); }
.node circle.selected, .node polygon.selected {
  stroke: #000 !important;
  stroke-width: 3px !important;
}
.node circle.matched, .node polygon.matched {
  stroke: #ffd700 !important;
  stroke-width: 3px !important;
  animation: pulse 1s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { r: var(--r); }
  50% { r: calc(var(--r) + 3); }
}
.node circle.faded, .node polygon.faded {
  opacity: 0.15;
}
.node text {
  font-size: 13px;
  fill: #2d1b0e;
  font-weight: 500;
  pointer-events: none;

/* Responsive */
@media (max-width: 640px) {

  .contact-note { font-size: 0.75rem; text-align: center; margin-bottom: 0.4rem; width: 100%; }
  
  .legend { display: none; }
}

<script>
const treeData = {"name": "Baltazar Rojas", "children": [{"name": "Francisco Rojas"}, {"name": "Quintina Rojas"}, {"name": "Demetrio Rojas"}, {"name": "Simón Rojas"}, {"name": "María del Rosario Rojas", "children": [{"name": "Andrés Marín Rojas"}, {"name": "Margarita Marín Rojas", "_nota": "Casada con Galo Bravo", "children": [{"name": "Carmen Marín"}, {"name": "Vicente Bravo Marín", "children": [{"name": "Gaspar"}, {"name": "Lorenzo"}, {"name": "Silvestre"}]}, {"name": "Hilario Bravo Marín", "_nota": "Nuestro bisabuelo", "children": [{"name": "Con Cruz del Carmen Figueroa", "_tipo": "union", "children": [{"name": "Carmen Bravo Figueroa de Guevara", "_nota": "Tía Carmita", "children": [{"name": "Con Cruz Carmen Guevara", "_tipo": "union", "children": [{"name": "Luisa Inés Guevara Bravo", "children": [{"name": "Felix Bautista Díaz", "children": [{"name": "Felix Rafael Alemán"}, {"name": "Luisa Inés Díaz Alemán"}, {"name": "Eduardo José Díaz Alemán"}, {"name": "Jean Carlos Díaz Alemán"}, {"name": "Marlene del Valle Díaz Marchán"}, {"name": "Yusbelia Josefina Díaz Marchán"}, {"name": "Gilberto Anibal Díaz Marchán"}, {"name": "Jorge Félix Díaz Marchán"}, {"name": "Oneida Díaz"}, {"name": "Jesus Alejandro Díaz"}]}, {"name": "Luisa Ignacia Díaz Guevara", "children": [{"name": "Pedro Julián Rojas Díaz"}, {"name": "José Francisco Rojas Díaz", "children": [{"name": "Michael Rojas"}, {"name": "Darwin Rojas"}]}, {"name": "Robel Ismael Rojas Díaz"}, {"name": "Nohemí del Carmen Rojas Díaz"}, {"name": "Elio Amado Rojas Díaz"}, {"name": "Lilia Josefina Rojas Díaz"}]}, {"name": "Fernanda del Carmen Díaz Guevara", "children": [{"name": "Elvis José Díaz"}, {"name": "Eliomar José Díaz"}]}, {"name": "Alejandrina Josefina Díaz Guevara", "children": [{"name": "Alexander José Rodríguez Díaz"}, {"name": "Eglis Coromoto Rodríguez Díaz"}, {"name": "Jesus Enrique Rodríguez Díaz"}, {"name": "Eunices del Carmen Rodríguez Díaz"}]}, {"name": "Rómulo Isaías Guevara", "children": [{"name": "Rómulo Guevara"}, {"name": "Migdalia Guevara"}, {"name": "Mariela Guevara"}, {"name": "Mileidis Guevara"}, {"name": "Mariana Guevara"}]}, {"name": "Raul Guevara"}, {"name": "Edicta Guevara"}, {"name": "Félida Guevara"}, {"name": "Luis Antonio Guevara"}]}, {"name": "Olga Guevara Bravo"}, {"name": "Cristóbal Guevara Bravo"}, {"name": "Angélica Guevara Bravo"}]}]}, {"name": "María Eugenia Bravo Figueroa de Gómez", "_nota": "Nuestra abuela"}]}, {"name": "Con Lourdes Ramos", "_tipo": "union", "children": [{"name": "Petra Bravo Ramos"}, {"name": "Cándida Bravo Ramos"}, {"name": "Natividad del Valle Bravo Ramos", "_nota": "El Negro"}, {"name": "Petra María"}, {"name": "José Tomás Bravo Ramos"}]}]}, {"name": "Plácida Bravo Marín", "children": [{"name": "Benigno"}, {"name": "Baltazar"}, {"name": "Celedonio"}, {"name": "Beatriz"}, {"name": "Jesús"}, {"name": "Silvestre"}]}, {"name": "Elena Bravo Marín", "children": [{"name": "Elías Bravo"}]}]}]}]};

const container = document.getElementById('tree-container');
const tooltip = document.getElementById('tooltip');
const detailPanel = document.getElementById('detail-panel');
const searchInput = document.getElementById('search-input');
const searchCount = document.getElementById('search-count');
const legendEl = document.getElementById('legend');

const zoomBehavior = d3.zoom()
  .scaleExtent([0.3, 4])
  .on('zoom', (event) => {
    g.attr('transform', event.transform);
    document.getElementById('zoom-level').textContent = Math.round(event.transform.k * 100) + '%';
  });

const svg = d3.select('#tree-container')
  .append('svg')
  .attr('width', container.clientWidth || 1200)
  .attr('height', container.clientHeight || 1600)
  .call(zoomBehavior);

const g = svg.append('g').attr('transform', 'translate(80,60)');

const isMobile = window.innerWidth <= 640;
const treeLayout = d3.tree().nodeSize(isMobile ? [120, 160] : [160, 200]);
const root = d3.hierarchy(treeData);

root.count();

let currentRoot = root;
let maxDepth = 0;
let selectedNode = null;
let allNodeData = [];

const GEN_COLORS = [
  '#8B4513', '#B85C2E', '#C97D4A', '#D49A6A',
  '#DDB58A', '#E8CCA8', '#d9d0c0'
];

function getColor(depth) {
  return GEN_COLORS[depth % GEN_COLORS.length];
}

function collapseDeep(node) {
  if (node.children) {
    node.children.forEach(c => collapseDeep(c));
    node._children = node.children;
    node.children = null;
  } else if (node._children) {
    node._children.forEach(c => collapseDeep(c));
  }
}

function collapseAll() {
  collapseDeep(currentRoot);
  update(currentRoot);
  closeDetail();
}

function expandAll() {
  currentRoot.each(n => {
    if (n._children) { n.children = n._children; n._children = null; }
  });
  update(currentRoot);
}

function centerRoot() {
  const cx = container.clientWidth / 2;
  const initialTop = 120;
  svg.transition().duration(500).call(
    zoomBehavior.transform,
    d3.zoomIdentity.translate(cx - currentRoot.x, initialTop - currentRoot.y).scale(1)
  );
}

function resetView() {
  svg.transition().duration(500).call(
    zoomBehavior.transform,
    d3.zoomIdentity.translate(80, 60).scale(1)
  );
}

function zoomIn() {
  svg.transition().duration(300).call(zoomBehavior.scaleBy, 1.4);
}

function zoomOut() {
  svg.transition().duration(300).call(zoomBehavior.scaleBy, 0.7);
}

function closeDetail() {
  detailPanel.classList.remove('open');
  selectedNode = null;
  g.selectAll('circle.selected, polygon.selected').classed('selected', false);
}

function isUnion(d) { return d.data._tipo === 'union'; }

function showDetail(d) {
  selectedNode = d;
  document.getElementById('detail-name').textContent = d.data.name;
  document.getElementById('detail-generation').textContent = isUnion(d) ? 'Uni\u00f3n conyugal' : 'Generaci\u00f3n ' + d.depth;

  const parent = d.parent;
  document.getElementById('detail-parent').textContent = parent ? parent.data.name : '(Ra\u00edz)';

  const notaEl = document.getElementById('detail-nota');
  if (d.data._nota) {
    notaEl.textContent = d.data._nota;
    notaEl.style.display = 'block';
  } else {
    notaEl.style.display = 'none';
  }

  const siblings = parent ? parent.children.filter(c => c.data.name !== d.data.name) : [];
  const siblingsList = document.getElementById('detail-siblings');
  siblingsList.innerHTML = '';
  if (siblings.length === 0) {
    siblingsList.innerHTML = '<li class="no-children">(Ninguno)</li>';
  } else {
    siblings.forEach(s => {
      const li = document.createElement('li');
      li.textContent = s.data.name;
      siblingsList.appendChild(li);
    });
  }

  const kids = d.children || d._children || [];
  const childrenList = document.getElementById('detail-children');
  childrenList.innerHTML = '';
  if (kids.length === 0) {
    childrenList.innerHTML = '<li class="no-children">(Sin hijos registrados)</li>';
  } else {
    kids.forEach(k => {
      const li = document.createElement('li');
      li.textContent = k.data.name;
      childrenList.appendChild(li);
    });
  }

  detailPanel.classList.add('open');
}

function update(source) {
  const treeData = treeLayout(currentRoot);
  const nodes = treeData.descendants();
  const links = treeData.links();
  allNodeData = nodes;

  maxDepth = d3.max(nodes, n => n.depth);

  const treeHeight = (maxDepth + 1) * 220 + 120;
  svg.attr('height', Math.max(treeHeight, 800));

  // Update legend
  legendEl.innerHTML = '<div class="legend-item"><span class="legend-diamond" style="background:#c49a6c"></span> Uni\u00f3n</div>';
  legendEl.innerHTML += '<div class="legend-item"><span class="legend-dot" style="background:#ffd700;border-color:#ffd700"></span> Buscado</div>';
  for (let d = 0; d <= maxDepth; d++) {
    const label = d === 0 ? 'Ra\u00edz' : 'Gen ' + d;
    legendEl.innerHTML += '<div class="legend-item"><span class="legend-dot" style="background:' + getColor(d) + '"></span> ' + label + '</div>';
  }

  // ---- LINKS ----
  const link = g.selectAll('path.link')
    .data(links, d => d.target.data.name);

  link.exit().remove();

  const linkEnter = link.enter().append('path')
    .attr('class', d => 'link' + (d.target.data._tipo === 'union' ? ' dashed' : ''))
    .attr('d', d => {
      const o = { x: source.x0 || source.x, y: source.y0 || source.y };
      return `M${o.x},${o.y}C${o.x},${(o.y + d.target.y)/2} ${d.target.x},${(o.y + d.target.y)/2} ${d.target.x},${d.target.y}`;
    });

  link.merge(linkEnter)
    .transition().duration(400)
    .attr('d', d => {
      return `M${d.source.x},${d.source.y}C${d.source.x},${(d.source.y + d.target.y)/2} ${d.target.x},${(d.source.y + d.target.y)/2} ${d.target.x},${d.target.y}`;
    });

  // ---- NODES ----
  const node = g.selectAll('g.node')
    .data(nodes, d => d.data.name);

  node.exit().remove();

  const nodeEnter = node.enter().append('g')
    .attr('class', 'node')
    .attr('transform', d => `translate(${source.x0 || source.x},${source.y0 || source.y})`)
    .on('click', function(event, d) {
      event.stopPropagation();
      
      showDetail(d);
      g.selectAll('circle.selected, polygon.selected').classed('selected', false);
      d3.select(this).select(isUnion(d) ? 'polygon' : 'circle').classed('selected', true);

      const currentTransform = d3.zoomTransform(svg.node());
      const k = currentTransform.k;
      const cx = (container.clientWidth || 1200) / 2;
      const topMargin = 120;
      
      const tx = cx - d.x * k;
      const ty = topMargin - d.y * k;
      
      svg.transition()
        .duration(750)
        .call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(k))
        .on('end', () => {
          if (d._children || d.children) {
            toggleChildren(d);
            update(d);
            
            g.selectAll('circle.selected, polygon.selected').classed('selected', false);
            g.selectAll('g.node').filter(n => n.data.name === d.data.name)
              .select(isUnion(d) ? 'polygon' : 'circle')
              .classed('selected', true);
          }
        });
    })
    .on('mouseover', (event, d) => {
      tooltip.style.opacity = 1;
      tooltip.style.left = (event.pageX + 12) + 'px';
      tooltip.style.top = (event.pageY - 10) + 'px';
      let tip = d.data.name;
      if (d.data._nota) tip += ' \u2014 ' + d.data._nota;
      const hasKids = d.children?.length > 0 || d._children?.length > 0;
      if (hasKids) tip += ' (' + (d.children?.length || d._children?.length) + ' hijos)';
      tooltip.textContent = tip;
    })
    .on('mousemove', (event) => {
      tooltip.style.left = (event.pageX + 12) + 'px';
      tooltip.style.top = (event.pageY - 10) + 'px';
    })
    .on('mouseout', () => {
      tooltip.style.opacity = 0;
    });

  nodeEnter.each(function(d) {
    const el = d3.select(this);
    if (isUnion(d)) {
      const size = 8;
      el.append('polygon')
        .attr('points', `0,${-size} ${size},0 0,${size} ${-size},0`)
        .style('fill', '#c49a6c')
        .style('stroke', '#8B5E3C');
    } else {
      el.append('circle')
        .attr('r', 0)
        .style('fill', d => getColor(d.depth))
        .style('stroke', d => d3.color(getColor(d.depth)).darker(0.5));
    }
  });

  nodeEnter.append('text')
    .attr('dy', 4)
    .attr('x', 14)
    .attr('text-anchor', 'start')
    .attr('class', d => d.depth === 0 ? 'highlight' : (isUnion(d) ? 'union-label' : ''));

  const nodeMerge = nodeEnter.merge(node);

  nodeMerge.transition().duration(400)
    .attr('transform', d => `translate(${d.x},${d.y})`);

  nodeMerge.select('circle')
    .transition().duration(400)
    .attr('r', d => {
      if (d.depth === 0) return 10;
      if (d.children || d._children) return 7;
      return 5;
    })
    .style('fill', d => getColor(d.depth))
    .style('stroke', d => d3.color(getColor(d.depth)).darker(0.5))
    .attr('class', '');

  nodeMerge.select('polygon')
    .transition().duration(400)
    .attr('points', '0,-9 9,0 0,9 -9,0');

  nodeMerge.select('text')
    .selectAll('tspan')
    .data(d => {
      const name = d.data.name;
      if (isUnion(d) && name.startsWith('Con ')) {
        return ['Con', name.substring(4)];
      }
      const words = name.split(' ');
      if (words.length <= 1) return [name];
      let units = [];
      for(let i=0; i<words.length; i++) {
        const w = words[i].toLowerCase();
        if (['de', 'del', 'la', 'las', 'los'].includes(w) && i < words.length - 1) {
          units.push(words[i] + ' ' + words[i+1]);
          i++;
        } else {
          units.push(words[i]);
        }
      }
      if (units.length === 2) return [units[0], units[1]];
      if (units.length === 3) {
        const f = units[0].toLowerCase();
        if (f === 'maría' || f === 'maria' || f === 'josé' || f === 'jose') {
          return [units[0] + ' ' + units[1], units[2]];
        }
        return [units[0], units[1] + ' ' + units[2]];
      }
      if (units.length >= 4) {
        return [units.slice(0, 2).join(' '), units.slice(2).join(' ')];
      }
      return [name];
    })
    .join('tspan')
    .attr('x', 14)
    .attr('dy', (line, i) => i === 0 ? 0 : 16)
    .text(line => line);

  // Re-apply search filter if active
  const query = searchInput.value.trim().toLowerCase();
  if (query) applySearch(query);

  nodes.forEach(d => {
    d.x0 = d.x;
    d.y0 = d.y;
  });
}

function toggleChildren(d) {
  if (d.children) {
    collapseDeep(d);
  } else if (d._children) {
    d.children = d._children;
    d._children = null;
  }
}

// Search
function applySearch(query) {
  const hasQuery = query.length > 0;
  const matches = [];
  g.selectAll('g.node').each(function(d) {
    const shape = d3.select(this).select('circle, polygon');
    const text = d3.select(this).select('text');
    const matched = d.data.name.toLowerCase().includes(query) || (isUnion(d) && d.data.name.replace('Con ', '').toLowerCase().includes(query));
    shape.classed('matched', matched && hasQuery);
    shape.classed('faded', hasQuery && !matched);
    const r = shape.attr('r');
    if (r) shape.style('--r', r);
    text.classed('faded', hasQuery && !matched);
    if (matched && hasQuery) matches.push(d.data.name);
  });
  g.selectAll('path.link').classed('faded', hasQuery);
  searchCount.textContent = hasQuery ? matches.length + ' resultado(s)' : '';
}

searchInput.addEventListener('input', () => {
  const query = searchInput.value.trim().toLowerCase();
  applySearch(query);
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    searchInput.value = '';
    applySearch('');
    searchInput.blur();
  }
});

// Click on background to deselect
svg.on('click', () => {
  closeDetail();
});

// Initialize positions
currentRoot.x0 = 0;
currentRoot.y0 = 0;
currentRoot.descendants().forEach((d, i) => {
  d.x0 = d.x || 0;
  d.y0 = d.y || 0;
});

// Start collapsed: only root visible, progressive expansion
collapseDeep(currentRoot);
update(currentRoot);

// Center root in viewport
const cx = container.clientWidth / 2;
const cy = container.clientHeight / 2;
const initialTop = 120;
svg.call(zoomBehavior.transform, d3.zoomIdentity.translate(cx - currentRoot.x, initialTop - currentRoot.y));

// Resize handler
window.addEventListener('resize', () => {
  svg.attr('width', container.clientWidth || 1200);
});
</script>
</body>
