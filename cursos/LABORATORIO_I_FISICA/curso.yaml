          - '$T - T_a$ ($^\circ$C)'
        filas:
          - ['1', '0,0', '$\ldots$', '$\ldots$']
          - ['2', '0,5', '$\ldots$', '$\ldots$']
          - ['3', '1,0', '$\ldots$', '$\ldots$']
