  - numero: 6
    fase: 2
    tipo: practica
    titulo: 'Densidad de un cuerpo sólido'
    objetivo: >-
      Determinar la densidad de un sólido por la relación masa-volumen y por el
      principio de Arquímedes, comparar ambos resultados y reconocer el material
      a partir de la tabla de densidades.
    contenidos:
      - 'Densidad como propiedad intensiva de la materia.'
      - 'Medición de masa con balanza y de volumen por desplazamiento.'
      - 'Principio de Arquímedes y empuje.'
      - 'Peso aparente y determinación de densidad sin medir el volumen.'
      - 'Propagación de incertidumbres en un cociente.'
      - 'Dependencia de la densidad del agua con la temperatura.'
    herramientas:
      - 'Balanza de precisión de 0,01 g'
      - 'Calibrador y probeta graduada'
      - 'Vaso de precipitados y agua destilada'
      - 'Termómetro digital'
      - 'Hilo fino y paño'
      - 'Sólidos metálicos de distintos materiales'
    evaluacion: 'Práctica con informe'
    practica:
      titulo: 'Densidad de un cuerpo sólido'
      escenario: >-
        Cada grupo recibe varios sólidos metálicos sin identificar. Debe obtener
        la densidad de cada uno por la relación masa-volumen y por pesada
        hidrostática, comparar los dos valores y proponer de qué material se
        trata usando la tabla de densidades.
      fundamento_tex: |
        La densidad es la masa por unidad de volumen:
        \[
          \rho = \frac{m}{V}, \qquad
          \frac{u_\rho}{\rho} = \sqrt{\left(\frac{u_m}{m}\right)^2
                                    + \left(\frac{u_V}{V}\right)^2}.
        \]
        El principio de Arquímedes dice que todo cuerpo sumergido recibe un
        empuje igual al peso del fluido desalojado:
        \[
          E = \rho_f\,V\,g.
        \]
        Si el cuerpo se cuelga de una balanza y se sumerge completamente en el
        fluido, la lectura aparente $m_a$ es menor que la masa real $m$. La
        diferencia de pesos es el empuje:
        \[
          (m - m_a)\,g = \rho_f\,V\,g
          \qquad\Longrightarrow\qquad
          V = \frac{m - m_a}{\rho_f}.
        \]
        Sustituyendo en la definición de densidad,
        \[
          \rho_s = \frac{m}{V} = \rho_f\,\frac{m}{m - m_a}.
        \]
        Así se obtiene la densidad del sólido sin medir su volumen, siempre que
        el cuerpo esté completamente sumergido, no toque las paredes y no tenga
        burbujas adheridas. Si $u_m$ y $u_{m_a}$ son comparables,
        \[
          \frac{u_\rho}{\rho}
          = \sqrt{\left(\frac{u_m}{m}\right)^2
                  + \frac{u_m^2 + u_{m_a}^2}{(m-m_a)^2}}.
        \]
        La densidad del agua cambia con la temperatura (aproximadamente
        $1{,}000$ g/cm$^3$ a $4\,^\circ$C y $0{,}998$ g/cm$^3$ a $20\,^\circ$C);
        usar el valor de la tabla del apéndice y anotar la temperatura del
        ensayo.
      figura_tex: |
        \begin{tikzpicture}[scale=0.85]
          \draw[thick] (2.0,5.5) rectangle (5.0,5.1);
          \node[right] at (5.05,5.3) {balanza};
          \draw[thick] (3.5,5.1) -- (3.5,4.7);
          \draw[thick] (1,0) -- (1,3.2) -- (6,3.2) -- (6,0);
          \fill[cyan!20] (1.08,0.08) rectangle (5.92,2.5);
          \draw[thick] (3.5,4.7) -- (3.5,1.4);
          \fill (3.5,1.4) circle (0.3);
          \node[left] at (3.15,1.4) {sólido};
          \node[right] at (6.05,2.5) {agua};
        \end{tikzpicture}
      figura_caption: 'Pesada hidrostática: la balanza mide el peso aparente del sólido sumergido y la diferencia con su peso real es el empuje'
      materiales:
        - 'Balanza digital con resolución de 0,01 g'
        - 'Calibrador con apreciación de 0,05 mm'
        - 'Probeta graduada de 100 mL'
        - 'Vaso de precipitados de 500 mL'
        - 'Agua destilada'
        - 'Termómetro digital con resolución de 0,1 °C'
        - 'Hilo fino de coser'
        - 'Tres sólidos metálicos de materiales distintos'
      pasos:
        - 'Anotar la temperatura del agua y buscar su densidad en la tabla del apéndice.'
        - 'Pesar cada sólido seco y registrar la masa con su incertidumbre.'
        - 'Medir las dimensiones de cada sólido cinco veces y calcular su volumen geométrico con su incertidumbre.'
        - 'Comprobar el volumen geométrico por desplazamiento de agua en la probeta.'
        - 'Colgar un sólido del gancho de la balanza con el hilo y pesarlo en el aire; anotar la lectura.'
        - 'Sumergir completamente el sólido en el vaso con agua sin que toque el fondo ni las paredes, y anotar la masa aparente.'
        - 'Repetir la pesada hidrostática tres veces por sólido, secando el hilo entre ensayos.'
        - 'Calcular la densidad por ambos métodos y proponer el material de cada sólido.'
      tabla_datos:
        caption: 'Masa, masa aparente y densidad de cada sólido'
        nota: 'Anotar la temperatura del agua y la resolución de la balanza; la masa aparente debe ser menor que la masa real, de lo contrario el sólido no está completamente sumergido.'
        columnas:
          - 'Sólido'
          - '$m$ (g)'
          - '$m_a$ (g)'
          - '$V$ (cm$^3$)'
          - '$\rho$ (g/cm$^3$)'
          - '$\rho_A$ (g/cm$^3$)'
        filas:
          - ['1', '$\ldots$', '$\ldots$', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['2', '$\ldots$', '$\ldots$', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['3', '$\ldots$', '$\ldots$', '$\ldots$', '$\ldots$', '$\ldots$']
      analisis:
        - 'Calcular la densidad de cada sólido por la relación masa-volumen y su incertidumbre.'
        - 'Calcular la densidad por el método de Arquímedes y su incertidumbre.'
        - 'Comparar ambos valores mediante la diferencia porcentual y decidir si coinciden dentro de la incertidumbre combinada.'
        - 'Identificar el material de cada sólido comparando con la tabla de densidades y discutir la ambigüedad cuando dos materiales tienen densidades cercanas.'
        - 'Analizar el efecto de una burbuja de aire adherida al sólido sobre la masa aparente y sobre la densidad calculada.'
        - 'Evaluar si la temperatura del agua introduce una corrección apreciable frente a la incertidumbre de la medición.'
      entregable: >-
        Informe con la tabla de datos, las densidades por ambos métodos con su
        incertidumbre, la identificación propuesta del material y el análisis de
        las fuentes de error.
      criterios: *criterios_practica

  - numero: 7
    fase: 2
    tipo: practica
    titulo: 'Centro de masa de un sistema de dos cuerpos'
    objetivo: >-
      Localizar experimentalmente el centro de masa de un sistema formado por
      una varilla y dos masas, compararlo con el valor calculado a partir de las
      masas y las posiciones, y analizar el efecto de la masa de la varilla.
    contenidos:
      - 'Centro de masa de un sistema discreto.'
      - 'Centro de masa de una varilla uniforme.'
      - 'Equilibrio de un cuerpo extenso y momento de una fuerza.'
      - 'Medición de posiciones respecto de un origen arbitrario.'
      - 'Propagación de incertidumbres en un promedio ponderado.'
    herramientas:
      - 'Varilla metálica de longitud conocida'
      - 'Dos masas con tornillo de fijación'
      - 'Soporte de cuchilla o punto de apoyo'
      - 'Balanza digital'
      - 'Regla milimetrada y calibrador'
      - 'Nivel de burbuja'
    evaluacion: 'Práctica con informe'
    practica:
      titulo: 'Centro de masa de un sistema de dos cuerpos'
      escenario: >-
        Cada grupo monta dos masas sobre una varilla, localiza el punto de
        equilibrio y lo compara con el centro de masa calculado. Debe repetir el
        montaje con tres separaciones distintas y decidir si la masa de la
        varilla puede despreciarse.
      fundamento_tex: |
        Para un sistema de partículas, el centro de masa se define por
        \[
          X_{\mathrm{cm}} = \frac{\sum_i m_i\,x_i}{\sum_i m_i}.
        \]
        Si la varilla también cuenta, con masa $m_v$ y centro en $x_v$,
        \[
          X_{\mathrm{cm}} = \frac{m_1 x_1 + m_2 x_2 + m_v x_v}
                                 {m_1 + m_2 + m_v}.
        \]
        El centro de masa de una varilla uniforme está en su punto medio. Un
        cuerpo extenso colgado de un punto queda en equilibrio cuando la
        vertical que pasa por el punto de suspensión contiene al centro de masa;
        apoyado sobre una cuchilla, el equilibrio se alcanza cuando la cuchilla
        queda directamente debajo de él.

        La incertidumbre del centro de masa calculado se propaga desde las masas
        y las posiciones. Para el caso de dos masas sin varilla,
        \[
          u_{X}^2 = \left(\frac{\partial X}{\partial x_1}u_{x_1}\right)^2
                  + \left(\frac{\partial X}{\partial x_2}u_{x_2}\right)^2
                  + \left(\frac{\partial X}{\partial m_1}u_{m_1}\right)^2
                  + \left(\frac{\partial X}{\partial m_2}u_{m_2}\right)^2.
        \]
        Comparar el centro de masa medido con el calculado es una prueba del
        modelo, no un trámite: si la diferencia supera la incertidumbre, la
        varilla no es despreciable o el punto de apoyo no está donde se cree.
      figura_tex: |
        \begin{tikzpicture}[scale=0.85]
          \draw[thick] (0,0) -- (10,0);
          \fill[gray] (1,0) rectangle (1.8,1.0);
          \fill[gray] (8.2,0) rectangle (9,1.8);
          \node[below] at (1.4,-0.05) {$m_1$};
          \node[below] at (8.6,-0.05) {$m_2$};
          \draw[thick] (6.2,0) -- (6.4,-1.5) -- (6.0,-1.5) -- cycle;
          \draw[->] (0,-2.0) -- (10,-2.0) node[right] {$x$};
          \draw (1.4,-2.0) -- (1.4,-1.7);
          \draw (8.6,-2.0) -- (8.6,-1.7);
          \draw (6.2,-2.0) -- (6.2,-1.7);
          \node[below] at (1.4,-2.0) {$x_1$};
          \node[below] at (6.2,-2.0) {$X$};
          \node[below] at (8.6,-2.0) {$x_2$};
        \end{tikzpicture}
      figura_caption: 'Dos masas sobre una varilla y el punto de apoyo: el sistema está en equilibrio cuando la vertical pasa por su centro de masa'
      materiales:
        - 'Varilla metálica de 1 m con marcas milimetradas'
        - 'Dos masas de 100 g y 200 g con tornillo de fijación'
        - 'Cuchilla o soporte de equilibrio'
        - 'Balanza digital de 0,1 g'
        - 'Regla milimetrada'
        - 'Nivel de burbuja'
      pasos:
        - 'Pesar la varilla y las dos masas, y anotar la incertidumbre de la balanza.'
        - 'Localizar el centro de masa de la varilla sola equilibrándola sobre la cuchilla y anotar la posición.'
        - 'Fijar las masas en dos posiciones conocidas respecto de un extremo de la varilla.'
        - 'Localizar el punto de equilibrio del sistema sobre la cuchilla y anotar la posición.'
        - 'Repetir el montaje con tres separaciones distintas, manteniendo las masas y cambiando sus posiciones.'
        - 'Medir las posiciones de las masas y del punto de equilibrio con la regla, desde el mismo origen.'
        - 'Calcular el centro de masa con y sin la masa de la varilla y comparar con el valor medido.'
        - 'Verificar que la varilla está horizontal con el nivel de burbuja antes de anotar el equilibrio.'
      tabla_datos:
        caption: 'Posiciones y centro de masa del sistema'
        nota: 'Usar un solo origen para todas las posiciones y anotar la masa de la varilla aunque se decida despreciarla después.'
        columnas:
          - 'Montaje'
          - '$m_1$ (g)'
          - '$x_1$ (cm)'
          - '$m_2$ (g)'
          - '$x_2$ (cm)'
          - '$X$ medido (cm)'
        filas:
          - ['1', '$\ldots$', '$\ldots$', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['2', '$\ldots$', '$\ldots$', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['3', '$\ldots$', '$\ldots$', '$\ldots$', '$\ldots$', '$\ldots$']
      analisis:
        - 'Calcular el centro de masa del sistema sin incluir la varilla y su incertidumbre.'
        - 'Calcular el centro de masa incluyendo la masa y la posición del centro de la varilla.'
        - 'Comparar ambos valores con el medido y decidir cuál modelo describe mejor el sistema.'
        - 'Graficar el centro de masa medido frente al calculado para los tres montajes e interpretar la pendiente y el intercepto.'
        - 'Analizar el efecto de un error en la posición del punto de apoyo sobre la comparación.'
        - 'Explicar por qué el centro de masa puede quedar fuera del cuerpo en un sistema con masas muy desiguales.'
      entregable: >-
        Informe con la tabla de los tres montajes, los centros de masa calculados
        con y sin varilla, la comparación con el medido y la conclusión sobre la
        validez de despreciar la masa de la varilla.
      criterios: *criterios_practica

  - numero: 8
    fase: 3
    tipo: practica
    titulo: 'Ley de Hooke y constante elástica'
    objetivo: >-
      Verificar la proporcionalidad entre la fuerza aplicada y el estiramiento
      de un resorte, y determinar su constante elástica a partir de la pendiente
      de un ajuste por mínimos cuadrados.
    contenidos:
      - 'Ley de Hooke y régimen elástico.'
      - 'Fuerza aplicada como peso de masas calibradas.'
      - 'Estiramiento respecto de la posición de equilibrio sin carga.'
      - 'Ajuste lineal de fuerza frente a estiramiento.'
      - 'Constante elástica, unidades y significado físico.'
      - 'Límite elástico y desviación de la linealidad.'
    herramientas:
      - 'Soporte universal con pinza'
      - 'Resorte helicoidal'
      - 'Juego de masas calibradas'
      - 'Regla milimetrada o cinta métrica'
      - 'Balanza digital'
      - 'Calculadora o Python'
    evaluacion: 'Práctica con informe'
    practica:
      titulo: 'Ley de Hooke y constante elástica'
      escenario: >-
        Cada grupo cuelga masas crecientes de un resorte, mide el estiramiento y
        ajusta la recta fuerza-estiramiento. Debe reportar la constante elástica
        con su incertidumbre y señalar hasta qué masa el resorte sigue siendo
        lineal.
      fundamento_tex: |
        Dentro de su régimen elástico, un resorte ejerce una fuerza recuperadora
        proporcional a su deformación:
        \[
          F = -k\,\Delta y.
        \]
        Si se cuelga una masa $m$ y el sistema queda en equilibrio, la fuerza
        aplicada es su peso y
        \[
          m\,g = k\,\Delta y
          \qquad\Longrightarrow\qquad
          k = \frac{m\,g}{\Delta y}.
        \]
        El estiramiento $\Delta y$ se mide respecto de la posición del resorte sin
        carga, no respecto de su longitud natural si el propio porta-pesas ya lo
        estira. Al graficar $P = m\,g$ frente a $\Delta y$ se obtiene una recta
        cuya pendiente es $k$:
        \[
          P = k\,\Delta y.
        \]
        La constante se toma de la pendiente del ajuste, no del promedio de los
        cocientes $P_i/\Delta y_i$, porque el ajuste pondera todos los puntos y
        reduce el efecto del ruido de lectura. La incertidumbre de $k$ se obtiene
        del ajuste. Si los residuales se curvan en los extremos, el resorte salió
        del régimen elástico o las espiras se tocaron.
      figura_tex: |
        \begin{tikzpicture}[scale=0.9]
          \draw[thick] (0.5,6.2) -- (4.5,6.2);
          \draw[thick] (0.5,6.2) -- (0.5,5.9);
          \draw[thick] (4.5,6.2) -- (4.5,5.9);
          \draw[thick] (1.2,5.9) -- (3.8,5.9);
          \draw[thick] (2.5,5.9) -- (2.5,5.5);
          \draw[thick] (2.5,5.5)
            -- (2.2,5.3) -- (2.8,5.1) -- (2.2,4.9) -- (2.8,4.7)
            -- (2.2,4.5) -- (2.8,4.3) -- (2.2,4.1) -- (2.8,3.9)
            -- (2.2,3.7) -- (2.8,3.5) -- (2.2,3.3) -- (2.8,3.1)
            -- (2.5,2.9);
          \draw[thick] (2.5,2.9) -- (2.5,2.6);
          \fill[gray] (2.0,1.6) rectangle (3.0,2.6);
          \draw[dashed] (0.9,5.7) -- (4.1,5.7);
          \draw[dashed] (0.9,2.6) -- (4.1,2.6);
          \draw[<->] (3.7,5.7) -- (3.7,2.6);
          \node[right] at (3.75,4.15) {$\Delta y$};
        \end{tikzpicture}
      figura_caption: 'Resorte con masas colgadas: el estiramiento se mide desde la posición sin carga'
      materiales:
        - 'Soporte universal con pinza y nuez'
        - 'Resorte helicoidal de constante desconocida'
        - 'Juego de masas de 50 g a 500 g'
        - 'Regla milimetrada de 50 cm'
        - 'Balanza digital de 0,1 g'
        - 'Cronómetro para el método dinámico opcional'
      pasos:
        - 'Montar el soporte con el resorte vertical y una regla fija junto a él, sin tocar el resorte.'
        - 'Anotar la posición del extremo inferior del resorte sin carga; esa es la referencia para el estiramiento.'
        - 'Colgar masas crecientes de 50 g en 50 g hasta 500 g, esperando a que el sistema se detenga antes de leer.'
        - 'Anotar la posición del extremo inferior para cada masa y calcular el estiramiento respecto de la referencia.'
        - 'Retirar las masas una a una y comprobar que el resorte recupera su longitud inicial; si no, se superó el límite elástico.'
        - 'Convertir cada masa a peso y ajustar la recta por mínimos cuadrados.'
        - 'Reportar la constante elástica con su incertidumbre y el coeficiente de determinación.'
      tabla_datos:
        caption: 'Masa colgada, peso y estiramiento del resorte'
        nota: 'El estiramiento se mide desde la posición sin carga; si se usa el método dinámico, anotar aparte el periodo de diez oscilaciones para cada masa.'
        columnas:
          - 'Ensayo'
          - '$m$ (g)'
          - '$P$ (N)'
          - '$y_i$ (cm)'
          - '$\Delta y$ (cm)'
        filas:
          - ['1', '50', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['2', '100', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['3', '150', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['4', '200', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['5', '250', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['6', '300', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['7', '350', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['8', '400', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['9', '450', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['10', '500', '$\ldots$', '$\ldots$', '$\ldots$']
      analisis:
        - 'Calcular el peso de cada masa y el estiramiento respecto de la posición sin carga.'
        - 'Graficar el peso frente al estiramiento con barras de incertidumbre.'
        - 'Ajustar la recta por mínimos cuadrados y reportar la pendiente con sus unidades.'
        - 'Calcular la constante elástica en N/m y su incertidumbre a partir del ajuste.'
        - 'Analizar los residuales y decidir en qué rango el resorte cumple la ley de Hooke.'
        - 'Comparar el valor estático con el que se obtendría del método dinámico, si se realizó, y discutir la diferencia.'
      entregable: >-
        Informe con la tabla de datos, la gráfica con el ajuste y los residuales,
        la constante elástica con su incertidumbre y el rango de validez de la
        ley de Hooke.
      ampliacion:
        - 'Método dinámico: colgar cada masa, separarla ligeramente de la vertical y medir el periodo de diez oscilaciones. Al graficar $T^2$ frente a $m$ se obtiene una recta cuya pendiente es $4\pi^2/k$. Compare la constante dinámica con la estática y discuta las fuentes de diferencia.'
      criterios: *criterios_practica

  - numero: 9
    fase: 3
    tipo: practica
    titulo: 'Péndulo simple y determinación de la gravedad'
    objetivo: >-
      Determinar la aceleración de la gravedad a partir de la linealización del
      periodo del péndulo simple y estimar la corrección de longitud asociada al
      centro de masa del cuerpo oscilante.
    contenidos:
      - 'Péndulo simple y aproximación de ángulo pequeño.'
      - 'Periodo, longitud efectiva y centro de masa.'
      - 'Linealización de periodo al cuadrado frente a longitud.'
      - 'Ajuste por mínimos cuadrados y obtención de la gravedad.'
      - 'Interpretación del intercepto como corrección de longitud.'
      - 'Errores dominantes: ángulo, cronometraje y medición de longitud.'
    herramientas:
      - 'Soporte con hilo inextensible'
      - 'Esfera metálica de masa conocida'
      - 'Cinta métrica y calibrador'
      - 'Cronómetro digital'
      - 'Transportador'
      - 'Calculadora o Python'
    evaluacion: 'Práctica con informe y datos reales'
    practica:
      titulo: 'Péndulo simple y determinación de la gravedad'
      escenario: >-
        Cada grupo recibe una tabla de veintiuna longitudes de hilo con el
        tiempo de cinco oscilaciones. Debe linealizar el modelo, ajustar la
        recta, obtener la gravedad y explicar por qué el intercepto no es cero.
        Los datos provienen de una medición real de laboratorio.
      fundamento_tex: |
        Para ángulos pequeños ($\theta \le 10^\circ$), el periodo del péndulo
        simple es
        \[
          T = 2\pi\sqrt{\frac{L}{g}},
        \]
        donde $L = L_H + L_C$ es la longitud efectiva, $L_H$ la longitud del hilo
        y $L_C$ la distancia entre el punto de sujeción y el centro de masa del
        cuerpo. Elevando al cuadrado,
        \[
          T^2 = \frac{4\pi^2}{g}\,L_H + \frac{4\pi^2}{g}\,L_C.
        \]
        Al graficar $T^2$ frente a $L_H$ se obtiene una recta de pendiente
        \[
          m = \frac{4\pi^2}{g}
          \qquad\Longrightarrow\qquad
          g = \frac{4\pi^2}{m},
        \]
        e intercepto $b = m\,L_C$, de donde
        \[
          L_C = \frac{b}{m}.
        \]
        El periodo se mide como $T = t/N$ para $N$ oscilaciones completas; medir
        varias oscilaciones reduce la incertidumbre de reacción humana. El
        cronometraje debe empezar y terminar en la misma posición del péndulo. Un
        ángulo mayor de $10^\circ$ alarga el periodo y hace que la gravedad
        calculada salga mayor que la real. Los datos con errores gruesos se
        reportan, no se borran: el análisis debe explicar por qué se apartan.
      figura_tex: |
        \begin{tikzpicture}[scale=0.95]
          \draw[thick] (0.5,5.6) -- (5.5,5.6);
          \draw[thick] (0.5,5.6) -- (0.5,5.3);
          \draw[thick] (5.5,5.6) -- (5.5,5.3);
