  - numero: 10
    fase: 3
    tipo: practica
    titulo: 'Enfriamiento de un cuerpo sólido'
    objetivo: >-
      Verificar la ley de enfriamiento de Newton en dos cuerpos de distinto
      tamaño, determinar la constante de enfriamiento a partir de una
      linealización y comparar el tiempo característico de ambos.
    contenidos:
      - 'Ley de enfriamiento de Newton y régimen newtoniano.'
      - 'Diferencia de temperatura respecto del ambiente.'
      - 'Linealización logarítmica y constante de enfriamiento.'
      - 'Constante de tiempo y su relación con la geometría del cuerpo.'
      - 'Pérdidas de calor, convección y radiación.'
      - 'Registro temporal con termómetro digital y cronómetro.'
    herramientas:
      - 'Dos sólidos del mismo material y distinto tamaño'
      - 'Termómetro digital con resolución de 0,1 °C'
      - 'Cronómetro digital'
      - 'Plancha o baño de agua caliente'
      - 'Pinzas y guantes térmicos'
      - 'Base aislante y recipiente con agua'
    evaluacion: 'Práctica con informe y cierre del curso'
    practica:
      titulo: 'Enfriamiento de un cuerpo sólido'
      escenario: >-
        Cada grupo calienta dos cuerpos del mismo material y distinto tamaño en
        agua, los retira y registra su temperatura cada 30 s durante 10 min. Debe
        linealizar la ley de enfriamiento, obtener la constante de cada cuerpo y
        explicar por qué el más pequeño se enfría más rápido.
      fundamento_tex: |
        La ley de enfriamiento de Newton supone que la rapidez de pérdida de calor
        es proporcional a la diferencia de temperatura entre el cuerpo y el
        ambiente:
        \[
          \frac{dT}{dt} = -k\,(T - T_a).
        \]
        Con $T(0) = T_0$, la solución es
        \[
          T(t) - T_a = (T_0 - T_a)\,e^{-k t}.
        \]
        Tomando logaritmo natural,
        \[
          \ln\left(T - T_a\right) = \ln\left(T_0 - T_a\right) - k\,t,
        \]
        de modo que al graficar $\ln(T-T_a)$ frente a $t$ se obtiene una recta de
        pendiente $-k$. La constante de tiempo es
        \[
          \tau = \frac{1}{k},
        \]
        el tiempo en que la diferencia de temperatura se reduce a $1/e$ de su
        valor inicial. El modelo supone temperatura uniforme dentro del cuerpo y
        coeficiente de transferencia constante; se cumple mejor cuando la
        diferencia con el ambiente es moderada y el cuerpo es buen conductor. Para
        dos cuerpos del mismo material, la constante de enfriamiento es mayor en
        el de mayor superficie por unidad de volumen, que suele ser el más
        pequeño. La primera parte del registro puede apartarse de la recta
        mientras el cuerpo se estabiliza térmicamente.
      figura_tex: |
        \begin{tikzpicture}[scale=0.85]
          \fill[gray!20] (0.5,0) rectangle (8.5,0.35);
          \draw[thick] (0.5,0.35) -- (8.5,0.35);
          \fill[gray!55] (2.0,0.35) rectangle (3.2,2.3);
          \fill[gray!55] (5.0,0.35) rectangle (7.4,2.3);
          \node[below] at (2.6,0.0) {pequeño};
          \node[below] at (6.2,0.0) {grande};
          \draw[thick] (6.9,4.6) -- (6.9,1.1);
          \fill[red] (6.9,1.1) circle (0.09);
          \node[right] at (6.95,4.6) {termómetro};
        \end{tikzpicture}
      figura_caption: 'Enfriamiento de dos cuerpos del mismo material: se registra la temperatura del más pequeño y del más grande frente al tiempo'
      materiales:
        - 'Dos cilindros de aluminio del mismo material y distinto diámetro'
        - 'Termómetro digital con resolución de 0,1 °C'
        - 'Cronómetro digital con resolución de 0,01 s'
        - 'Plancha de calentamiento o baño de agua caliente'
        - 'Pinzas y guantes térmicos'
        - 'Base aislante de corcho o madera'
        - 'Recipiente con agua a temperatura ambiente'
      pasos:
        - 'Medir la temperatura ambiente y anotarla; debe permanecer estable durante todo el registro.'
        - 'Calentar agua hasta unos 80 °C y sumergir ambos cuerpos hasta que alcancen la misma temperatura.'
        - 'Retirar un cuerpo con las pinzas, secarlo rápidamente y colocarlo sobre la base aislante.'
        - 'Registrar su temperatura cada 30 s durante 10 min con el cronómetro, sin tocar el cuerpo con la mano.'
        - 'Repetir el registro con el segundo cuerpo, partiendo de la misma temperatura inicial.'
        - 'Anotar la temperatura ambiente al inicio, a la mitad y al final del ensayo.'
        - 'Calcular la diferencia de temperatura respecto del ambiente y su logaritmo natural.'
        - 'Graficar y ajustar la recta para cada cuerpo, y comparar sus constantes de enfriamiento.'
      tabla_datos:
        caption: 'Registro temporal de temperatura para cada cuerpo'
        nota: 'Anotar la temperatura ambiente y la resolución del termómetro; usar el mismo intervalo de tiempo para los dos cuerpos y no interrumpir el registro.'
        columnas:
          - 'Ensayo'
