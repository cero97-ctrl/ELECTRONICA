        - 'Calcular la media y la incertidumbre de $d$ y de $h$ con el criterio de la semana anterior.'
        - 'Calcular el volumen geométrico y su incertidumbre con la fórmula de propagación.'
        - 'Llenar la probeta hasta un volumen inicial legible y anotar la resolución de la escala.'
        - 'Sumergir el cilindro con un hilo fino y leer el volumen final; repetir cinco veces secando el cilindro entre ensayos.'
        - 'Calcular el volumen desplazado medio y su incertidumbre a partir del volumen inicial y final.'
        - 'Comparar ambos volúmenes y expresar la diferencia como porcentaje del valor medio.'
      tabla_datos:
        caption: 'Volumen del cilindro por dos métodos independientes'
        nota: 'Reportar cada volumen con su incertidumbre y su unidad; la comparación se hace en la misma unidad y con la misma cantidad de cifras.'
