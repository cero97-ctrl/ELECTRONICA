# Descriptor del curso LABORATORIO I DE FISICA.
# Fuente unica de verdad: todo el material (silabo, plan, guia, talleres,
# practicas, controles, final y rubrica) se genera desde este fichero con
#   python3 flujo_disenar_curso.py --curso cursos/LABORATORIO_I_FISICA/curso.yaml
# Nunca editar a mano los .tex generados: la proxima corrida los sobrescribe.

meta:
  codigo: LABORATORIO_I_FISICA
  titulo: Laboratorio I de Física
  subtitulo: 'Medición, análisis gráfico y propiedades de la materia: del error experimental al informe reproducible'
  autor: Prof. César Rodríguez
  institucion: Universidad de Oriente, Núcleo de Sucre, Departamento de Física
  idioma: es
  anio: 2026
  fecha: 6 de noviembre de 2026
  fecha_iso: '2026-11-06'
  semanas: 10
  grupos: 2
  icono: flask
  duracion_sesion: '3 horas de laboratorio presencial más 2 horas de análisis e informe'
  modalidad: >-
    Laboratorio presencial en mesas de dos grupos con roles rotativos. Las
    cuatro primeras semanas son talleres de teoría de errores y análisis
    gráfico; a partir de la semana 5 cada sesión es una práctica experimental
    con entrega semanal por repositorio privado.
  dedicacion_semanal: '3 horas de laboratorio + 2 horas de análisis e informe'
  version: 1

objetivo_general: >-
  Formar al estudiante en el ciclo completo de una medición: elegir el
  instrumento, tomar datos crudos trazables, expresar el resultado con su
  incertidumbre, analizarlo gráficamente y comunicarlo en un informe que otro
  pueda reproducir. El curso usa las propiedades de la materia, la elasticidad,
  las oscilaciones y el enfriamiento como casos concretos para ejercitar ese
  ciclo, no como una colección de recetas aisladas.

resultados_aprendizaje:
  - id: RA1
    texto: 'Expresar una medición con su incertidumbre, su unidad y sus cifras significativas, distinguiendo apreciación, exactitud y precisión.'
  - id: RA2
    texto: 'Propagar incertidumbres en magnitudes directas e indirectas y decidir cuándo una discrepancia es significativa.'
  - id: RA3
    texto: 'Graficar, linealizar y ajustar por mínimos cuadrados, reportando pendiente, intercepto, sus incertidumbres y los residuales.'
  - id: RA4
    texto: 'Determinar experimentalmente propiedades de la materia (volumen, densidad y centro de masa) y contrastarlas con un método independiente.'
  - id: RA5
    texto: 'Verificar leyes físicas extrayendo sus parámetros de un ajuste lineal, no del promedio de cocientes punto a punto.'
  - id: RA6
    texto: 'Redactar un informe de laboratorio reproducible, con datos crudos, script de análisis y figuras trazables a una tabla.'
  - id: RA7
    texto: 'Trabajar en equipo con roles rotativos, cumpliendo las normas de seguridad y el cuidado del instrumental.'

grupos:
  cantidad: 2
  asignacion: >-
    Dos grupos fijos durante el semestre, de tres a cuatro integrantes cada
    uno. Los roles rotan al inicio de cada fase para que todos los integrantes
    pasen por la medición, el análisis, la documentación y la verificación.
  repositorio: >-
    Cada grupo crea un repositorio privado con el docente como colaborador de
    lectura. El repositorio es la entrega: se revisa al cierre de cada semana y
    es la evidencia del trabajo del semestre.
  roles:
    - nombre: Medición
      descripcion: 'Prepara el montaje, verifica el cero y el rango de cada instrumento, toma las lecturas y anota la resolución con que fueron leídas.'
      aporta: 'La tabla de datos crudos de la semana y el registro de condiciones ambientales e instrumentales.'
      en_la_practica:
        - 'Revisar el montaje contra la figura antes de empezar a medir.'
        - 'Anotar cada lectura con su unidad y su resolución, nunca de memoria.'
        - 'Repetir una lectura sospechosa antes de darla por buena.'
    - nombre: Análisis
      descripcion: 'Propaga incertidumbres, linealiza el modelo, ajusta por mínimos cuadrados y extrae los parámetros físicos.'
      aporta: 'El script de análisis, las figuras con unidades y el presupuesto de incertidumbres del resultado final.'
      en_la_practica:
        - 'Escribir el script que carga los datos crudos sin modificarlos.'
        - 'Ajustar el modelo y reportar parámetro, incertidumbre y residuales.'
        - 'Graficar con ejes rotulados, unidades y banda de incertidumbre.'
    - nombre: Documentación
      descripcion: 'Redacta el informe, integra tablas y figuras, cita las fuentes y mantiene el repositorio ordenado según la estructura acordada.'
      aporta: 'El informe de la semana y el README de la carpeta semanal.'
      en_la_practica:
        - 'Redactar el informe con las secciones obligatorias y en el orden fijado.'
        - 'Verificar que cada cifra del texto salga de una tabla o de un script.'
        - 'Dejar el repositorio limpio y la entrega fechada antes del corte.'
    - nombre: Verificación
      descripcion: 'Contrasta el resultado con el modelo y con una medición independiente, busca errores sistemáticos y firma la trazabilidad de los datos.'
      aporta: 'La comparación con el valor de referencia y la lista de desvíos con su causa probable.'
      en_la_practica:
        - 'Repetir al menos una medida por un método independiente.'
        - 'Explicar cada desvío mayor que la incertidumbre combinada.'
        - 'Confirmar que los datos crudos entregados coinciden con los del cuaderno.'
  asignacion_inicial:
    - Medición
    - Análisis
    - Documentación
    - Verificación
  fase_con_roles: [1, 2, 3]
  rotaciones:
    - 'Semanas 1-2'
    - 'Semanas 3-4'
    - 'Semanas 5-7'
    - 'Semanas 8-10'
  rotacion: >-
    Los roles giran una posición en sentido horario en cuatro rotaciones
    (semanas 1-2, 3-4, 5-7 y 8-10), de modo que al cierre de la última cada
    integrante haya ocupado los cuatro roles.

evaluacion:
  escala: 10
  nota_minima: 5
  pesos:
    - concepto: 'Talleres y prácticas (semanas 1 a 10)'
      peso: 60
    - concepto: 'Controles de fase (semanas 4 y 7)'
      peso: 20
    - concepto: 'Evaluación final práctica y portafolio (semana 10)'
      peso: 20
  rubrica: &criterios_rubrica
    - criterio: fundamento_teorico
      peso: 1.0
      descripcion: 'Presenta el modelo físico con sus supuestos y sus límites, y escribe las ecuaciones que va a contrastar.'
    - criterio: montaje_y_seguridad
      peso: 1.5
      descripcion: 'Montaje correcto contra la figura, instrumentos verificados antes de medir y respeto de las normas de seguridad del laboratorio.'
    - criterio: toma_de_datos
      peso: 2.0
      descripcion: 'Tabla completa con unidades y resolución de cada instrumento, datos crudos sin alterar y condiciones de la medición registradas.'
    - criterio: incertidumbres
      peso: 2.0
      descripcion: 'Presupuesto de incertidumbres explícito: tipo A y tipo B, propagación hasta el resultado final y cifras significativas coherentes.'
    - criterio: analisis_y_graficas
      peso: 2.0
      descripcion: 'Ajuste por mínimos cuadrados con parámetro, incertidumbre y residuales; gráficas con ejes rotulados, unidades y banda de incertidumbre.'
    - criterio: conclusiones
      peso: 1.0
      descripcion: 'Conclusiones individuales que contrastan el dato con el modelo, explican los desvíos y declaran lo que no se pudo verificar.'
    - criterio: presentacion
      peso: 0.5
      descripcion: 'Estructura del informe, legibilidad de tablas y figuras, y repositorio ordenado según la estructura acordada.'

entregas:
  plataforma: GitHub
  modalidad: >-
    Un repositorio privado por grupo, con el docente como colaborador de
    lectura. El repositorio es la entrega; no se reciben informes por correo ni
    impresos, salvo indicación expresa del docente.
  cadencia: >-
    El docente revisa el repositorio al finalizar cada semana y devuelve
    observaciones antes de la semana siguiente.
  corte: >-
    Domingo a las 23:59 de la semana correspondiente. Lo entregado después del
    corte se corrige con la penalización prevista en las políticas.
  carpeta: 'semana_{n:02d}'
  estructura:
    - 'README.md con integrantes, roles por rotación y tabla de semanas entregadas.'
    - 'semana_NN/informe.pdf con el informe de la práctica o el taller resuelto.'
    - 'semana_NN/datos/ con los CSV crudos, uno por ensayo, sin editar.'
    - 'semana_NN/analisis/ con los scripts que reproducen cada figura.'
    - 'semana_NN/figuras/ con las gráficas en PDF o PNG generadas por los scripts.'
    - 'semana_NN/README.md con lo que se hizo, lo que no se pudo verificar y por qué.'
  reglas:
    - 'Los datos crudos no se editan nunca; toda corrección vive en el script de análisis.'
    - 'Cada cifra del informe debe salir de una tabla de datos o de un script entregado.'
    - 'Los scripts se ejecutan de punta a punta sin pasos manuales intermedios.'
    - 'Ninguna tabla se entrega sin unidades ni sin la resolución del instrumento.'
    - 'El informe es grupal, pero las conclusiones se firman individualmente.'
    - 'Un resultado sin incertidumbre no se acepta como resultado.'

laboratorio:
  caracter: >-
    Laboratorio físico de mesa. Cada grupo dispone de un juego de instrumentos
    y de una estación de análisis con Python para procesar sus propios datos.
  recursos: >-
    Mesas con regla milimetrada, calibrador, tornillo micrométrico, balanza,
    probeta, cronómetro, termómetro digital, soportes, resortes, masas
    calibradas y cuerpos sólidos de distintos materiales y tamaños.
  imagenes: []
  red: laboratorio_fisica
  subred: '172.29.0.0/24'
  reglas:
    - 'No se energiza ningún equipo sin revisión previa del docente.'
    - 'Los líquidos se manipulan lejos de las balanzas y de las conexiones eléctricas.'
    - 'Cada instrumento se devuelve limpio, seco y en su estuche al terminar la sesión.'
    - 'El material roto se reporta de inmediato; ocultarlo agrava la sanción.'
    - 'Ningún dato se inventa ni se completa de memoria después de la sesión.'

textos:
  como_funciona: >-
    Las cuatro primeras semanas son talleres de teoría de errores y análisis
    gráfico: se aprende a medir, a propagar incertidumbres y a ajustar antes de
    enfrentarse a un montaje. A partir de la semana 5 cada sesión es una
    práctica experimental completa, con montaje, tabla de datos, análisis y
    entrega. Cada semana el grupo rota los roles y cierra con un informe que
    otro equipo podría reproducir.
  titulo_entregas: 'Portafolio del grupo y entregas'
  titulo_estructura: 'Estructura del repositorio del grupo'
  aviso_entrega: >-
    trabaja solo con el material asignado a tu mesa y con los instrumentos cuyo
    uso haya autorizado el docente. Si un montaje no coincide con la figura o
    un instrumento no responde, detente y consulta; un resultado dudoso se
    reporta, no se corrige a mano.
  aviso_practica: >-
    revisa el montaje contra la figura y verifica el cero y el rango de cada
    instrumento antes de tomar la primera lectura. Si algo no coincide, detente
    y consulta al docente: los datos tomados sobre un montaje dudoso no se
    corrigen después.
  nota_correccion: >-
    Cada informe se corrige con la rúbrica del curso, que se entrega junto con
    el enunciado. La nota es la suma de los criterios, no un promedio: un
    criterio sin evidencia vale cero aunque el resultado numérico sea correcto.
  titulo_politicas: 'Seguridad, honestidad académica y uso del laboratorio'
  plan_entrega: >-
    Cada semana se entrega en GitHub, dentro de la carpeta semana_NN, antes del
    corte del domingo a las 23:59. El docente revisa esa entrega al finalizar la
    semana y devuelve observaciones antes de la siguiente.
  instrucciones_control: >-
    Responda de forma individual y sin apuntes, con calculadora y una hoja de
    fórmulas. Cada respuesta debe justificar el procedimiento, no solo dar el
    número; se valoran la coherencia de las unidades, el manejo de las cifras
    significativas y la interpretación física del resultado.
  contrato_ejemplo: |
    {
      "status": "ok",
      "documento": "semana_05",
      "magnitud": "volumen",
      "valor": 12.43,
      "unidad": "cm^3",
      "incertidumbre": 0.08,
      "datos": "datos/volumen.csv",
      "figuras": ["figuras/volumen_metodos.pdf"],
      "modelo": "V = pi d^2 h / 4",
      "parametros": {"d": 2.00, "h": 3.96}
    }
  reglas_codigo:
    - 'El script parte de los CSV crudos y termina en las figuras del informe, sin pasos manuales.'
    - 'Toda cifra del informe se calcula en el script; nada se teclea a mano.'
    - 'Las unidades se declaran en el CSV y en los ejes de cada figura.'
    - 'El ajuste reporta parámetro, incertidumbre, coeficiente de determinación y residuales.'
    - 'Sin credenciales ni rutas absolutas: el script corre desde la carpeta de la semana.'

fases:
  - id: 1
    nombre: 'Medición, error y análisis gráfico'
    semanas: [1, 2, 3, 4]
    enfoque: >-
      Aprender a medir antes de medir cosas difíciles: apreciación, tipos de
      error, propagación, gráficas, linealización y ajuste por mínimos
      cuadrados, ejercitados con datos propios.
    icono: ruler-combined
  - id: 2
    nombre: 'Propiedades de la materia y equilibrio'
    semanas: [5, 6, 7]
    enfoque: >-
      Medir volumen, densidad y centro de masa con dos métodos independientes,
      y usar la discrepancia entre ambos como criterio de control del montaje.
    icono: cube
  - id: 3
    nombre: 'Elasticidad, oscilaciones y calor'
    semanas: [8, 9, 10]
    enfoque: >-
      Extraer parámetros físicos de ajustes lineales: constante elástica,
      aceleración de la gravedad y constante de enfriamiento, con sus
      incertidumbres y sus modelos de linealización.
    icono: thermometer-half

# ── Semanas ───────────────────────────────────────────────────────────────────

semanas:
  - numero: 1
    fase: 1
    tipo: teoria
    titulo: 'La medición, la apreciación y el error'
    objetivo: >-
      Distinguir apreciación, exactitud y precisión, expresar una lectura con su
      incertidumbre y decidir cuántas cifras significativas tiene sentido
      reportar.
    contenidos:
      - 'Magnitud, unidad y patrón; magnitudes directas e indirectas.'
      - 'Apreciación de un instrumento de escala dividida y de un instrumento digital.'
      - 'Exactitud frente a precisión; errores sistemáticos y aleatorios.'
      - 'Error absoluto, relativo y porcentual.'
      - 'Valor medio, desviación estándar y desviación estándar de la media.'
      - 'Incertidumbre tipo A y tipo B; incertidumbre combinada.'
      - 'Cifras significativas y reglas de redondeo.'
    herramientas:
      - 'Regla milimetrada'
      - 'Calibrador o pie de rey'
      - 'Tornillo micrométrico'
      - 'Cronómetro digital'
      - 'Calculadora'
    evaluacion: 'Taller formativo con entrega'
    practica:
      titulo: 'Medición, apreciación y expresión de resultados'
      escenario: >-
        Cada grupo recibe tres instrumentos con distinta apreciación y un juego
        de cuerpos. Debe medir la misma longitud con los tres, repetir diez
        veces la lectura con el instrumento de menor apreciación y decidir cuál
        de las tres expresiones del resultado es defendible.
      fundamento_tex: |
        Medir es comparar una magnitud con un patrón y expresar el resultado con
        una incertidumbre. La \emph{apreciación} $A$ de un instrumento de escala
        dividida es la menor división legible:
        \[
          A = \frac{L_s - L_i}{n},
        \]
        donde $L_s$ y $L_i$ son los extremos del intervalo que abarca $n$
        divisiones. La \emph{exactitud} es la cercanía al valor verdadero; la
        \emph{precisión} es la reproducibilidad de las lecturas. Un instrumento
        puede ser preciso e inexacto a la vez.

        Para $n$ lecturas $x_k$ de la misma magnitud, el valor central es la media
        \[
          \bar{x} = \frac{1}{n}\sum_{k=1}^{n} x_k,
        \]
        y la incertidumbre tipo A es la desviación estándar de la media
        \[
          u_A = \frac{s}{\sqrt{n}}, \qquad
          s = \sqrt{\frac{1}{n-1}\sum_{k=1}^{n}\left(x_k-\bar{x}\right)^2}.
        \]
        La incertidumbre tipo B asociada a la escala se estima como
        $u_B = A/\sqrt{12}$ si la lectura puede caer en cualquier punto de la
        división, o como $u_B = A/2$ en el criterio conservador. La incertidumbre
        combinada es
        \[
          u = \sqrt{u_A^2 + u_B^2}.
        \]
        El resultado se escribe $x = \bar{x} \pm u$, con su unidad y con la
        incertidumbre redondeada a una cifra significativa (dos si la primera es
        uno). El error relativo es $\epsilon_r = u/\bar{x}$ y el error porcentual
        es $100\,\epsilon_r$ por ciento.
      figura_tex: |
        \begin{tikzpicture}[scale=1.0]
          \draw[thick] (0,0) rectangle (10,0.6);
          \foreach \x in {0,1,...,10} \draw (\x,0) -- (\x,0.35);
          \draw (7.3,0.6) -- (7.3,1.2);
          \node[above] at (7.3,1.2) {lectura};
          \node[below] at (0,-0.05) {0};
          \node[below] at (5,-0.05) {5};
          \node[below] at (10,-0.05) {10 cm};
        \end{tikzpicture}
      figura_caption: 'Escala dividida: la apreciación es la menor división que se puede leer con certeza'
      materiales:
        - 'Regla milimetrada de 30 cm'
        - 'Calibrador con apreciación de 0,05 mm'
        - 'Tornillo micrométrico con apreciación de 0,01 mm'
        - 'Bloque metálico, cilindro y esfera'
        - 'Cronómetro digital'
      pasos:
        - 'Determinar la apreciación de los tres instrumentos a partir de su escala o de su manual, y anotarla en el cuaderno.'
        - 'Medir la misma dimensión del bloque con la regla, el calibrador y el tornillo, una vez con cada uno, y registrar las tres lecturas.'
        - 'Repetir diez veces la medición con el calibrador, variando ligeramente el punto de contacto, sin cambiar de objeto.'
        - 'Calcular la media, la desviación estándar de la media y la incertidumbre tipo B de cada instrumento.'
        - 'Escribir el resultado de cada instrumento con su incertidumbre combinada y decidir cuál es más confiable y por qué.'
        - 'Medir con el cronómetro el tiempo de diez oscilaciones de un péndulo improvisado con el bloque y un hilo, y estimar la incertidumbre de reacción humana.'
        - 'Comparar la incertidumbre de la regla con la del tornillo y explicar por qué la diferencia no es un error de quien mide.'
      tabla_datos:
        caption: 'Registro de lecturas repetidas con el calibrador'
        nota: 'Anotar la apreciación de cada instrumento y mantener las diez lecturas aunque alguna parezca anómala; la anomalía también es dato.'
        columnas:
          - 'Ensayo'
          - '$L$ (mm)'
          - '$(L-\bar{L})$ (mm)'
          - '$(L-\bar{L})^2$ (mm$^2$)'
        filas:
          - ['1', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['2', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['3', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['4', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['5', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['6', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['7', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['8', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['9', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['10', '$\ldots$', '$\ldots$', '$\ldots$']
      analisis:
        - 'Calcular $\bar{L}$, $s$ y $u_A$ de las diez lecturas.'
        - 'Calcular $u_B$ con la apreciación del calibrador y compararla con $u_A$; decidir cuál domina.'
        - 'Expresar el resultado como $L = \bar{L} \pm u$, con la unidad y con las cifras significativas correctas.'
        - 'Calcular el error relativo y el porcentual de la medición con el calibrador.'
        - 'Comparar las tres expresiones del resultado y justificar cuál se reportaría en un informe.'
        - 'Discutir si la diferencia entre instrumentos es un error sistemático o una diferencia de resolución.'
      entregable: >-
        Taller resuelto con la tabla de diez lecturas, el cálculo completo de la
        media y las incertidumbres, la expresión final del resultado y un párrafo
        que justifique el instrumento elegido.
      criterios: &criterios_taller
        - criterio: 'Fundamento y vocabulario metrológico'
          peso: 2.0
        - criterio: 'Procedimiento y registro de lecturas'
          peso: 2.0
        - criterio: 'Cálculo de medias e incertidumbres'
          peso: 3.0
        - criterio: 'Interpretación y elección del instrumento'
          peso: 2.0
        - criterio: 'Presentación y unidades'
          peso: 1.0

  - numero: 2
    fase: 1
    tipo: teoria
    titulo: 'Propagación de incertidumbres y notación científica'
    objetivo: >-
      Propagar la incertidumbre desde las magnitudes medidas hasta una magnitud
      calculada, y expresar el resultado en notación científica con las cifras
      significativas que la incertidumbre permite.
    contenidos:
      - 'Regla de la suma y de la diferencia para incertidumbres absolutas.'
      - 'Regla del producto y del cociente para incertidumbres relativas.'
      - 'Propagación general por derivadas parciales.'
      - 'Potencias, raíces y factores constantes.'
      - 'Notación científica y prefijos del SI.'
      - 'Cifras significativas en operaciones y redondeo final.'
    herramientas:
      - 'Calculadora científica'
      - 'Calibrador'
      - 'Probeta graduada'
      - 'Hoja de cálculo o Python'
    evaluacion: 'Taller formativo con entrega'
    practica:
      titulo: 'Del objeto al resultado: propagar sin inventar cifras'
      escenario: >-
        Cada grupo mide el diámetro y la altura de un cilindro con el calibrador
        y calcula su volumen por la fórmula geométrica. Debe reportar el volumen
        con su incertidumbre, no con todas las cifras que arroja la calculadora,
        y comprobar el resultado por desplazamiento de agua.
      fundamento_tex: |
        Si $z = x \pm y$, las incertidumbres absolutas se combinan en cuadratura:
        \[
          u_z = \sqrt{u_x^2 + u_y^2}.
        \]
        Si $z = x\,y$ o $z = x/y$, se combinan las incertidumbres relativas:
        \[
          \frac{u_z}{|z|} = \sqrt{\left(\frac{u_x}{x}\right)^2
                                + \left(\frac{u_y}{y}\right)^2}.
        \]
        En general, para $z = f(x_1,\ldots,x_n)$ con variables independientes,
        \[
          u_z = \sqrt{\sum_{i=1}^{n}
                  \left(\frac{\partial f}{\partial x_i}\,u_{x_i}\right)^2}.
        \]
        Para el cilindro, $V = \pi d^2 h/4$, de modo que
        \[
          \frac{u_V}{V} = \sqrt{\left(2\,\frac{u_d}{d}\right)^2
                                + \left(\frac{u_h}{h}\right)^2}.
        \]
        La notación científica escribe todo número como
        $a \times 10^{n}$ con $1 \le |a| < 10$. Los prefijos del SI
        (mili, micro, nano, kilo, mega) se aplican a la unidad, no al número, y
        no sustituyen a las cifras significativas. Al multiplicar o dividir, el
        resultado conserva tantas cifras significativas como el factor con menos
        cifras; al sumar o restar, conserva tantos decimales como el sumando con
        menos decimales. La incertidumbre se redondea siempre al final.
      figura_tex: |
        \begin{tikzpicture}[scale=0.9]
          \draw[thick] (0,0) ellipse (1.2 and 0.35);
          \draw[thick] (-1.2,0) -- (-1.2,4);
          \draw[thick] (1.2,0) -- (1.2,4);
          \draw[thick] (0,4) ellipse (1.2 and 0.35);
          \draw[<->] (-1.6,0) -- (-1.6,4) node[midway,left] {$h$};
          \draw[<->] (-1.2,4.5) -- (1.2,4.5) node[midway,above] {$d$};
        \end{tikzpicture}
      figura_caption: 'Cilindro de diámetro d y altura h: dos magnitudes medidas, una magnitud calculada'
      materiales:
        - 'Calibrador con apreciación de 0,05 mm'
        - 'Cilindro metálico'
        - 'Probeta graduada de 100 mL'
        - 'Agua destilada y jeringa'
        - 'Calculadora científica'
      pasos:
