      analisis:
        - 'Calcular $T - T_a$ y su logaritmo natural para cada instante.'
        - 'Graficar $\ln(T-T_a)$ frente al tiempo para cada cuerpo y ajustar la recta.'
        - 'Reportar la pendiente con sus unidades y calcular la constante de enfriamiento $k$.'
        - 'Calcular la constante de tiempo $\tau$ de cada cuerpo y compararlas.'
        - 'Explicar por qué el cuerpo más pequeño se enfría más rápido en términos de superficie por unidad de volumen.'
        - 'Identificar el tramo inicial que se aparta de la recta y discutir si corresponde a la estabilización térmica o a una pérdida de calor adicional.'
        - 'Discutir las limitaciones del modelo de Newton en este montaje y proponer una mejora.'
      entregable: >-
        Informe final con las tablas de ambos cuerpos, las gráficas
