  - numero: 3
    fase: 1
    tipo: teoria
    titulo: 'Graficación, linealización y lectura de una recta'
    objetivo: >-
      Construir una gráfica con ejes rotulados y unidades, linealizar un modelo
      físico y extraer de la recta la pendiente y el intercepto con su
      significado físico.
    contenidos:
      - 'Variables dependiente e independiente; elección de escalas y origen.'
      - 'Rotulación de ejes, unidades y título de figura.'
      - 'Barras de incertidumbre y su relación con el tamaño del punto.'
      - 'Modelos linealizables: potencial, exponencial y proporcional.'
      - 'Pendiente e intercepto con unidades y significado físico.'
      - 'Criterio de bondad visual: dispersión de los puntos y tendencia.'
    herramientas:
      - 'Papel milimetrado'
      - 'Regla'
      - 'Datos de la práctica del péndulo'
      - 'Python con Matplotlib'
    evaluacion: 'Taller formativo con entrega'
    practica:
      titulo: 'De la curva a la recta: linealizar para entender'
      escenario: >-
        Cada grupo recibe una tabla de periodo y longitud de un péndulo. Debe
        graficar los datos crudos, descubrir que la relación no es lineal,
        linealizarla elevando al cuadrado el periodo y leer de la recta la
        aceleración de la gravedad.
      fundamento_tex: |
        Una gráfica es un argumento, no un adorno: los ejes llevan nombre y
        unidad, la escala es uniforme y el origen se elige para que la tendencia
        se vea sin exagerarla ni ocultarla. La pendiente de una recta
        \[
          y = m\,x + b
        \]
        tiene las unidades de $y$ divididas entre las de $x$; el intercepto tiene
        las unidades de $y$. Reportar una pendiente sin unidades es reportar un
        número sin significado.

        Muchos modelos físicos no son lineales, pero se linealizan con un cambio
        de variable. Para el péndulo simple, $T = 2\pi\sqrt{L/g}$; elevando al
        cuadrado,
        \[
          T^2 = \frac{4\pi^2}{g}\,L.
        \]
        Al graficar $T^2$ frente a $L$ se obtiene una recta que pasa por el
        origen, cuya pendiente es $m = 4\pi^2/g$. Entonces
        \[
          g = \frac{4\pi^2}{m}.
        \]
        Si el modelo incluye una longitud no medida, $L = L_H + L_C$, la recta es
        \[
          T^2 = \frac{4\pi^2}{g}\,L_H + \frac{4\pi^2}{g}\,L_C,
        \]
        con pendiente $m = 4\pi^2/g$ e intercepto $b = m\,L_C$. El intercepto deja
        de ser un estorbo y se convierte en una medida indirecta de $L_C$.
      figura_tex: |
        \begin{tikzpicture}[scale=0.8]
          \draw[->] (0,0) -- (9,0) node[right] {$L$ (cm)};
          \draw[->] (0,0) -- (0,6) node[above] {$T^2$ (s$^2$)};
          \draw[thick] (0.5,0.83) -- (8.2,5.92);
          \foreach \x/\y in {1/1.2,2/1.8,3/2.5,4/3.1,5/3.8,6/4.4,7/5.2} {
            \fill (\x,\y) circle (2.5pt);
            \draw (\x,\y) -- (\x,\y-0.25);
            \draw (\x,\y) -- (\x,\y+0.25);
          }
        \end{tikzpicture}
      figura_caption: 'Recta ajustada a puntos con barras de incertidumbre: la pendiente y el intercepto se leen con sus unidades'
      materiales:
        - 'Tabla de periodo y longitud del péndulo de la semana 9'
        - 'Papel milimetrado o Python con Matplotlib'
        - 'Regla y calculadora'
      pasos:
        - 'Tabular la longitud del hilo y el periodo al cuadrado, con sus unidades.'
        - 'Graficar $T$ frente a $L$ y describir la forma de la curva.'
        - 'Graficar $T^2$ frente a $L$ y comprobar si los puntos se alinean.'
        - 'Trazar la recta que mejor represente la tendencia, sin forzarla a pasar por el primer ni por el último punto.'
        - 'Calcular la pendiente a partir de dos puntos de la recta trazada, no de dos datos crudos.'
        - 'Calcular $g$ a partir de la pendiente y compararla con el valor de referencia.'
        - 'Interpretar el intercepto y decidir si es compatible con cero dentro de la incertidumbre.'
      tabla_datos:
        caption: 'Datos del péndulo para linealizar'
        nota: 'La tabla ya está ordenada de mayor a menor longitud; al graficar, el eje horizontal es la longitud y el vertical el periodo al cuadrado.'
        columnas:
          - 'Ensayo'
          - '$L$ (cm)'
          - '$T$ (s)'
          - '$T^2$ (s$^2$)'
        filas:
          - ['1', '67,0', '1,778', '3,161']
          - ['2', '60,0', '1,532', '2,347']
          - ['3', '52,0', '1,430', '2,045']
          - ['4', '45,5', '1,354', '1,833']
          - ['5', '39,0', '1,266', '1,603']
          - ['6', '33,0', '1,186', '1,407']
          - ['7', '28,0', '1,136', '1,291']
          - ['8', '22,5', '1,060', '1,124']
          - ['9', '17,5', '0,948', '0,899']
          - ['10', '12,5', '0,856', '0,733']
      analisis:
        - 'Describir la forma de la gráfica $T$ frente a $L$ y explicar por qué no es una recta.'
        - 'Calcular la pendiente de $T^2$ frente a $L$ con dos puntos de la recta trazada y reportarla con unidades.'
        - 'Calcular $g = 4\pi^2/m$ y expresarla en m/s$^2$.'
        - 'Comparar $g$ con el valor de referencia y calcular la diferencia porcentual.'
        - 'Interpretar el intercepto: ¿es cero dentro de la incertidumbre? ¿Qué significaría que no lo fuera?'
        - 'Explicar por qué se grafica $T^2$ y no $T$, y qué se gana con la linealización.'
      entregable: >-
        Taller resuelto con las dos gráficas, la recta trazada, el cálculo de la
        pendiente con unidades, el valor de $g$ y la interpretación del
        intercepto.
      criterios: *criterios_taller

  - numero: 4
    fase: 1
    tipo: teoria
    titulo: 'Mínimos cuadrados y estructura del informe'
    objetivo: >-
      Ajustar una recta por mínimos cuadrados, reportar la pendiente, el
      intercepto y su bondad, y estructurar un informe de laboratorio que otro
      pueda reproducir.
    contenidos:
      - 'Criterio de mínimos cuadrados y diferencia con el trazo a ojo.'
      - 'Fórmulas de pendiente e intercepto para datos con x sin incertidumbre.'
      - 'Coeficiente de determinación y análisis de residuales.'
      - 'Incertidumbre de la pendiente y del intercepto.'
      - 'Estructura del informe: objetivo, fundamento, montaje, datos, análisis, conclusiones.'
      - 'Trazabilidad: cada cifra del texto sale de una tabla o de un script.'
    herramientas:
      - 'Hoja de cálculo o Python con NumPy'
      - 'Datos del resorte de la semana 8'
      - 'Calculadora'
    evaluacion: 'Taller integrador con entrega'
    practica:
      titulo: 'Ajustar, juzgar y escribir: el cierre de la fase uno'
      escenario: >-
        Cada grupo recibe una tabla de masa colgada y estiramiento de un resorte.
        Debe ajustar la recta por mínimos cuadrados, decidir si el resorte es
        lineal en el rango medido y redactar un informe corto con la estructura
        completa del curso.
      fundamento_tex: |
        Para un conjunto de pares $(x_k,y_k)$ con la incertidumbre concentrada en
        $y$, la recta de mínimos cuadrados $y = m\,x + b$ tiene
        \[
          m = \frac{n\sum x_k y_k - \sum x_k \sum y_k}
                   {n\sum x_k^2 - \left(\sum x_k\right)^2},
          \qquad
          b = \frac{\sum y_k - m\sum x_k}{n}.
        \]
        La bondad del ajuste se mide con el coeficiente de determinación
        \[
          r^2 = 1 - \frac{\sum (y_k - m x_k - b)^2}
                       {\sum (y_k - \bar{y})^2},
        \]
        que vale uno cuando todos los puntos caen sobre la recta y cero cuando el
        ajuste no explica nada. El residual $e_k = y_k - m x_k - b$ es la parte
        que el modelo no explica: si los residuales se ordenan en forma de curva,
        el modelo lineal no es el adecuado aunque $r^2$ sea alto.

        La incertidumbre de la pendiente se estima con
        \[
          u_m = \sqrt{\frac{\sum e_k^2}{(n-2)\sum (x_k-\bar{x})^2}}.
        \]
        Un informe reproducible declara el objetivo, el modelo con sus
        supuestos, el montaje, la tabla de datos crudos con unidades y
        resoluciones, el análisis con sus ajustes y las conclusiones. Cada cifra
        del texto debe poder rastrearse hasta una tabla o un script; si no se
        puede, no es un resultado, es una impresión.
      figura_tex: |
        \begin{tikzpicture}[scale=0.75]
          \draw[->] (0,0) -- (9,0) node[right] {$m$ (g)};
          \draw[->] (0,0) -- (0,6) node[above] {$\Delta y$ (cm)};
          \draw[thick] (0.6,0.88) -- (8.3,5.93);
          \foreach \x/\y in {1/1.0,2/2.0,3/2.2,4/3.5,5/3.5,6/4.7,7/4.8,8/5.8} {
            \fill (\x,\y) circle (2.5pt);
            \draw[dashed] (\x,\y) -- (\x,0.486+0.656*\x);
          }
          \node[below] at (4.5,-0.2) {masa colgada};
        \end{tikzpicture}
      figura_caption: 'Ajuste por mínimos cuadrados y residuales: la distancia vertical de cada punto a la recta es lo que el modelo no explica'
      materiales:
        - 'Tabla de masa y estiramiento del resorte'
        - 'Hoja de cálculo o Python con NumPy'
        - 'Calculadora y regla'
      pasos:
        - 'Copiar la tabla de masa y estiramiento en la hoja de cálculo, con unidades en la cabecera.'
        - 'Calcular las sumatorias necesarias para la pendiente y el intercepto.'
        - 'Ajustar la recta por mínimos cuadrados y escribir su ecuación con unidades.'
        - 'Calcular $r^2$ y los residuales de cada punto.'
        - 'Graficar los datos, la recta y los residuales; decidir si el modelo lineal es adecuado en todo el rango.'
        - 'Redactar un informe corto con objetivo, fundamento, datos, análisis y conclusiones, siguiendo la estructura del curso.'
      tabla_datos:
        caption: 'Masa colgada y estiramiento de un resorte'
        nota: 'La masa se convierte a peso multiplicando por la gravedad; el estiramiento se mide respecto de la posición sin carga.'
        columnas:
          - 'Ensayo'
          - '$m$ (g)'
          - '$\Delta y$ (cm)'
          - '$P$ (N)'
        filas:
          - ['1', '50', '1,1', '$\ldots$']
          - ['2', '100', '2,3', '$\ldots$']
          - ['3', '150', '3,4', '$\ldots$']
          - ['4', '200', '4,6', '$\ldots$']
          - ['5', '250', '5,7', '$\ldots$']
          - ['6', '300', '6,9', '$\ldots$']
          - ['7', '350', '8,0', '$\ldots$']
          - ['8', '400', '9,2', '$\ldots$']
          - ['9', '450', '10,3', '$\ldots$']
          - ['10', '500', '11,5', '$\ldots$']
      analisis:
        - 'Calcular la pendiente y el intercepto por mínimos cuadrados y reportarlos con sus unidades.'
        - 'Calcular $r^2$ y decidir si el ajuste lineal es aceptable.'
        - 'Graficar los residuales frente a la masa y describir su forma.'
        - 'Interpretar la pendiente como una constante elástica y escribir su valor en N/m.'
        - 'Identificar el rango en el que el resorte se comporta linealmente y el punto donde empieza a desviarse.'
        - 'Redactar las conclusiones de modo que un lector pueda repetir el experimento y obtener un valor comparable.'
      entregable: >-
        Taller integrador con la tabla completa, el ajuste por mínimos cuadrados,
        la gráfica con residuales, la constante elástica y un informe corto de
        dos páginas con la estructura del curso.
      criterios: *criterios_taller

  - numero: 5
    fase: 2
    tipo: practica
    titulo: 'Volumen de un sólido por dos métodos'
    objetivo: >-
      Determinar el volumen de un sólido regular por medición geométrica y por
      desplazamiento de agua, propagar la incertidumbre de ambos métodos y
      decidir si sus resultados coinciden dentro del error experimental.
    contenidos:
      - 'Volumen de cuerpos regulares: prisma, cilindro y esfera.'
      - 'Medición de dimensiones con calibrador y tornillo micrométrico.'
      - 'Desplazamiento de líquido y lectura del menisco.'
      - 'Propagación de incertidumbres en productos y potencias.'
      - 'Comparación de dos métodos independientes.'
    herramientas:
      - 'Calibrador y tornillo micrométrico'
      - 'Probeta graduada de 100 mL'
      - 'Agua destilada, jeringa y paño'
      - 'Cuerpos regulares de distintos materiales'
      - 'Hilo fino'
    evaluacion: 'Práctica con informe'
    practica:
      titulo: 'Volumen de un sólido por dos métodos'
      escenario: >-
        Cada grupo recibe tres sólidos regulares. Debe medir sus dimensiones con
        el instrumento adecuado, calcular el volumen geométrico, medirlo de nuevo
        por desplazamiento de agua y explicar la discrepancia entre ambos
        resultados con su presupuesto de incertidumbres.
      fundamento_tex: |
        El volumen de un cuerpo regular se calcula a partir de sus dimensiones:
        para un prisma rectangular $V = a\,b\,c$; para un cilindro
        $V = \pi d^2 h/4$; para una esfera $V = \pi d^3/6$.

        La incertidumbre relativa de un producto se combina en cuadratura. Para
        el cilindro,
        \[
          \frac{u_V}{V} = \sqrt{\left(2\,\frac{u_d}{d}\right)^2
                                + \left(\frac{u_h}{h}\right)^2},
        \]
        y para la esfera,
        \[
          \frac{u_V}{V} = 3\,\frac{u_d}{d}.
        \]

        Por desplazamiento, el volumen del sólido es la diferencia entre el
        volumen final y el inicial:
        \[
          V = V_f - V_i, \qquad u_V = \sqrt{u_{V_f}^2 + u_{V_i}^2}.
        \]
        La incertidumbre de cada lectura de la probeta combina la resolución de
        la escala con la dificultad de leer el menisco. El sólido debe quedar
        completamente sumergido y sin burbujas adheridas; un hilo fino evita
        añadir volumen apreciable. Si los dos métodos no coinciden dentro de su
        incertidumbre combinada, hay un error sistemático que debe buscarse
        (burbujas, volumen del hilo, lectura del menisco o dimensiones mal
        medidas), no un simple desacuerdo numérico.
      figura_tex: |
        \begin{tikzpicture}[scale=0.8]
          \draw[thick] (0,0) -- (0,6);
          \draw[thick] (2,0) -- (2,6);
          \draw (0,0) .. controls (0,-0.35) .. (1,-0.35) .. controls (2,-0.35) .. (2,0);
          \fill[cyan!25] (0.06,0.05) -- (0.06,2.1) -- (1.94,2.1) -- (1.94,0.05) -- cycle;
          \fill[cyan!25] (0.06,2.1) -- (0.06,3.6) -- (1.94,3.6) -- (1.94,2.1) -- cycle;
          \draw[dashed] (0,2.1) -- (2,2.1);
          \draw[dashed] (0,3.6) -- (2,3.6);
          \node[right] at (2,2.1) {$V_i$};
          \node[right] at (2,3.6) {$V_f$};
          \fill (1,1.4) circle (0.32);
          \node[right] at (2.4,1.4) {sólido};
        \end{tikzpicture}
      figura_caption: 'Desplazamiento de agua: el volumen del sólido es la diferencia entre la lectura final y la inicial'
      materiales:
        - 'Calibrador con apreciación de 0,05 mm'
        - 'Tornillo micrométrico con apreciación de 0,01 mm'
        - 'Probeta graduada de 100 mL con resolución de 1 mL'
        - 'Agua destilada'
        - 'Jeringa de 20 mL y paño absorbente'
        - 'Bloque, cilindro y esfera metálicos'
        - 'Hilo fino de coser'
      pasos:
        - 'Identificar cada sólido y anotar su material y su forma geométrica.'
        - 'Medir cada dimensión cinco veces con el instrumento adecuado, en posiciones distintas, y registrar las lecturas con su apreciación.'
        - 'Calcular la media y la incertidumbre de cada dimensión.'
        - 'Calcular el volumen geométrico y su incertidumbre con la fórmula que corresponda.'
        - 'Llenar la probeta hasta un volumen inicial legible, secar el borde y anotar la resolución de la escala.'
        - 'Atar el sólido con el hilo, sumergirlo completamente sin tocar las paredes y leer el volumen final; repetir cinco veces.'
        - 'Secar el sólido entre ensayos y comprobar que no quedan burbujas adheridas.'
        - 'Calcular el volumen desplazado medio y su incertidumbre a partir de las cinco diferencias.'
      tabla_datos:
        caption: 'Volumen de cada sólido por los dos métodos'
        nota: 'Registrar la resolución de la probeta y del calibrador; comparar los métodos solo después de expresar ambos volúmenes en la misma unidad.'
        columnas:
          - 'Sólido'
          - 'Método'
          - '$V$ (cm$^3$)'
          - '$u_V$ (cm$^3$)'
          - 'Diferencia (\%)'
        filas:
          - ['Bloque', 'Geométrico', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['Bloque', 'Desplazamiento', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['Cilindro', 'Geométrico', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['Cilindro', 'Desplazamiento', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['Esfera', 'Geométrico', '$\ldots$', '$\ldots$', '$\ldots$']
          - ['Esfera', 'Desplazamiento', '$\ldots$', '$\ldots$', '$\ldots$']
      analisis:
        - 'Calcular el volumen geométrico y su incertidumbre para cada sólido.'
        - 'Calcular el volumen desplazado medio y su incertidumbre para cada sólido.'
        - 'Comparar ambos resultados mediante la diferencia porcentual respecto del valor medio.'
        - 'Decidir si la diferencia es mayor que la incertidumbre combinada y, si lo es, proponer la causa sistemática más probable.'
        - 'Identificar cuál de las magnitudes medidas aporta más incertidumbre al volumen geométrico.'
        - 'Proponer una mejora concreta del montaje que reduzca la incertidumbre dominante.'
      entregable: >-
        Informe con la tabla de datos crudos, ambos volúmenes con su
        incertidumbre, la comparación entre métodos y la explicación de la
        discrepancia.
      criterios: &criterios_practica
