        - ['R', '2 M$\Omega$', '100 $\Omega$', '0,05 \% + 2 d']
        - ['R', '20 M$\Omega$', '1 k$\Omega$', '0,2 \% + 2 d']
        - ['R', '200 M$\Omega$', '10 k$\Omega$', '2,0 \% + 1 d']
  - titulo: Multimedidor Keithley 179 y 179-A
    texto: >-
      El 179 es el instrumento de mayor resolución del laboratorio y el que se usa
      cuando se necesita comparar dos modelos en la práctica 3. Su resistencia de
      entrada en continua es de 10 M$\Omega$, distinta de la del 175, y esa
      diferencia es precisamente la que se mide y se discute en el informe.
    tabla:
      caption: Especificaciones del Keithley 179 y 179-A (hoja del laboratorio)
      nota: Impedancia de entrada en alterna, 1 M$\Omega$ en serie con un capacitor menor de 75 pF.
      columnas:
        - 'Función'
        - 'Rango'
        - 'Resolución'
        - 'Precisión'
      filas:
