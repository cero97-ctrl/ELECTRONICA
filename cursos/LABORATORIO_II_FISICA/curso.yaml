    texto: >-
      Dos bobinas del laboratorio tienen cinco terminales y permiten elegir la
      toma por saltos, desde el extremo inferior hasta el superior. Se usan cuando
      se necesita una inductancia intermedia que no está en la tabla anterior.
    tabla:
