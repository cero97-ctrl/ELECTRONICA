  - titulo: Inductancias del laboratorio
    texto: >-
      Las bobinas del laboratorio tienen tomas intermedias, de modo que el mismo
      devanado ofrece tres inductancias según se conecte entre extremo y medio
      (A-M), entre medio y extremo (M-E) o entre extremos (A-E). En la práctica 6
      hay que anotar qué conexión se usó: comparar la L medida contra otra toma es
      un error de referencia, no un error experimental.
    tabla:
      caption: Inductancia medida según el tipo de conexión
      nota: La numeración identifica la posición en la lista del laboratorio.
      columnas:
        - 'Unidad'
        - 'A-M'
        - 'M-E'
        - 'A-E'
      filas:
