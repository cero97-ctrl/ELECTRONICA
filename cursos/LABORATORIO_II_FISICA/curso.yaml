        - ['I DC', '200 $\mu$A a 2000 mA', '10 nA a 100 $\mu$A', '0,2 \% + 2 d']
        - ['I AC', '200 $\mu$A a 2000 mA', '10 nA a 100 $\mu$A', '1 \% + 15 d']
        - ['R', '2 k$\Omega$', '100 m$\Omega$', '0,15 \% + 1 d']
        - ['R', '20 k$\Omega$ a 2000 k$\Omega$', '1 $\Omega$ a 100 $\Omega$', '0,04 \% + 1 d']
        - ['R', '20 M$\Omega$', '1 k$\Omega$', '0,10 \% + 1 d']
  - titulo: Propagación de incertidumbres
    texto: >-
      Toda magnitud indirecta se calcula a partir de otras medidas, y su
      incertidumbre se propaga con las derivadas parciales. Cuando las variables
      son independientes se suman en cuadratura; cuando están correlacionadas,
      como ocurre al medir con el mismo instrumento en dos puntos, hay que tratarlo
      explícitamente en el informe.
    tabla:
      caption: Reglas de propagación usadas en el curso
      nota: u designa la incertidumbre combinada de la magnitud.
      columnas:
        - 'Relación'
        - 'Incertidumbre'
      filas:
        - ['$z = x + y$', '$u_z = \sqrt{u_x^2 + u_y^2}$']
        - ['$z = x\,y$', '$u_z/z = \sqrt{(u_x/x)^2 + (u_y/y)^2}$']
        - ['$z = x/y$', '$u_z/z = \sqrt{(u_x/x)^2 + (u_y/y)^2}$']
        - ['$z = x^n$', '$u_z/z = |n|\,u_x/x$']
        - ['Ajuste lineal', 'Pendiente y ordenada con su error estándar del ajuste']
  - titulo: Formulario del curso
    texto: >-
      Formulario mínimo de las nueve semanas experimentales. Se permite una hoja
      como esta, manuscrita, en los controles y en la evaluación final.
    tabla:
      caption: Expresiones de referencia
      nota: Las condiciones de validez se discuten en la práctica correspondiente.
      columnas:
        - 'Concepto'
        - 'Expresión'
        - 'Práctica'
      filas:
        - ['Ley de Ohm', '$V = R\,I$', '1']
        - ['Puente de Wheatstone', '$R_x = R_1 R_3 / R_2$', '2']
        - ['Fuente real', '$V = \varepsilon - r\,I$', '3']
        - ['Máxima transferencia', '$R_L = r$', '3']
        - ['Thévenin', '$R_{th} = \varepsilon_{th}/I_{cc}$', '4']
        - ['Diodo', '$I_D = I_S\left(e^{V_D/(nV_T)} - 1\right)$', '5']
        - ['Reactancias', '$X_L = \omega L$; $X_C = 1/(\omega C)$', '6']
        - ['Impedancia serie', '$Z = \sqrt{R^2 + (X_L - X_C)^2}$', '6']
        - ['Resonancia', '$f_0 = 1/(2\pi\sqrt{LC})$', '7']
        - ['Factor de calidad', '$Q = \omega_0 L/R = f_0/\Delta f$', '7 y 9']
        - ['Transitorio RC', '$\tau = RC$; $t_{1/2} = \tau\ln 2$', '8']
        - ['Energía del capacitor', '$W = C V^2/2$', '8']
        - ['Amortiguamiento', '$\zeta = (R/2)\sqrt{C/L}$; $Q = 1/(2\zeta)$', '9']

bibliografia:
  - autor: Serway, R. A. y Jewett, J. W.
    titulo: Física para ciencias e ingeniería
    detalle: >-
      Volúmen 2, capítulos de campos eléctricos, corriente continua y circuitos de
      corriente alterna. Referencia principal para el modelo teórico.
  - autor: Halliday, D., Resnick, R. y Walker, J.
    titulo: Fundamentos de física
    detalle: >-
      Volúmen 2. Tratamiento de circuitos, inducción y corriente alterna con
      énfasis en la interpretación física.
  - autor: Tipler, P. A. y Mosca, G.
    titulo: Física para la ciencia y la tecnología
    detalle: >-
      Volúmen 2. Útil para transitorios RC y RLC y para el análisis de potencia.
  - autor: Boylestad, R. L.
    titulo: Introducción al análisis de circuitos
    detalle: >-
      Thévenin, Norton, superposición, respuesta en frecuencia y resonancia con
      el formalismo fasorial completo.
  - autor: Sedra, A. S. y Smith, K. C.
    titulo: Microelectrónica
    detalle: >-
      Modelo del diodo, ecuación de Shockley y diodos Zener y emisores de luz.
  - autor: Taylor, J. R.
    titulo: Introducción al análisis de errores
    detalle: >-
      Base del tratamiento de incertidumbres del curso, de la propagación y de los
      ajustes por mínimos cuadrados.
  - autor: JCGM
    titulo: Guía para la expresión de la incertidumbre de medida (GUM, JCGM 100:2008)
    detalle: >-
      Norma de referencia para la clasificación de incertidumbres tipo A y tipo B y
      para el cálculo de la incertidumbre combinada.

politicas:
  - La seguridad eléctrica es previa a cualquier medición; se corta la alimentación antes de modificar un montaje.
  - Ningún instrumento se conecta sin verificar rango y polaridad, y ningún capacitor electrolítico se conecta invertido.
  - Los datos crudos son inalterables; toda corrección se documenta en el script de análisis y se explica en el informe.
  - Todo resultado se expresa en unidades del Sistema Internacional con cifras significativas coherentes con su incertidumbre.
  - Un resultado sin incertidumbre no se acepta, y una conclusión sin contraste con el modelo tampoco.
  - El informe es grupal, pero cada integrante firma sus propias conclusiones y debe poder defenderlas en la oral.
  - La entrega fuera de corte pierde el 20 por ciento de la nota de la práctica por cada día de retraso, hasta tres días.
  - Se considera falta grave fabricar, alterar o copiar datos, o entregar el informe de otro grupo; se aplica el reglamento disciplinario.
  - El instrumental prestado se devuelve completo y revisado; un daño por mal uso se reporta de inmediato al docente.
  - La asistencia al laboratorio es obligatoria; dos inasistencias injustificadas a prácticas invalidan la evaluación de esa fase.
  - Los repositorios son privados y no contienen datos personales de terceros ni credenciales.
