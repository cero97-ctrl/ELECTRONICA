# ─────────────────────────────────────────────────────────────────────────────
# curso.yaml — Fuente única de verdad del curso (Layer 1b: dato)
#
# Este fichero es el DESCRIPTOR. No se escribe lógica aquí: toda la generación
# del material (sílabo, plan semanal, guía, prácticas, evaluaciones, laboratorio)
# la hace `execution/generar_material_curso.py` de forma determinista.
# Editar este YAML y volver a ejecutar el flujo basta para regenerar el curso.
#
# Reglas que valida el generador antes de escribir una sola línea de LaTeX:
#   - números de semana contiguos 1..meta.semanas
#   - las fases cubren todas las semanas exactamente una vez
#   - los pesos de evaluación suman 100
#   - los criterios de cada práctica suman 10.0 (escala compatible con
#     execution/evaluar_examen.py -> directives/rubricas/)
#   - puertos del laboratorio únicos
# Cualquier violación aborta ruidosamente: no se publica material inválido.
# ─────────────────────────────────────────────────────────────────────────────
meta:
  codigo: CYBERSEGURIDAD
  titulo: Ciberseguridad Aplicada
  subtitulo: Ofensiva controlada, defensa, forense y marco legal sobre un laboratorio propio
  autor: Prof. César Rodríguez
  institucion: ELECTRONICA
  idioma: es
  anio: 2026
  fecha: 1 de noviembre de 2026
  fecha_iso: 2026-11-01
  semanas: 10
  grupos: 4
  modalidad: Trabajo por grupos desde sus propios equipos y conexión, con laboratorio Docker local y repositorio GitHub por grupo revisado semanalmente; sin proyecto integrador
  dedicacion_semanal: 4 horas de laboratorio + 2 horas de estudio independiente
  version: 1
objetivo_general: 'Formar criterio técnico y legal para auditar, defender, investigar y documentar incidentes de seguridad sobre sistemas propios o expresamente autorizados, cubriendo el ciclo completo: reconocimiento, explotación controlada, hardening, forense y respuesta, con evidencia reproducible y respeto estricto del alcance.'
resultados_aprendizaje:
- id: RA1
  texto: Explicar activos, amenazas y vulnerabilidades con marcos reconocidos (CIA, STRIDE, MITRE ATT&CK) y priorizar riesgos con evidencia.
- id: RA2
  texto: Aplicar criptografía simétrica, asimétrica, funciones hash y KDF, y diagnosticar una configuración TLS insegura.
- id: RA3
  texto: Interpretar el marco legal y normativo aplicable antes de tocar un sistema, y redactar un alcance de auditoría autorizado.
- id: RA4
  texto: Ejecutar reconocimiento, escaneo y explotación controlada contra objetivos del laboratorio, documentando cada paso.
- id: RA5
  texto: Endurecer sistemas y redes, y demostrar la mitigación repitiendo el ataque original.
- id: RA6
  texto: Adquirir y preservar evidencia digital con cadena de custodia e integridad verificable.
- id: RA7
  texto: Reconstruir un incidente a partir de artefactos y producir un informe técnico y otro ejecutivo.
grupos:
  cantidad: 4
  asignacion: Fija durante el semestre; cada grupo entrega sus propias prácticas.
  repositorio: Cada grupo crea un repositorio GitHub propio (privado, con el docente como colaborador) y lo mantiene actualizado. El docente revisa ese repositorio al finalizar cada semana de práctica.
  roles:
  - nombre: Rojo
    descripcion: 'Ejecuta la técnica ofensiva sobre el objetivo autorizado: prepara el entorno,
      lanza el ataque, registra comandos y payloads, y guarda cada salida con su hash.'
    aporta: Evidencia cruda en semana_NN/evidencia y el apartado de reproducción del informe.
    en_la_practica:
    - Confirmar el objetivo autorizado y preparar el entorno antes de la primera captura.
    - Ejecutar la técnica de la semana en el orden de los pasos y guardar cada salida cruda con su hash.
    - 'Redactar la reproducción: comando, salida esperada y salida obtenida, sin retocar la evidencia.'
  - nombre: Azul
    descripcion: 'Parte de su propia captura cruda y aplica el control equivalente: configuración,
      parche o regla de red. Repite el ataque para demostrar que falla y documenta el antes y el después.'
    aporta: La mitigación aplicada, el comando de verificación y la comparación de resultados.
    en_la_practica:
    - Leer su propia evidencia cruda y elegir el control que corta el ataque en el punto más barato.
    - Aplicar el control y repetir el ataque para demostrar que ya no funciona.
    - Documentar el antes y el después con los mismos comandos y la diferencia medida.
  - nombre: Púrpura
    descripcion: 'Instrumenta la detección del mismo evento: activa el registro, define la alerta
      y mide lo que se habría visto, incluidos los falsos positivos y negativos.'
    aporta: La regla o consulta de detección y la tabla de lo detectado frente a lo ejecutado.
    en_la_practica:
    - Instrumentar el evento, activando el registro que lo vería y definiendo la alerta con su umbral.
    - Comparar lo que se registró con lo que se ejecutó, ítem por ítem del paso a paso.
    - Reportar falsos positivos y negativos y proponer el ajuste concreto de la regla.
  - nombre: Legal y reporte
    descripcion: 'Verifica que el alcance y la autorización cubran lo ejecutado, anonimiza la
      evidencia, revisa la cadena de custodia e integra el informe técnico y el resumen ejecutivo.'
    aporta: La versión final del informe y la declaración explícita de lo que no se pudo verificar.
    en_la_practica:
    - Revisar que el alcance y la autorización cubran exactamente lo ejecutado, ni más ni menos.
    - Anonimizar la evidencia y verificar la cadena de custodia de cada archivo entregado.
    - Integrar informe técnico y resumen ejecutivo, y declarar los límites del trabajo.
  asignacion_inicial:
  - Rojo
  - Azul
  - Púrpura
  - Legal y reporte
  fase_con_roles:
  - 1
  - 2
  - 3
  - 4
  rotacion: Los roles rotan una posición al inicio de cada fase (de la 1 a la 4), de modo que
    cada grupo pasa por las cuatro perspectivas. En la fase 5 no hay roles de grupo; la
    evaluación final es individual.
evaluacion:
  escala: 10
  nota_minima: 5
  pesos:
  - concepto: Prácticas de laboratorio (semanas 1-9)
    peso: 35
  - concepto: Controles de fase (semanas 3, 5 y 7)
    peso: 15
  - concepto: Informes técnicos (semanas 5, 7 y 9)
    peso: 15
  - concepto: Evaluación final práctica (semana 10)
    peso: 25
  - concepto: Ética, autorizaciones y uso responsable
    peso: 10
entregas:
  plataforma: GitHub
  modalidad: Un repositorio privado por grupo, con el docente como colaborador de lectura.
  cadencia: El docente revisa el repositorio al finalizar cada semana de práctica.
  corte: Domingo 23:59 de la semana correspondiente; lo posterior no se corrige.
  estructura:
  - README.md con integrantes, roles y tabla de semanas entregadas.
  - semana_NN/informe.md o informe.pdf con el entregable de esa práctica.
  - semana_NN/scripts/ con el código, con type hints y docstrings.
  - semana_NN/evidencia/ con salidas, capturas y hashes anonimizados.
  - semana_NN/README.md con el resumen de lo hecho y lo que no se pudo verificar.
  reglas:
  - Nada de secretos, tokens ni contraseñas en el repositorio; las claves van en .env ignorado.
  - 'Nada de imágenes de disco, muestras de malware ni binarios: solo hashes y enlaces.'
  - 'Evidencia anonimizada: sin datos personales de terceros ni credenciales reales.'
  - 'Un commit por entrega con mensaje "semana NN: <entregable>".'
  - La práctica cuenta como entregada solo si está en el repositorio antes del corte.
laboratorio:
  motor: Docker
  caracter: El docker-compose de esta carpeta es opcional. Cada grupo puede usar su propio entorno en su PC siempre que respete el alcance autorizado.
  red: cyberlab
  subred: 172.28.0.0/24
  recursos: Requiere ~2 GB de RAM libre y ~5 GB de disco; DVWA y Juice Shop juntos consumen menos de 700 MB.
  imagenes:
  - nombre: objetivo-web
    imagen: vulnerables/web-dvwa:latest
    puerto: 8081
    puerto_contenedor: 80
    proposito: Inyección SQL, XSS, LFI y control de acceso (semanas 5 y 7)
  - nombre: objetivo-juice
    imagen: bkimminich/juice-shop:latest
    puerto: 3000
    puerto_contenedor: 3000
    proposito: Retos guiados de OWASP Top 10 (semanas 5 y 7)
  - nombre: objetivo-linux
    imagen: ubuntu:24.04
    puerto: 2222
    puerto_contenedor: 22
    proposito: Hardening, SSH y artefactos forenses (semanas 6, 8 y 9)
  reglas:
  - Cada grupo trabaja desde su propio equipo y red: no hay red compartida del curso.
  - El laboratorio corre en localhost y nunca se expone a Internet.
  - Solo se atacan contenedores del laboratorio o sistemas con autorización escrita y firmada.
  - Las muestras de malware no se ejecutan: el análisis es estático y sobre copias inertes.
  - La evidencia se anonimiza antes de entregarse; los datos personales no salen del laboratorio.
  - Se prohíbe el uso de estas técnicas contra la infraestructura de la universidad o de terceros.
fases:
- id: 1
  nombre: Fundamentos, criptografía y marco legal
  semanas:
  - 1
  - 2
  - 3
  enfoque: Vocabulario común, criptografía aplicada y límites legales antes de tocar un sistema.
  icono: shield-alt
- id: 2
  nombre: Ofensiva controlada
  semanas:
  - 4
  - 5
  enfoque: Reconocimiento, escaneo y explotación documentada contra objetivos propios.
  icono: crosshairs
- id: 3
  nombre: Defensa y hardening
  semanas:
  - 6
  - 7
  enfoque: Endurecer sistemas, redes y aplicaciones, y demostrar la mitigación.
  icono: lock
- id: 4
  nombre: Forense y respuesta a incidentes
  semanas:
  - 8
  - 9
  enfoque: Adquirir evidencia, reconstruir lo ocurrido y responder con método.
  icono: fingerprint
- id: 5
  nombre: Cierre
  semanas:
  - 10
  enfoque: Evaluación final práctica de alcance cerrado, con informe y defensa.
  icono: flag-checkered
semanas:
- numero: 1
  fase: 1
  titulo: Panorama de la ciberseguridad y superficie de ataque
  objetivo: Distinguir activos, amenazas y vulnerabilidades, y describir el ciclo de vida de un ataque con marcos reconocidos.
  contenidos:
  - Tríada CIA más autenticidad, integridad y no repudio.
  - 'Actores: oportunista, crimen organizado, insider y APT.'
  - Superficie de ataque, vector y cadena de explotación.
  - Cyber Kill Chain y MITRE ATT&CK como vocabulario común.
  - Roles rojo, azul y púrpura; modelos de amenaza STRIDE.
  - Riesgo como función de probabilidad e impacto.
  herramientas:
  - Docker
  - nmap sobre localhost
  - Navegador
  glosario:
  - Activo
  - Amenaza
  - Vulnerabilidad
  - Riesgo
  - Superficie de ataque
  - Vector de ataque
  - Cadena de explotación
  - Tríada CIA
  - No repudio
  - APT
  - Insider
  - STRIDE
  - Cyber Kill Chain
  - MITRE ATT&CK
  - Equipo rojo, azul y púrpura
  - Enumeración de servicios
  - Evidencia reproducible
  - Localhost
  practica:
    titulo: Inventario de superficie de ataque del laboratorio
    escenario: 'El laboratorio tiene tres contenedores. Cada grupo inventaría puertos, servicios y versiones de su objetivo asignado, y propone tres vectores plausibles por servicio expuesto.

      '
    pasos:
    - Levantar el laboratorio con docker compose up -d y verificar los tres servicios.
    - Enumerar puertos y servicios del objetivo asignado solo desde localhost.
    - Identificar versiones y anotar la evidencia exacta de cada hallazgo.
    - Aplicar STRIDE a cada servicio y priorizar los tres vectores más plausibles.
    - Anonimizar la evidencia y entregar la tabla con la conclusión del grupo.
    entregable: Tabla de activos y servicios, modelo STRIDE y conclusión priorizada de tres vectores.
    criterios:
    - criterio: Cobertura completa de puertos y servicios del objetivo
      peso: 3.0
    - criterio: Evidencia reproducible de cada hallazgo
      peso: 2.5
    - criterio: Uso correcto del vocabulario de amenazas
      peso: 2.0
    - criterio: Priorización justificada por impacto y probabilidad
      peso: 1.5
    - criterio: Redacción clara y evidencia anonimizada
      peso: 1.0
  evaluacion: formativa
  ejemplos:
  - grupo: 1
    titulo: Ejemplo de trabajo del Grupo 1
    intro: >-
      El rol Rojo pone el énfasis en la evidencia cruda y en la reproducción. Este
      ejemplo muestra una forma correcta de resolver la práctica de la semana 1 con ese
      énfasis; no es la única, pero sí la más fácil de corregir.
    bloques:
    - titulo: Preparar y verificar el objetivo autorizado
      texto: >-
        Trabaja solo contra los tres contenedores del laboratorio. Si docker compose ps no
        muestra los tres servicios arriba, la práctica todavía no puede empezar.
      comandos: |
        docker compose up -d
        docker compose ps
    - titulo: Enumerar la superficie solo desde localhost
      texto: >-
        Escanea la propia máquina, no la red del curso ni la infraestructura de la
        universidad. Guarda la salida cruda y su hash en el momento: es la evidencia que
        después se cita en el informe.
      comandos: |
        mkdir -p semana_01/evidencia
        nmap -sT -sV -p- 127.0.0.1 -oN semana_01/evidencia/nmap_full.txt
        sha256sum semana_01/evidencia/nmap_full.txt > semana_01/evidencia/nmap_full.txt.sha256
    - titulo: Identificar versiones y grabar cada salida
      texto: >-
        Cada cabecera HTTP y cada banner es un hallazgo con su archivo. Si un servicio no
        responde, se anota igual: lo que no se pudo verificar también es parte del
        inventario.
      comandos: |
        curl -sI http://127.0.0.1:8081/ | tee semana_01/evidencia/dvwa_headers.txt
        curl -sI http://127.0.0.1:3000/ | tee semana_01/evidencia/juice_headers.txt
        ssh -o BatchMode=yes -p 2222 alumno@127.0.0.1 2>&1 | tee semana_01/evidencia/ssh_banner.txt
        sha256sum semana_01/evidencia/*.txt > semana_01/evidencia/hashes.sha256
    - titulo: Aplicar STRIDE y priorizar tres vectores
      texto: >-
        No se listan diez amenazas: se eligen tres y se justifica por qué esas. Cada fila
        de la tabla debe poder defenderse con la evidencia del paso anterior.
    tabla:
      titulo: Priorización de ejemplo
      nota: >-
        Los puertos y servicios salen del bloque laboratorio.imagenes del descriptor; si
        el entorno del grupo cambia, la tabla refleja lo observado y no lo esperado.
      columnas: [Servicio, Puerto, Versión observada, Categoría STRIDE, Vector plausible, Prob., Impacto]
      anchos: [2.2, 0.9, 1.9, 2.4, 3.2, 1.05, 1.35]
      filas:
      - [DVWA, '8081', 'Apache 2.4.x', Elevación de privilegios, 'Credenciales por defecto admin/password', Alta, Alto]
      - [Juice Shop, '3000', 'Node.js / Express', Manipulación, 'Inyección en parámetros de búsqueda', Media, Alto]
      - [Linux del laboratorio, '2222', 'OpenSSH 9.x', Suplantación, 'Fuerza bruta con usuarios por defecto', Media, Medio]
    entregable: >-
      El informe lleva la tabla de activos y servicios, el modelo STRIDE y la conclusión
      con tres vectores priorizados. Además incluye una sección de reproducción con el
      formato comando, salida esperada y salida obtenida, sin retocar la evidencia.
    estructura: |
      semana_01/
      |-- informe.md
      |-- evidencia/
      |   |-- nmap_full.txt
      |   |-- dvwa_headers.txt
      |   |-- juice_headers.txt
      |   |-- ssh_banner.txt
      |   `-- hashes.sha256
      `-- README.md
    comprobaciones:
    - Cada comando del informe aparece también en evidencia/, con su hash.
    - La tabla no incluye datos personales ni credenciales reales.
    - Los tres vectores priorizados dicen qué comando o petición los comprobaría.
    - El commit de la semana está hecho antes del corte y describe el entregable.
    avisos:
    - Nada de capturas con datos personales ni credenciales reales; la evidencia se anonimiza antes de subirla.
    - Si un servicio no responde, se documenta como no verificado; no se omite.
  - grupo: 2
    titulo: Ejemplo de trabajo del Grupo 2
    intro: >-
      El rol Azul parte de su propia captura cruda, elige el control más barato y repite
      la misma medición. El entregable es la comparación antes/después, no la captura
      suelta: un control sin verificación es una intención.
    bloques:
    - titulo: Fijar la línea base
      texto: >-
        Antes de tocar nada se mide lo que hay. Se repiten los mismos comandos que se
        usarán después, porque comparar mediciones distintas no demuestra nada.
      comandos: |
        docker compose up -d
        docker compose ps
        ss -tulpn | grep -E ':8081|:3000|:2222' | tee semana_01/evidencia/azul_antes_servicios.txt
        curl -sI http://127.0.0.1:8081/ | grep -i '^server' | tee semana_01/evidencia/azul_antes_server.txt
    - titulo: Elegir el control por coste
      texto: >-
        Entre dos controles que cortan lo mismo, se aplica el que se verifica con un
        comando y no rompe el resto del laboratorio. Aquí: cerrar el acceso de root por
        SSH y dejar de anunciar la versión del servidor web.
    - titulo: Aplicar el control
      texto: >-
        Cada cambio se hace con un comando reproducible. Si el contenedor no tiene el
        archivo esperado, se documenta como control no aplicado en lugar de simularlo.
      comandos: |
        docker exec objetivo-linux sh -c "sed -i -E 's/^#?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config && sshd -t && (kill -HUP 1 || true)"
        docker exec objetivo-linux sshd -T | grep -E '^(permitrootlogin|maxauthtries)' | tee semana_01/evidencia/azul_control_ssh.txt
        docker exec objetivo-web sh -c "printf '\nServerTokens Prod\nServerSignature Off\n' >> /etc/apache2/apache2.conf && apache2ctl -k graceful"
    - titulo: Repetir la medición y diferenciar
      texto: >-
        La misma orden del inicio, sobre el sistema ya cambiado, y un diff explícito. Si
        el resultado no cambia, el control no sirvió y eso también se reporta.
      comandos: |
        ss -tulpn | grep -E ':8081|:3000|:2222' > semana_01/evidencia/azul_despues_servicios.txt
        curl -sI http://127.0.0.1:8081/ | grep -i '^server' > semana_01/evidencia/azul_despues_server.txt
        diff semana_01/evidencia/azul_antes_server.txt semana_01/evidencia/azul_despues_server.txt | tee semana_01/evidencia/azul_diff.txt
    tabla:
      titulo: Control aplicado y verificación
      nota: >-
        La columna de verificación se llena con la salida real, no con la esperada; si no
        hay diferencia, se escribe "sin cambio" y se explica por qué.
      columnas: [Servicio, Puerto, Estado antes, Control aplicado, Verificación después]
      anchos: [2.2, 0.9, 2.4, 4.6, 3.7]
      filas:
      - [Linux del laboratorio, '2222', 'Root con acceso por SSH', 'PermitRootLogin no y sshd -t antes de recargar', 'sshd -T muestra permitrootlogin no']
      - [DVWA, '8081', 'Cabecera Server con versión de Apache', 'ServerTokens Prod y ServerSignature Off', 'La cabecera ya no anuncia versión']
      - [Juice Shop, '3000', 'Cabecera Server con versión de Express', 'Sin control: el servicio no expone esa opción', 'Sin cambio; se documenta el motivo']
    entregable: >-
      El informe incluye la tabla de control y verificación, el diff antes/después y una
      conclusión con el coste de cada control: cuántos comandos, cuánto riesgo de romper
      el servicio y qué queda expuesto después.
    estructura: |
      semana_01/
      |-- informe.md
      |-- evidencia/
      |   |-- azul_antes_servicios.txt
      |   |-- azul_despues_servicios.txt
      |   |-- azul_antes_server.txt
      |   |-- azul_despues_server.txt
      |   |-- azul_control_ssh.txt
      |   `-- azul_diff.txt
      `-- README.md
    comprobaciones:
    - La medición de antes y la de después usan exactamente el mismo comando.
    - Cada control tiene su comando de verificación y su salida real pegada.
    - Si un control no se pudo aplicar, está dicho con el motivo, no omitido.
    - El diff está en evidencia/ y el informe lo cita línea por línea.
    avisos:
    - No se cambian credenciales del laboratorio sin anotarlas en el README privado del grupo.
    - Recargar un servicio cuenta como cambio de configuración; se documenta el comando exacto.
  - grupo: 3
    titulo: Ejemplo de trabajo del Grupo 3
    intro: >-
      El rol Púrpura no ataca ni parchea: instrumenta. Primero define qué señal debería
      aparecer en el registro, después ejecuta la acción y por último compara lo que se
      registró con lo que se hizo. Lo que no aparece es tan importante como lo que aparece.
    bloques:
    - titulo: Definir la señal antes de ejecutar
      texto: >-
        Se escribe primero la regla, con su umbral, y solo después se busca en el
        registro. Al revés se termina justificando lo que apareció en vez de medir lo que
        debería aparecer.
    - titulo: Conservar los registros del periodo
      texto: >-
        La ventana de los registros se define en minutos y se guarda en crudo. Un
        registro que se consulta dos veces cambia; uno guardado no.
      comandos: |
        docker compose logs --since 30m --no-color objetivo-web > semana_01/evidencia/purpura_web.log
        docker compose logs --since 30m --no-color objetivo-linux > semana_01/evidencia/purpura_linux.log
    - titulo: Ejecutar y medir la detección
      texto: >-
        Con la regla ya escrita, se ejecutan las acciones de la semana y se cuenta cuántas
        dejan señal. El conteo por origen es el primer indicador de fuerza bruta o de
        enumeración.
      comandos: |
        nmap -sT -sV -p 8081,3000,2222 127.0.0.1 -oN semana_01/evidencia/purpura_nmap.txt
        grep -c ' 404 ' semana_01/evidencia/purpura_web.log
        awk '{print $1}' semana_01/evidencia/purpura_web.log | sort | uniq -c | sort -nr | head -5
        grep -Ei 'failed password|invalid user|connection closed by' semana_01/evidencia/purpura_linux.log | tee semana_01/evidencia/purpura_alertas.txt
    - titulo: Ajustar la regla con lo observado
      texto: >-
        Una regla que dispara con todo no detecta nada. Se propone un umbral concreto
        (por ejemplo, más de 30 líneas del mismo origen en un minuto) y se dice qué falso
        positivo y qué falso negativo quedan.
    tabla:
      titulo: Lo ejecutado frente a lo detectado
      nota: >-
        "Parcial" es una respuesta válida: obliga a explicar qué parte de la acción quedó
        fuera del registro y por qué.
      columnas: [Acción ejecutada, Señal disponible, '¿Se detectó?', Ajuste propuesto]
      filas:
      - [Nmap con -sV sobre 8081 y 3000, 'Peticiones GET en el registro de Apache y Express', Sí, 'Umbral de 30 peticiones por minuto y origen']
      - [Exploración de rutas inexistentes, 'Respuestas 404 en el registro web', Parcial, 'Contar 404 por ruta y no solo por origen']
      - [Intento de SSH con usuario alumno, 'Failed password e Invalid user en el registro de Linux', Sí, 'Alerta a partir de 3 intentos en 2 minutos']
      - [Lectura de cabeceras con curl, 'Una sola petición en el registro web', 'No', 'No se alerta: el volumen no distingue reconocimiento de uso normal']
    entregable: >-
      El informe lleva la regla de detección escrita antes de la ejecución, la tabla de lo
      ejecutado frente a lo detectado y la lista de falsos positivos y negativos con el
      ajuste concreto. La consulta final debe poder copiarse y volver a ejecutarse.
    estructura: |
      semana_01/
      |-- informe.md
      |-- evidencia/
      |   |-- purpura_web.log
      |   |-- purpura_linux.log
      |   |-- purpura_alertas.txt
      |   `-- purpura_nmap.txt
      `-- README.md
    comprobaciones:
    - La regla y el umbral están escritos antes de la tabla de resultados.
    - Cada fila de la tabla cita el archivo y la consulta que la respalda.
    - Hay al menos un falso positivo o negativo declarado, con su ajuste.
    - Los registros se guardaron en crudo y no se editaron después.
    avisos:
    - Los registros pueden contener rutas y direcciones internas; se anonimizan antes de subirlos.
    - Una detección no demuestra que el ataque fallara: son dos medidas distintas.
  - grupo: 4
    titulo: Ejemplo de trabajo del Grupo 4
    intro: >-
      El rol Legal y reporte no repite el análisis: comprueba el alcance, anonimiza,
      verifica la cadena de custodia e integra. Su producto es el informe final y la
      declaración explícita de lo que no se pudo verificar.
    bloques:
    - titulo: Comprobar que el alcance cubre lo ejecutado
      texto: >-
        Se contrasta cada acción del informe con la autorización y con el alcance escrito.
        Lo que no esté cubierto se retira, aunque el resultado técnico sea correcto.
    - titulo: Anonimizar y verificar la integridad
      texto: >-
        Anonimizar es sustituir el dato, no borrar la línea. Después se recalcula el hash
        de lo entregado: si el hash no coincide con el que se anotó al capturar, la
        evidencia no es la misma.
      comandos: |
        sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/[IP]/g' semana_01/evidencia/nmap_full.txt > semana_01/evidencia/nmap_anon.txt
        grep -RniE 'password|token|api[_-]?key|correo|c[eé]dula' semana_01 --include='*.md' --include='*.txt' | tee semana_01/evidencia/leg_revision_datos.txt
        find semana_01 -type f -print0 | xargs -0 sha256sum > semana_01/evidencia/leg_cadena_custodia.sha256
    - titulo: Integrar técnico y ejecutivo
      texto: >-
        El resumen ejecutivo no es un adorno: dice qué se encontró, qué riesgo implica y
        qué se recomienda, en una página y sin jerga. El informe técnico es el que
        respalda cada afirmación con su evidencia.
    tabla:
      titulo: Datos del informe y su tratamiento
      nota: >-
        La columna de tratamiento no admite "anonimizado" a secas: se escribe la
        sustitución concreta y el archivo donde consta.
      columnas: [Elemento, '¿Dato personal?', Tratamiento aplicado, Dónde consta]
      filas:
      - ['Direcciones IP del laboratorio', 'No', 'Sustituidas por [IP] en la versión entregable', 'nmap_anon.txt y diff de líneas']
      - ['Nombres de usuario del sistema', 'Posible', 'Se conservan solo los de servicio, no los de persona', 'leg_revision_datos.txt']
      - ['Credenciales usadas en el laboratorio', Sí, 'No se transcriben; se referencia el README privado del grupo', 'README.md del repositorio']
      - ['Capturas de pantalla', 'Posible', 'Recortadas para excluir correo, nombre y sesión', 'Índice de figuras del informe']
    entregable: >-
      Un informe único con resumen ejecutivo de una página, informe técnico con la
      evidencia citada, declaración de alcance y límites, y la cadena de custodia con los
      hashes de todo lo entregado.
    estructura: |
      semana_01/
      |-- informe.md
      |-- resumen_ejecutivo.md
      |-- evidencia/
      |   |-- nmap_full.txt
      |   |-- nmap_anon.txt
      |   |-- leg_revision_datos.txt
      |   `-- leg_cadena_custodia.sha256
      `-- README.md
    comprobaciones:
    - Cada afirmación del informe técnico cita un archivo de evidencia.
    - El resumen ejecutivo cabe en una página y no usa siglas sin explicarlas.
    - Los hashes entregados coinciden con los calculados sobre los archivos finales.
    - Hay una sección de límites que dice qué no se pudo verificar y por qué.
    avisos:
    - La anonimización es irreversible en la versión entregable; el original queda en el README privado.
    - Si el alcance no cubre una acción, se retira del informe aunque el resultado sea válido.
- numero: 2
  fase: 1
  titulo: Criptografía aplicada y gestión de secretos
  objetivo: Aplicar cifrado simétrico y asimétrico, funciones hash y derivación de claves, y diagnosticar una configuración TLS insegura.
  contenidos:
  - Cifrado simétrico AES en modos GCM y CBC, y por qué GCM aporta integridad.
  - Cifrado asimétrico RSA y curvas elípticas; intercambio de claves.
  - Hash criptográfico, HMAC y funciones de derivación PBKDF2 y Argon2.
  - TLS 1.2 y 1.3, cadena de certificados y errores de validación.
  - Gestión de secretos y detección de claves en repositorios.
  herramientas:
  - openssl
  - sha256sum
  - Python hashlib
  glosario:
  - Cifrado simétrico
  - Cifrado asimétrico
  - Hash criptográfico
  - HMAC
  - Derivación de claves
  - TLS
  - Cadena de certificados
  - Gestión de secretos
  practica:
    titulo: Caja de herramientas criptográficas
    escenario: 'Cada grupo cifra y descifra un archivo, firma y verifica un mensaje, inspecciona un certificado real y mide el coste de derivar una clave con distinto número de iteraciones.

      '
    pasos:
    - Cifrar y descifrar un archivo con AES-256-GCM y verificar que un byte alterado rompe la integridad.
    - Generar un par de claves, firmar un mensaje y verificar la firma; después alterar el mensaje y comprobar el fallo.
    - Extraer e inspeccionar el certificado de un sitio real, identificando emisor, validez y algoritmo.
    - Medir el tiempo de PBKDF2 con 10000, 100000 y 600000 iteraciones y tabular el resultado.
    - Documentar qué primitiva resuelve confidencialidad, integridad y autenticidad en cada caso.
    entregable: Registro de comandos, salidas y una tabla que asigne cada primitiva a la propiedad que garantiza.
    criterios:
    - criterio: Cifrado y descifrado correctos con verificación de integridad
      peso: 3.0
    - criterio: Firma y verificación demostradas, incluido el caso alterado
      peso: 2.5
    - criterio: Lectura correcta del certificado y de la cadena
      peso: 2.0
    - criterio: Medición de KDF con conclusión sobre coste y seguridad
      peso: 1.5
    - criterio: Explicación de qué propiedad cubre cada primitiva
      peso: 1.0
  evaluacion: formativa
  ejemplos:
  - grupo: 1
    titulo: Cifrar, firmar y romper la integridad
    intro: >-
      El rol Rojo no confia en una primitiva hasta verla fallar: cifra un archivo,
      altera un byte y comprueba que la integridad se detecta. La evidencia es la
      salida real de cada paso, no la explicacion.
    bloques:
    - titulo: Cifrar con AES-256-GCM y guardar clave, nonce y hashes
      texto: >-
        GCM es cifrado autenticado: produce confidencialidad e integridad en una sola
        operacion. La clave y el nonce se guardan aparte porque sin ellos no hay
        reproduccion posible.
      comandos: |
        mkdir -p semana_02/evidencia
        head -c 4096 /dev/urandom > semana_02/evidencia/mensaje.bin
        python3 - <<'PY'
        from cryptography.hazmat.primitives.ciphers.aead import AESGCM
        import os
        clave = AESGCM.generate_key(bit_length=256)
        nonce = os.urandom(12)
        datos = open('semana_02/evidencia/mensaje.bin', 'rb').read()
        open('semana_02/evidencia/clave.bin', 'wb').write(clave)
        open('semana_02/evidencia/nonce.bin', 'wb').write(nonce)
        open('semana_02/evidencia/mensaje.gcm', 'wb').write(
            AESGCM(clave).encrypt(nonce, datos, None))
        PY
        sha256sum semana_02/evidencia/mensaje.bin semana_02/evidencia/mensaje.gcm \
          > semana_02/evidencia/hashes.sha256
    - titulo: Alterar un byte y demostrar que la autenticacion falla
      texto: >-
        Un solo bit cambiado debe hacer que el descifrado lance excepcion. Si no la
        lanza, lo que se uso no era cifrado autenticado y el hallazgo se reporta.
      comandos: |
        cp semana_02/evidencia/mensaje.gcm semana_02/evidencia/alterado.gcm
        python3 - <<'PY' | tee semana_02/evidencia/integridad.txt
        from cryptography.hazmat.primitives.ciphers.aead import AESGCM
        p = 'semana_02/evidencia/alterado.gcm'
        b = bytearray(open(p, 'rb').read())
        b[20] ^= 0x01
        open(p, 'wb').write(bytes(b))
        try:
            AESGCM(open('semana_02/evidencia/clave.bin','rb').read()).decrypt(
                open('semana_02/evidencia/nonce.bin','rb').read(), bytes(b), None)
            print('ERROR: el texto alterado se descifro')
        except Exception as exc:
            print('integridad rota:', type(exc).__name__)
        PY
    - titulo: Firmar un mensaje, verificar y repetir con el mensaje alterado
      texto: >-
        La firma cubre el hash del mensaje y la identidad de la clave. Se verifica el
        original y despues se repite con otro contenido: la segunda verificacion debe
        fallar y ese fallo es la prueba.
      comandos: |
        openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
          -out semana_02/evidencia/firma.pem
        openssl pkey -in semana_02/evidencia/firma.pem -pubout \
          -out semana_02/evidencia/firma.pub.pem
        openssl dgst -sha256 -sign semana_02/evidencia/firma.pem \
          -out semana_02/evidencia/mensaje.sig semana_02/evidencia/mensaje.bin
        openssl dgst -sha256 -verify semana_02/evidencia/firma.pub.pem \
          -signature semana_02/evidencia/mensaje.sig semana_02/evidencia/mensaje.bin \
          | tee semana_02/evidencia/firma_ok.txt
        printf 'mensaje distinto\n' > semana_02/evidencia/mensaje_alterado.bin
        openssl dgst -sha256 -verify semana_02/evidencia/firma.pub.pem \
          -signature semana_02/evidencia/mensaje.sig \
          semana_02/evidencia/mensaje_alterado.bin 2>&1 \
          | tee semana_02/evidencia/firma_alterada.txt
    - titulo: Medir el coste de PBKDF2 y elegir iteraciones con datos
      texto: >-
        El coste de derivar una clave es una defensa contra la fuerza bruta, pero
        tambien una condicion de usabilidad. Se mide tres veces cada valor y se
        reporta la mediana, no la mejor cifra.
      comandos: |
        python3 - <<'PY' | tee semana_02/evidencia/pbkdf2.txt
        import hashlib, statistics, time
        for iteraciones in (10_000, 100_000, 600_000):
            tiempos = []
            for _ in range(3):
                t = time.perf_counter()
                hashlib.pbkdf2_hmac('sha256', b'clave-de-prueba', b'sal-fija',
                                    iteraciones)
                tiempos.append(time.perf_counter() - t)
            print(iteraciones, round(statistics.median(tiempos), 3), 's')
        PY
    tabla:
      titulo: Primitiva, operacion y propiedad garantizada
      nota: >-
        La ultima columna se llena con lo observado en esta practica; si una fila no se
        ejecuto, se marca como no verificada en vez de suponer el resultado.
      columnas: [Primitiva, Operacion, Propiedad, Si se altera un byte, Resultado observado]
      anchos: [2.6, 3.0, 3.0, 2.9, 3.0]
      filas:
      - [AES-256-GCM, 'AESGCM.encrypt y decrypt', 'Confidencialidad e integridad', 'El descifrado lanza excepcion', 'Falla detectada y registrada']
      - [RSA-2048 con SHA-256, 'openssl dgst -sign', 'Autenticidad e integridad', 'La verificacion no valida', 'Firma rechazada']
      - [SHA-256, 'sha256sum sobre el archivo', 'Integridad del archivo', 'El resumen cambia por completo', 'Cambio evidente']
      - [PBKDF2-HMAC-SHA256, 'hashlib.pbkdf2_hmac', 'Resistencia a fuerza bruta', 'No aplica a la medicion', '600000 itera unas 60 veces mas']
    entregable: >-
      El informe enlaza cada archivo de evidencia con el comando que lo produjo y
      explica, con la tabla, que propiedad cubre cada primitiva y que se rompe al
      alterar un byte.
    estructura: |
      semana_02/
      |-- informe.md
      |-- evidencia/
      |   |-- mensaje.bin
      |   |-- mensaje.gcm
      |   |-- clave.bin
      |   |-- nonce.bin
      |   |-- alterado.gcm
      |   |-- integridad.txt
      |   |-- firma_ok.txt
      |   |-- firma_alterada.txt
      |   |-- pbkdf2.txt
      |   `-- hashes.sha256
      `-- README.md
    comprobaciones:
    - El fallo de integridad se reproduce con el comando del informe y el archivo alterado.
    - La verificacion de la firma alterada aparece en evidencia/ con su salida real.
    - La tabla distingue confidencialidad, integridad y autenticidad sin confundirlas.
    - Ninguna clave privada ni contrasena real esta en el repositorio.
    avisos:
    - La clave y el nonce de prueba son desechables; no se reutilizan fuera de la practica.
    - Un byte alterado tambien puede romper el padding: se distingue ese error del fallo de autenticacion.
  - grupo: 2
    titulo: Diagnosticar TLS y elegir parametros con medicion
    intro: >-
      El rol Azul parte de una configuracion que ya existe y comprueba si valida: lee
      el certificado, la cadena y el algoritmo, y elige los parametros de derivacion con
      una medicion propia.
    bloques:
    - titulo: Fijar la linea base del certificado y la cadena
      texto: >-
        Se inspecciona un sitio real y se guarda la salida completa. Emisor, fechas y
        algoritmo se leen del certificado, no de la pagina web.
      comandos: |
        mkdir -p semana_02/evidencia
        openssl s_client -connect www.example.com:443 -servername www.example.com \
          -verify_return_error </dev/null > semana_02/evidencia/tls_handshake.txt 2>&1
        openssl s_client -connect www.example.com:443 -servername www.example.com \
          -showcerts </dev/null 2>/dev/null \
          | openssl x509 -noout -issuer -subject -dates \
          | tee semana_02/evidencia/cert_resumen.txt
    - titulo: Leer algoritmo, clave publica y verificacion de la cadena
      texto: >-
        La cadena se valida contra el almacen del sistema. Si falla la validacion, esa
        linea del registro es el hallazgo: no se cambia el comando para que pase.
      comandos: |
        openssl s_client -connect www.example.com:443 -servername www.example.com \
          -showcerts </dev/null 2>/dev/null | openssl x509 -noout -text \
          | grep -E 'Signature Algorithm|Public-Key|DNS:' \
          | tee semana_02/evidencia/cert_detalle.txt
        openssl s_client -connect www.example.com:443 -servername www.example.com \
          -CAfile /etc/ssl/certs/ca-certificates.crt -verify_return_error </dev/null \
          >/dev/null 2>semana_02/evidencia/cadena.txt; \
          grep -E 'Verify return code' semana_02/evidencia/cadena.txt
    - titulo: Comparar PBKDF2 y Argon2 con el mismo criterio
      texto: >-
        Se mide el coste de cada opcion con el mismo hardware y se elige la que sostiene
        el mismo tiempo objetivo con mas resistencia. Si Argon2 no esta instalado, se
        documenta la limitacion y se decide solo con PBKDF2.
      comandos: |
        python3 - <<'PY' | tee semana_02/evidencia/kdf_comparativa.txt
        import hashlib, time
        for iteraciones in (100_000, 600_000):
            t = time.perf_counter()
            hashlib.pbkdf2_hmac('sha256', b'clave', b'sal', iteraciones)
            print('pbkdf2', iteraciones, round(time.perf_counter() - t, 3), 's')
        try:
            from argon2.low_level import hash_secret_raw, Type
            t = time.perf_counter()
            hash_secret_raw(b'clave', b'sal', time_cost=3, memory_cost=65536,
                            parallelism=4, hash_len=32, type=Type.ID)
            print('argon2id', round(time.perf_counter() - t, 3), 's')
        except ImportError:
            print('argon2 no disponible: se documenta como limitacion')
        PY
    - titulo: Verificar que el repositorio no filtra secretos
      texto: >-
        Antes de entregar se busca material sensible con patrones y con el historial de
        git. Un secreto en un commit viejo sigue siendo un secreto expuesto.
      comandos: |
        git grep -nE 'BEGIN (RSA|OPENSSH|EC|PRIVATE) PRIVATE KEY' || true
        git grep -nEi '(api[_-]?key|secret|token|password)[[:space:]]*=' || true
        git log --all --oneline -- semana_02/evidencia/*.pem || true
    tabla:
      titulo: Configuracion observada y decision
      nota: >-
        La decision se justifica con la salida pegada; "correcto" sin evidencia no se
        acepta como verificacion.
      columnas: [Elemento, Estado observado, Riesgo, Decision, Verificacion]
      anchos: [2.4, 3.2, 2.4, 3.2, 2.9]
      filas:
      - [Certificado, 'Emisor, fechas y DNS leidos', 'Caducidad o nombre incorrecto', 'Se documenta y se vigila la fecha', 'Salida en cert_resumen.txt']
      - [Cadena, 'Verify return code 0 contra el almacen del sistema', 'Cadena incompleta', 'Sin accion si valida', 'Salida en cadena.txt']
      - [Algoritmo de firma, 'Leido del certificado', 'Algoritmo debil o clave corta', 'Se reporta si es menor de 2048 bits', 'Linea en cert_detalle.txt']
      - [KDF, 'Tiempo medido por iteraciones', 'Coste insuficiente', '600000 iteraciones como minimo', 'Tabla de tiempos']
      - [Secretos, 'Busqueda en arbol e historial', 'Clave privada versionada', 'Se retira y se rota', 'git grep sin resultados']
    entregable: >-
      El informe incluye la lectura del certificado y su cadena, la comparacion de KDF
      con tiempos propios y la lista de verificaciones ejecutadas antes de entregar.
    estructura: |
      semana_02/
      |-- informe.md
      |-- evidencia/
      |   |-- tls_handshake.txt
      |   |-- cert_resumen.txt
      |   |-- cert_detalle.txt
      |   |-- cadena.txt
      |   |-- kdf_comparativa.txt
      |   `-- secretos.txt
      `-- README.md
    comprobaciones:
    - La validacion de la cadena se ejecuta con el almacen del sistema, no con uno propio.
    - La eleccion de iteraciones se apoya en tiempos medidos y repetidos.
    - La busqueda de secretos cubre el historial, no solo el arbol actual.
    - Si Argon2 no esta disponible, la limitacion esta escrita.
    avisos:
    - No se pega la clave privada ni el contenido del almacen de confianza en el informe.
    - Un certificado valido no implica que el servicio sea seguro: se separan ambos juicios.
  - grupo: 3
    titulo: Instrumentar las operaciones criptograficas
    intro: >-
      El rol Púrpura no cifra por cifrar: define que señal deberia quedar registrada,
      ejecuta la operacion y comprueba que el registro permite reconstruirla sin
      exponer secretos.
    bloques:
    - titulo: Envolver las operaciones y registrar solo metadatos
      texto: >-
        El registro guarda operacion, marca de tiempo, identificador de clave y
        resultado. Nunca la clave, el nonce completo ni el texto claro.
      comandos: |
        mkdir -p semana_02/evidencia
        cat > semana_02/registro.py <<'PY'
        import json, sys, time
        from cryptography.hazmat.primitives.ciphers.aead import AESGCM
        import os

        def registrar(operacion, clave_id, resultado):
            linea = {"ts": time.time(), "op": operacion,
                     "clave_id": clave_id, "resultado": resultado}
            with open('semana_02/evidencia/cripto.jsonl', 'a') as fh:
                fh.write(json.dumps(linea) + "\n")

        clave = AESGCM.generate_key(bit_length=256)
        nonce = os.urandom(12)
        datos = open('semana_02/evidencia/mensaje.bin', 'rb').read()
        AESGCM(clave).encrypt(nonce, datos, None)
        registrar('aes-gcm-cifrar', 'clave-01', 'ok')
        try:
            AESGCM(clave).decrypt(nonce, datos, None)
            registrar('aes-gcm-cifrar', 'clave-01', 'ok')
        except Exception:
            registrar('aes-gcm-cifrar', 'clave-01', 'error')
        PY
        python3 semana_02/registro.py
    - titulo: Medir reutilizacion de nonce en cien cifrados
      texto: >-
        Repetir un nonce con la misma clave rompe GCM por completo. El script genera
        cien nonces y verifica que no se repite ninguno; el resultado va al registro.
      comandos: |
        python3 - <<'PY' | tee semana_02/evidencia/nonces.txt
        import os
        nonces = [os.urandom(12) for _ in range(100)]
        print('total', len(nonces))
        print('unicos', len(set(nonces)))
        print('reutilizados', len(nonces) - len(set(nonces)))
        PY
    - titulo: Buscar material criptografico expuesto
      texto: >-
        Se buscan claves privadas y cadenas con alta entropia en el arbol y en el
        historial. La deteccion mira el repositorio, no solo los archivos del informe.
      comandos: |
        git grep -nE 'BEGIN (RSA|OPENSSH|EC|PRIVATE) PRIVATE KEY' \
          | tee semana_02/evidencia/secretos.txt || true
        git grep -nEi '(api[_-]?key|token)[[:space:]]*=[[:space:]]*[A-Za-z0-9/+]{20,}' \
          >> semana_02/evidencia/secretos.txt || true
    tabla:
      titulo: Señal, fuente y umbral de alerta
      nota: >-
        El umbral se declara antes de medir; si se ajusta despues de ver el resultado,
        se anota el cambio y el motivo.
      columnas: [Senal, Fuente, Registro, Umbral, Accion]
      anchos: [2.4, 2.5, 3.2, 2.4, 3.4]
      filas:
      - [Cifrado fallido, 'Envoltorio de AESGCM', 'cripto.jsonl resultado error', 'Mas de 3 en 5 minutos', 'Revisar clave y nonce']
      - [Nonce repetido, 'Generador de 100 cifrados', 'nonces.txt reutilizados', 'Cualquier valor mayor que 0', 'Rotar clave de inmediato']
      - [Clave privada en repo, 'git grep en arbol e historial', 'secretos.txt', 'Cualquier coincidencia', 'Retirar, rotar y avisar']
      - [KDF por debajo del objetivo, 'Medicion de tiempos', 'pbkdf2.txt', 'Menos de 0,2 s', 'Subir iteraciones']
    entregable: >-
      El informe presenta el envoltorio, un extracto del registro JSONL y la tabla de
      señales con su umbral, ademas de la busqueda de material expuesto.
    estructura: |
      semana_02/
      |-- informe.md
      |-- registro.py
      |-- evidencia/
      |   |-- cripto.jsonl
      |   |-- nonces.txt
      |   `-- secretos.txt
      `-- README.md
    comprobaciones:
    - El registro no contiene claves, nonces completos ni texto claro.
    - La comprobacion de nonces se ejecuta y su salida esta en evidencia/.
    - Cada señal tiene un umbral declarado y una accion asociada.
    - La busqueda de secretos incluye el historial de git.
    avisos:
    - Registrar metadatos de una operacion sensible tambien es dato personal: se limita a lo necesario.
    - Un nonce de prueba no se reutiliza en produccion aunque el registro diga ok.
  - grupo: 4
    titulo: Custodia de secretos y admisibilidad de la evidencia
    intro: >-
      El rol Legal ordena lo que los demas producen: quien custodia cada secreto, quien
      puede usarlo, cuanto se conserva y que evidencia seria admisible si el hallazgo
      termina en un procedimiento.
    bloques:
    - titulo: Inventariar los secretos del laboratorio
      texto: >-
        Se listan credenciales, claves y tokens que existen en el entorno, con su
        soporte y responsable. No se copia su valor en el inventario: se identifica,
        no se duplica.
      comandos: |
        mkdir -p semana_02/evidencia
        docker compose ps --format json > semana_02/evidencia/servicios.json
        printf 'inventario de secretos: solo identificadores, nunca valores\n' \
          > semana_02/evidencia/secretos_politica.txt
    - titulo: Definir custodia, rotacion y acceso
      texto: >-
        Cada secreto tiene un custodio nombrado, una frecuencia de rotacion y una regla
        de acceso. Un secreto sin custodio es un secreto sin dueño y, por tanto, sin
        responsabilidad.
    - titulo: Registrar la cadena de custodia de la evidencia
      texto: >-
        El formulario anota quien adquiere, cuando, con que herramienta y con que hash.
        Cualquier transferencia posterior se registra con hora y firma.
      comandos: |
        sha256sum semana_02/evidencia/*.txt semana_02/evidencia/*.json \
          > semana_02/evidencia/custodia.sha256
        date -u +%Y-%m-%dT%H:%M:%SZ >> semana_02/evidencia/registro_custodia.txt
        id -un >> semana_02/evidencia/registro_custodia.txt
    - titulo: Analizar admisibilidad y tipificar el caso
      texto: >-
        Se separa lo que se obtuvo con autorizacion de lo que no. La evidencia sin
        autorizacion no se "arregla" con un informe mejor: se excluye y se explica por
        que.
    tabla:
      titulo: Secreto, custodia y base de la decision
      nota: >-
        La columna normativa cita la fuente usada en la semana 3; si el grupo no tiene
        la norma a mano, escribe "pendiente de verificar" en vez de inventar el articulo.
      columnas: [Secreto, Soporte, Custodio, Rotacion, Base de la decision]
      anchos: [2.8, 2.6, 2.4, 2.2, 4.2]
      filas:
      - [Credenciales de DVWA, 'Contenedor del laboratorio', 'Grupo 2', 'Por practica', 'Dato de prueba, no personal']
      - [Clave de firma RSA, 'Archivo local con permisos 600', 'Grupo 1', 'Mensual o ante incidente', 'Autenticidad del entregable']
      - [Token de GitHub del grupo, 'Gestor de secretos del repositorio', 'Grupo 4', 'Trimestral', 'Acceso al repositorio privado']
      - [Evidencia de la practica, 'Carpeta con hashes y registro', 'Grupo 4', 'Hasta cerrar el curso', 'Trazabilidad y cadena de custodia']
    entregable: >-
      El informe entrega el inventario, la politica de custodia y rotacion, el registro
      con hashes y el juicio de admisibilidad del caso, separando hechos de hipotesis.
    estructura: |
      semana_02/
      |-- informe.md
      |-- evidencia/
      |   |-- servicios.json
      |   |-- secretos_politica.txt
      |   |-- custodia.sha256
      |   `-- registro_custodia.txt
      `-- README.md
    comprobaciones:
    - El inventario identifica secretos sin transcribir su valor.
    - Cada secreto tiene custodio y frecuencia de rotacion declarados.
    - El registro de custodia incluye hash, fecha y usuario que adquirio.
    - El juicio de admisibilidad distingue lo autorizado de lo que no lo esta.
    avisos:
    - No se sube al repositorio ningun valor de credencial, ni siquiera de laboratorio.
    - La evidencia sin autorizacion se documenta como excluida, no se intenta justificar.
- numero: 3
  fase: 1
  titulo: Marco legal, ético y normativo
  objetivo: Identificar las obligaciones legales y normativas antes de auditar, y redactar un alcance autorizado con reglas de enfrentamiento.
  contenidos:
  - Ley Especial contra los Delitos Informáticos y tipos penales aplicables.
  - Autorización escrita, alcance, ventana de pruebas y reglas de enfrentamiento.
  - ISO IEC 27001, NIST CSF 2.0, ENS y GDPR como marcos de referencia.
  - OWASP ASVS y WSTG como estándares de verificación técnica.
  - Cadena de custodia, integridad de la evidencia y confidencialidad.
  - Código de ética del curso y consecuencias del uso indebido.
  herramientas:
  - Plantilla de autorización
  - Normativa en PDF
  glosario:
  - Autorización escrita
  - Reglas de enfrentamiento
  - ISO/IEC 27001
  - NIST CSF
  - OWASP ASVS
  - Cadena de custodia
  - Código de ética
  practica:
    titulo: Carta de autorización y análisis de caso
    escenario: 'Cada grupo redacta la autorización de la auditoría de su objetivo del laboratorio y analiza un incidente ficticio, identificando qué normas se violaron y qué evidencia sería admisible.

      '
    pasos:
    - Redactar el alcance con activos incluidos, activos excluidos y ventana de pruebas.
    - Añadir reglas de enfrentamiento para hallazgos críticos y para datos personales.
    - Analizar el caso ficticio y tipificar las conductas descritas.
    - Determinar qué evidencia es admisible y cuál se contaminó en el relato.
    - Firmar el código de ética del curso de forma individual.
    entregable: Autorización firmada, análisis del caso y código de ética firmado por cada estudiante.
    criterios:
    - criterio: Alcance explícito con inclusiones y exclusiones
      peso: 3.0
    - criterio: Reglas de enfrentamiento operativas
      peso: 2.5
    - criterio: Tipificación correcta de las conductas del caso
      peso: 2.0
    - criterio: Juicio fundamentado sobre admisibilidad de la evidencia
      peso: 1.5
    - criterio: Código de ética firmado individualmente
      peso: 1.0
  evaluacion: control_fase_1
  ejemplos:
  - grupo: 1
    titulo: Alcance, activos y reglas de enfrentamiento
    intro: >-
      El rol Rojo define primero el campo de juego: que se toca, que no se toca, en que
      ventana y que se hace si aparece algo critico. Sin eso, cualquier hallazgo es
      inutilizable aunque sea cierto.
    bloques:
    - titulo: Convertir el laboratorio en un alcance escrito
      texto: >-
        El alcance se escribe con activos observados, no con lo que se recuerda. Cada
        linea del inventario se puede rastrear a una salida de `docker compose ps`.
      comandos: |
        mkdir -p semana_03/evidencia
        docker compose ps > semana_03/evidencia/activos_observados.txt
        date -u +%Y-%m-%dT%H:%M:%SZ > semana_03/evidencia/ventana.txt
        git log -1 --format='%H %ad' >> semana_03/evidencia/ventana.txt
        sha256sum semana_03/activos_observados.txt \
          > semana_03/evidencia/activos_observados.sha256
    - titulo: Separar incluido, excluido y fuera de alcance
      texto: >-
        Excluir es tan importante como incluir: la red del campus, los servicios de la
        universidad y cualquier host que no sea 127.0.0.1 quedan fuera por escrito.
    - titulo: Escribir las reglas de enfrentamiento
      texto: >-
        Las reglas dicen que hacer ante un hallazgo critico y ante datos personales.
        No son recomendaciones: son detenciones obligatorias con un responsable
        nombrado y un canal de aviso.
    - titulo: Firmar y sellar la autorizacion
      texto: >-
        La autorizacion se firma antes de ejecutar el primer comando. Su hash y su
        fecha entran en la evidencia para que nadie pueda sustituirla despues.
      comandos: |
        sha256sum semana_03/autorizacion.md > semana_03/evidencia/autorizacion.sha256
        cat semana_03/evidencia/autorizacion.sha256
    tabla:
      titulo: Activo, decision y limite aplicable
      nota: >-
        La columna de limite se llena con una regla operativa concreta; "con cuidado" no
        es un limite verificable.
      columnas: [Activo, Incluido, Limite operativo, Ventana, Responsable]
      anchos: [2.8, 1.9, 4.2, 2.8, 2.6]
      filas:
      - [DVWA en 127.0.0.1:8081, 'Si', 'Pruebas de inyeccion sin borrar datos', 'Sesion de laboratorio', 'Grupo 1']
      - [Juice Shop en 127.0.0.1:3000, 'Si', 'Sin denegacion de servicio ni fuerza bruta masiva', 'Sesion de laboratorio', 'Grupo 1']
      - [SSH del contenedor en 2222, 'Si', 'Maximo 20 intentos por cuenta', 'Sesion de laboratorio', 'Grupo 1']
      - [Red del campus, 'No', 'Fuera de alcance por escrito', 'No aplica', 'Grupo 1']
      - [Datos personales reales, 'No', 'Si aparecen, se detiene y se avisa', 'Inmediato', 'Grupo 1']
    entregable: >-
      Se entrega la autorizacion firmada con activos, exclusiones, ventana y reglas de
      enfrentamiento, mas el hash que la sella y el inventario que la respalda.
    estructura: |
      semana_03/
      |-- autorizacion.md
      |-- informe.md
      |-- evidencia/
      |   |-- activos_observados.txt
      |   |-- activos_observados.sha256
      |   |-- ventana.txt
      |   `-- autorizacion.sha256
      `-- README.md
    comprobaciones:
    - Cada activo incluido aparece en la salida de docker compose ps.
    - Las exclusiones nombran hosts concretos, no categorias vagas.
    - Las reglas de enfrentamiento tienen responsable y canal de aviso.
    - El hash de la autorizacion se calculo antes de ejecutar cualquier prueba.
    avisos:
    - Un hallazgo critico obliga a detenerse y avisar antes de seguir explorando.
    - La autorizacion no se modifica despues de firmada; si cambia el alcance, se firma otra.
  - grupo: 2
    titulo: Autorizacion con limites verificables
    intro: >-
      El rol Azul escribe la autorizacion pensando en como se comprueba: tasas maximas,
      herramientas permitidas y un plan de vuelta atras. Una autorizacion sin limites
      medibles no protege a nadie.
    bloques:
    - titulo: Declarar herramientas y tasas permitidas
      texto: >-
        La tasa se declara antes de medir y se aplica en el comando. Si el escaneo tarda
        mas, es correcto: el limite manda sobre la prisa.
      comandos: |
        mkdir -p semana_03/evidencia
        nmap --version | head -1 > semana_03/evidencia/herramientas.txt
        nmap -sT -p 8081,3000,2222 --max-rate 20 127.0.0.1 \
          -oN semana_03/evidencia/roe_scan.txt
        grep -E 'Nmap scan report|Not shown|elapsed' \
          semana_03/evidencia/roe_scan.txt
    - titulo: Fijar el plan de vuelta atras
      texto: >-
        Antes de tocar configuracion se guarda el estado que permite restaurarla. Si el
        servicio no arranca despues del cambio, ese archivo es la unica salida.
      comandos: |
        docker exec objetivo-web cp /etc/apache2/apache2.conf \
          /tmp/apache2.conf.bak
        docker exec objetivo-web sha256sum /tmp/apache2.conf.bak \
          > semana_03/evidencia/rollback.sha256
    - titulo: Definir criterios de parada
      texto: >-
        Se declaran tres detenciones: datos personales, indisponibilidad de un servicio
        y hallazgo que permita acceso fuera del alcance. Cada una tiene quien decide y
        como se comunica.
    - titulo: Verificar que la autorizacion cubre lo que se ejecuta
      texto: >-
        Se compara comando por comando con el alcance. Lo que no esta cubierto no se
        ejecuta, aunque parezca inofensivo.
    tabla:
      titulo: Limite declarado y como se verifica
      nota: >-
        La verificacion se hace con una salida del propio comando, no con una promesa en
        el documento.
      columnas: [Limite, Valor, Verificacion, Evidencia, Si se incumple]
      anchos: [2.4, 1.8, 3.6, 2.8, 3.4]
      filas:
      - [Tasa de sondeo, '20 paquetes por segundo', 'Opcion max-rate del comando', 'roe_scan.txt', 'Se detiene y se repite']
      - [Intentos SSH, '20 por cuenta', 'Contador del propio script', 'ssh_intentos.txt', 'Se aborta la prueba']
      - [Servicios objetivo, 'Solo 8081, 3000 y 2222', 'Lista de puertos del comando', 'roe_scan.txt', 'No se ejecuta']
      - [Vuelta atras, 'Copia previa y hash', 'sha256sum de la copia', 'rollback.sha256', 'Se restaura antes de seguir']
    entregable: >-
      La autorizacion incluye herramientas, tasas, criterios de parada y plan de vuelta
      atras, con una verificacion ejecutada para cada limite.
    estructura: |
      semana_03/
      |-- autorizacion.md
      |-- informe.md
      |-- evidencia/
      |   |-- herramientas.txt
      |   |-- roe_scan.txt
      |   `-- rollback.sha256
      `-- README.md
    comprobaciones:
    - La tasa declarada aparece en el comando y en la salida.
    - El plan de vuelta atras se probo al menos una vez sin romper el laboratorio.
    - Los criterios de parada nombran quien decide.
    - Lo ejecutado no excede lo autorizado, comparado linea por linea.
    avisos:
    - Un escaneo lento por respetar la tasa no es un fallo de la practica.
    - Restaurar un servicio modificado cuenta como cambio: se documenta el comando.
  - grupo: 3
    titulo: Trazabilidad de la prueba y aviso de hallazgos
    intro: >-
      El rol Púrpura define que se registra mientras se prueba y quien recibe el aviso.
      Sin trazabilidad, la autorizacion no se puede demostrar cumplida.
    bloques:
    - titulo: Registrar inicio, comandos y fin de la ventana
      texto: >-
        Se abre un registro con marca de tiempo antes del primer comando y se cierra al
        terminar. Cada entrada dice quien ejecuto y sobre que activo.
      comandos: |
        mkdir -p semana_03/evidencia
        printf '%s inicio %s\n' "$(date -u +%FT%TZ)" "$(id -un)" \
          > semana_03/evidencia/bitacora.txt
        docker compose ps >> semana_03/evidencia/bitacora.txt
    - titulo: Definir la ruta de escalado de un hallazgo
      texto: >-
        El escalado tiene cuatro datos: quien avisa, a quien, por que canal y en cuanto
        tiempo. Un hallazgo critico no espera al informe semanal.
    - titulo: Conservar los eventos del servicio durante la prueba
      texto: >-
        Se guardan los registros del contenedor de la ventana de pruebas. Es la prueba
        de que la actividad observada corresponde a la sesion autorizada.
      comandos: |
        docker logs --since 30m objetivo-linux \
          > semana_03/evidencia/eventos_linux.txt 2>&1 || true
        docker logs --since 30m objetivo-web \
          >> semana_03/evidencia/eventos_web.txt 2>&1 || true
        sha256sum semana_03/evidencia/bitacora.txt \
          >> semana_03/evidencia/bitacora.sha256
    - titulo: Cerrar la bitacora y verificar la integridad
      texto: >-
        Al cerrar se anota el resultado y el hash de todo lo producido. Si el hash no
        coincide en la revision, la evidencia se marca como no confiable.
    tabla:
      titulo: Evento, aviso y plazo
      nota: >-
        Los plazos se declaran en minutos u horas; "lo antes posible" no se puede
        auditar.
      columnas: [Evento, Avisa a, Canal, Plazo, Registro]
      anchos: [2.8, 2.6, 2.8, 1.8, 4.0]
      filas:
      - [Hallazgo critico, 'Docente y Grupo 4', 'Canal del curso', '15 minutos', 'bitacora.txt']
      - [Datos personales, 'Docente', 'Canal del curso', 'Inmediato', 'bitacora.txt']
      - [Servicio caido, 'Grupo 2', 'Chat del grupo', '10 minutos', 'eventos_web.txt']
      - [Fin de la ventana, 'Grupo 4', 'Repositorio', 'Al cerrar', 'bitacora.sha256']
    entregable: >-
      Se entrega la bitacora con inicio, comandos, eventos, cierre y hashes, y la ruta
      de escalado con sus plazos.
    estructura: |
      semana_03/
      |-- autorizacion.md
      |-- informe.md
      |-- evidencia/
      |   |-- bitacora.txt
      |   |-- bitacora.sha256
      |   |-- eventos_linux.txt
      |   `-- eventos_web.txt
      `-- README.md
    comprobaciones:
    - La bitacora tiene hora de inicio y de cierre en UTC.
    - Cada aviso registrado indica destinatario, canal y plazo.
    - Los eventos conservados cubren la misma ventana que la prueba.
    - El hash final permite detectar cualquier cambio posterior.
    avisos:
    - Los registros pueden contener datos personales: se anonimizan antes de versionarlos.
    - La bitacora no se reescribe despues del cierre; las correcciones se anexan.
  - grupo: 4
    titulo: Tipificacion, admisibilidad y codigo de etica
    intro: >-
      El rol Legal traduce el caso ficticio a obligaciones concretas: que conducta
      encaja en que tipo, que evidencia se sostiene y cual se contamino. La etica se
      firma de forma individual, no en nombre del grupo.
    bloques:
    - titulo: Separar hechos, pruebas y conclusiones del caso
      texto: >-
        Primero se transcribe lo que ocurrio, sin calificar. Despues se marca que parte
        tiene respaldo documental y que parte es inferencia. Mezclarlas es el error que
        hace inadmisible un informe.
    - titulo: Tipificar sin inventar articulos
      texto: >-
        El tipo se identifica por su denominacion y se cita el articulo solo despues de
        verificarlo en el texto de la norma. Si no se pudo verificar, se escribe
        "pendiente de verificar" y se explica que falta.
      comandos: |
        mkdir -p semana_03/evidencia
        sha256sum semana_03/norma.pdf > semana_03/evidencia/norma.sha256
        printf 'norma verificada: %s\n' "$(date -u +%FT%TZ)" \
          > semana_03/evidencia/verificacion_norma.txt
    - titulo: Decidir que evidencia es admisible
      texto: >-
        Se evalua cada pieza con tres preguntas: se obtuvo con autorizacion, se conservo
        su integridad y se puede rastrear su origen. Si falla una, se excluye y se dice
        por que.
    - titulo: Firmar el codigo de etica de forma individual
      texto: >-
        Cada estudiante firma su propia copia. La firma del grupo no sustituye la
        individual: la responsabilidad no se delega.
      comandos: |
        sha256sum semana_03/codigo_etica_firmado_*.pdf \
          > semana_03/evidencia/etica.sha256
    tabla:
      titulo: Conducta, tipo aplicable y evidencia
      nota: >-
        El tipo se escribe por su denominacion; el numero de articulo solo si se verifico
        contra la norma. La ultima columna justifica la decision, no la repite.
      columnas: [Conducta, Tipo aplicable, Evidencia, Admisible, Motivo]
      anchos: [3.2, 3.0, 2.6, 1.6, 3.6]
      filas:
      - [Acceso sin autorizacion, 'Acceso indebido a sistema protegido', 'Registro del servidor', 'No', 'Se obtuvo fuera del alcance']
      - [Copia de datos de clientes, 'Violacion de privacidad de datos', 'Archivo sin hash', 'No', 'Integridad no verificable']
      - [Prueba dentro del alcance, 'Actividad autorizada', 'Bitacora y hashes', 'Si', 'Autorizacion previa y trazabilidad']
      - [Captura publicada sin anonimizar, 'Infraccion del codigo de etica', 'Publicacion en repositorio', 'No', 'Expone datos de terceros']
    entregable: >-
      Se entregan el analisis del caso, la tabla de admisibilidad con motivo por pieza,
      la verificacion de la norma y el codigo de etica firmado por cada estudiante.
    estructura: |
      semana_03/
      |-- autorizacion.md
      |-- analisis_caso.md
      |-- codigo_etica_firmado_1.pdf
      |-- codigo_etica_firmado_2.pdf
      |-- evidencia/
      |   |-- norma.sha256
      |   |-- verificacion_norma.txt
      |   `-- etica.sha256
      `-- README.md
    comprobaciones:
    - Cada tipo aplicable cita la fuente verificada o declara que falta verificarla.
    - Cada pieza de evidencia tiene decision y motivo.
    - Hay un codigo de etica firmado por cada integrante.
    - El analisis distingue hecho, inferencia y conclusion.
    avisos:
    - Publicar capturas con datos de terceros es una infraccion del codigo, no un detalle de estilo.
    - La verificacion de la norma se hace sobre el PDF entregado, no sobre una fuente de memoria.
- numero: 4
  fase: 2
  titulo: Reconocimiento, OSINT y escaneo de puertos
  objetivo: '> Obtener información de un dominio autorizado sin generar tráfico intrusivo, descubrir hosts y escanear puertos, distinguiendo técnicas y su ruido.'
  contenidos:
  - Registros DNS A, AAAA, MX, NS, TXT y SOA.
  - WHOIS y RDAP; datos del registrante y fechas de vigencia.
  - Enumeración de subdominios y motores de búsqueda especializados.
  - Google dorks y su uso legítimo en un alcance autorizado.
  - OPSEC del auditor y protección de la identidad durante la recolección.
  - Descubrimiento con ARP, ICMP y sondeo TCP a puertos comunes.
  - Escaneo connect, SYN semiabierto y UDP con ICMP port unreachable.
  - Estados de puerto, banner grabbing y fingerprinting.
  - Sigilo, ruido y detección; límites éticos del escaneo.
  herramientas:
  - nmap como referencia
  - Scapy
  - Python dnspython
  - python-whois
  - dig
  - socket
  glosario:
  - Registro DNS
  - WHOIS
  - Enumeración de subdominios
  - Google dorks
  - OPSEC
  - Escaneo SYN
  - Banner grabbing
  - Fingerprinting
  practica:
    titulo: Huella digital + escáner propio contra el laboratorio
    requiere_codigo: true
    escenario: '> Cada grupo construye un script que genere la huella digital (DNS/WHOIS) y un escáner propio, ejecutándolo contra los contenedores del laboratorio y comparando con nmap.'
    pasos:
    - Definir el dominio objetivo y confirmar por escrito que es propio o autorizado.
    - Implementar la huella DNS y WHOIS con manejo de errores y salida JSON normalizada.
    - Implementar sondeos TCP connect, TCP SYN y UDP con tiempo de espera configurable.
    - Ejecutar el escáner y nmap sobre el mismo objetivo, y tabular coincidencias y diferencias.
    - Medir el tiempo por técnica, explicar los falsos positivos y concluir sobre el compromiso entre velocidad y sigilo.
    entregable: Script integrado (huella digital + escáner), salida JSON, huella digital razonada, tabla comparativa con nmap y análisis de falsos positivos.
    criterios:
    - criterio: Huella digital completa (DNS/WHOIS)
      peso: 2.0
    - criterio: Escáner funcional con técnicas solicitadas
      peso: 3.0
    - criterio: Comparación rigurosa contra nmap
      peso: 2.5
    - criterio: Explicación técnica de falsos positivos y sigilo
      peso: 1.5
    - criterio: Código con type hints, docstrings y manejo de errores
      peso: 1.0
  evaluacion: formativa
  ejemplos:
  - grupo: 1
    titulo: Medir lo expuesto y comprobar que el control lo reduce
    intro: >-
      El rol Azul no se queda en el inventario: fija una linea base, aplica un control
      sobre un puerto concreto y repite la misma medicion. Lo que no se repite igual no
      demuestra nada.
    bloques:
    - titulo: Fijar la linea base con la tasa autorizada
      texto: >-
        La primera medicion se hace antes de tocar nada y con el limite de tasa del
        alcance. Se guarda la salida cruda y su hash.
      comandos: |
        mkdir -p semana_04/evidencia
        nmap -sT -p 8081,3000,2222 --max-rate 20 127.0.0.1 \
          -oN semana_04/evidencia/antes.txt
        sha256sum semana_04/evidencia/antes.txt > semana_04/evidencia/antes.sha256
    - titulo: Aplicar un control sobre un puerto
      texto: >-
        Se elige un control barato y reversible: denegar el puerto 2222 en el cortafuegos
        del host. Si el servicio debe seguir disponible para el grupo, se documenta la
        excepcion y no se aplica.
      comandos: |
        sudo nft add table inet filtro 2>/dev/null || true
        sudo nft 'add chain inet filtro entrada { type filter hook input priority 0; }' 2>/dev/null || true
        sudo nft add rule inet filtro entrada tcp dport 2222 drop
        sudo nft list chain inet filtro entrada | tee semana_04/evidencia/regla.txt
    - titulo: Repetir la medicion y diferenciar
      texto: >-
        El mismo comando, sobre el mismo objetivo, con el control activo. El diff entre
        las dos salidas es la evidencia; si no cambia, el control no estaba donde se
        creia.
      comandos: |
        nmap -sT -p 8081,3000,2222 --max-rate 20 127.0.0.1 \
          -oN semana_04/evidencia/despues.txt
        diff -u semana_04/evidencia/antes.txt semana_04/evidencia/despues.txt \
          | tee semana_04/evidencia/diff.txt
    - titulo: Revertir el control y dejar el laboratorio como estaba
      texto: >-
        Toda prueba tiene vuelta atras. Se elimina la regla, se verifica que el puerto
        responde otra vez y se anota el comando exacto que se uso.
      comandos: |
        sudo nft delete rule inet filtro entrada tcp dport 2222 drop 2>/dev/null || true
        nmap -sT -p 2222 127.0.0.1 -oN semana_04/evidencia/revertido.txt
    tabla:
      titulo: Puerto, estado y efecto del control
      nota: >-
        "Cerrado" y "filtrado" no son lo mismo: el estado se copia de la salida de nmap,
        no se deduce.
      columnas: [Puerto, Servicio, Antes, Control, Despues]
      anchos: [1.5, 2.4, 2.6, 4.4, 3.0]
      filas:
      - ['8081', 'DVWA', 'Abierto', 'Sin control: fuera del ensayo', 'Abierto']
      - ['3000', 'Juice Shop', 'Abierto', 'Sin control: fuera del ensayo', 'Abierto']
      - ['2222', 'SSH', 'Abierto', 'Regla nftables con drop', 'Filtrado']
    entregable: >-
      El informe incluye la linea base, el control aplicado con su regla, la medicion
      posterior, el diff y la reversion verificada.
    estructura: |
      semana_04/
      |-- informe.md
      |-- escaner.py
      |-- evidencia/
      |   |-- antes.txt
      |   |-- despues.txt
      |   |-- revertido.txt
      |   |-- regla.txt
      |   `-- diff.txt
      `-- README.md
    comprobaciones:
    - Antes y despues usan exactamente el mismo comando y la misma tasa.
    - La regla del cortafuegos se muestra con sudo nft list.
    - La reversion se verifico y el servicio volvio a responder.
    - El estado reportado coincide con la salida de nmap.
    avisos:
    - Modificar el cortafuegos del host puede afectar otras sesiones: se revierte al terminar.
    - Si el grupo necesita el puerto 2222, se elige otro puerto o se documenta la excepcion.
  - grupo: 2
    titulo: Ver el escaneo desde el otro lado
    intro: >-
      El rol Púrpura instrumenta el objetivo: captura el trafico que produce su propio
      escaneo, lo cuenta y lo clasifica. La pregunta no es "que puertos hay" sino "como
      se ve este escaneo en el registro".
    bloques:
    - titulo: Capturar el trafico durante un escaneo corto
      texto: >-
        Se captura solo la interfaz de loopback y solo los puertos del alcance. La
        captura se detiene sola para no crecer sin control.
      comandos: |
        mkdir -p semana_04/evidencia
        sudo timeout 20 tcpdump -i lo -nn -w semana_04/evidencia/captura.pcap \
          'tcp and (port 8081 or port 3000 or port 2222)' &
        sleep 2
        nmap -sT -p 8081,3000,2222 --max-rate 20 127.0.0.1 \
          -oN semana_04/evidencia/scan.txt
        wait
        tcpdump -nn -r semana_04/evidencia/captura.pcap | wc -l
    - titulo: Clasificar el trafico por tecnica
      texto: >-
        Un connect completa el saludo en tres pasos; un SYN semiabierto no. Contar esos
        patrones es lo que permite distinguir tecnicas desde el registro.
      comandos: |
        tcpdump -nn -r semana_04/evidencia/captura.pcap 'tcp[tcpflags] & tcp-syn != 0' \
          | wc -l > semana_04/evidencia/syn.txt
        tcpdump -nn -r semana_04/evidencia/captura.pcap \
          'tcp[tcpflags] & (tcp-syn|tcp-ack) == (tcp-syn|tcp-ack)' \
          | wc -l > semana_04/evidencia/synack.txt
        cat semana_04/evidencia/syn.txt semana_04/evidencia/synack.txt
    - titulo: Proponer una regla de deteccion
      texto: >-
        La regla se escribe con el umbral medido, no con una intuicion. Si en la ventana
        se ven veinte SYNs a puertos distintos desde una sola origen, eso es un escaneo.
    - titulo: Comprobar que la regla no dispara con trafico normal
      texto: >-
        Se repite la captura navegando por DVWA sin escanear. Si la regla dispara, el
        umbral es demasiado bajo y se ajusta anotando el motivo.
    tabla:
      titulo: Tecnica, rastro observable y deteccion
      nota: >-
        Los conteos son de esta practica concreta; otro objetivo o otra tasa da otros
        numeros y eso no invalida el metodo.
      columnas: [Tecnica, Trafico observado, Rastro, Umbral, Accion]
      anchos: [1.9, 3.4, 3.2, 2.2, 3.2]
      filas:
      - [TCP connect, 'SYN, SYN-ACK y ACK completos', 'Conexion establecida en el registro', 'Mas de 10 en un minuto', 'Revisar origen']
      - [TCP SYN, 'SYN sin completar el saludo', 'Intentos sin conexion', 'Mas de 10 en un minuto', 'Alertar']
      - [UDP, 'Paquetes sin respuesta', 'ICMP port unreachable', 'Mas de 20 en un minuto', 'Correlacionar con otros eventos']
      - [Navegacion normal, 'Conexiones a 8081', 'Sesion HTTP con contenido', 'No aplica', 'Sin accion']
    entregable: >-
      Se entrega la captura, los conteos por tecnica, la regla propuesta con su umbral y
      la prueba de que no dispara con trafico normal.
    estructura: |
      semana_04/
      |-- informe.md
      |-- escaner.py
      |-- evidencia/
      |   |-- captura.pcap
      |   |-- scan.txt
      |   |-- syn.txt
      |   `-- synack.txt
      `-- README.md
    comprobaciones:
    - La captura se limita a loopback y a los puertos autorizados.
    - Los conteos salen de la misma captura que se entrega.
    - La regla tiene umbral y accion.
    - Se probo que la regla no dispara con navegacion normal.
    avisos:
    - La captura puede contener credenciales de laboratorio: no se comparte fuera del grupo.
    - Capturar sin limite de tiempo llena el disco; siempre con timeout.
  - grupo: 3
    titulo: OSINT con limite y dato minimo
    intro: >-
      El rol Legal define que se puede recolectar y que no. La huella digital se limita a
      datos publicos del dominio propio o autorizado, y se descarta todo lo que
      identifique a personas.
    bloques:
    - titulo: Recolectar solo registros publicos del dominio autorizado
      texto: >-
        Se consultan los registros DNS y el RDAP del dominio. El objetivo es propio o
        esta autorizado por escrito; no se consulta el dominio de un tercero.
      comandos: |
        mkdir -p semana_04/evidencia
        for tipo in A AAAA MX NS TXT SOA; do
          echo "== $tipo"; dig +short $tipo example.com
        done | tee semana_04/evidencia/dns.txt
        curl -s https://rdap.org/domain/example.com \
          > semana_04/evidencia/rdap.json
    - titulo: Distinguir dato publico de dato personal
      texto: >-
        El correo del registrante, si aparece, es dato personal aunque sea publico. Se
        documenta su existencia sin transcribirlo y se marca como excluido del informe.
    - titulo: Aplicar minimizacion y plazo de conservacion
      texto: >-
        Se conserva solo lo necesario para el objetivo y por el tiempo declarado. Lo que
        no se usa se borra; no se acumula "por si acaso".
    - titulo: Anonimizar la evidencia antes de versionarla
      texto: >-
        Los dominios ajenos y cualquier identificador personal se sustituyen por
        marcadores. La evidencia cruda queda fuera del repositorio.
    tabla:
      titulo: Fuente, dato y limite aplicable
      nota: >-
        La base se cita por su denominacion; si el grupo no verifico la norma, escribe
        "pendiente" en vez de inventar el fundamento.
      columnas: [Fuente, Dato obtenido, Naturaleza, Limite, Decision]
      anchos: [2.4, 3.2, 2.2, 3.0, 3.0]
      filas:
      - [DNS, 'Registros A, MX y TXT', 'Publico tecnico', 'Solo dominio autorizado', 'Se conserva']
      - [RDAP, 'Fechas y estado del dominio', 'Publico tecnico', 'No se transcribe el contacto', 'Se resume']
      - [Buscadores, 'Subdominios indexados', 'Publico', 'Sin tecnicas de presion ni enganno', 'Se cita la fuente']
      - [Correo del registrante, 'Contacto administrativo', 'Dato personal', 'No se transcribe ni se contacta', 'Se excluye']
    entregable: >-
      Se entrega la huella digital con fuentes citadas, una tabla de que se recolecto y
      que se descarto, y la evidencia anonimizada.
    estructura: |
      semana_04/
      |-- informe.md
      |-- escaner.py
      |-- evidencia/
      |   |-- dns.txt
      |   `-- rdap.json
      `-- README.md
    comprobaciones:
    - El dominio consultado es propio o esta autorizado por escrito.
    - No se transcribe ningun dato de contacto personal.
    - La tabla indica que se descarto y por que.
    - La evidencia versionada esta anonimizada.
    avisos:
    - La recoleccion sobre dominios de terceros queda fuera del curso aunque la tecnica sea la misma.
    - Un dato publico no deja de ser personal por estar publicado.
  - grupo: 4
    titulo: Escaner propio frente a nmap
    intro: >-
      El rol Rojo construye el escaner, lo ejecuta contra el laboratorio y lo compara con
      nmap. La comparacion tiene que explicar las diferencias, no solo listarlas.
    bloques:
    - titulo: Implementar sondeo TCP connect con tiempo de espera configurable
      texto: >-
        El script recibe host, puertos y timeout, y devuelve JSON normalizado. Un puerto
        cerrado y un timeout son resultados distintos y se reportan por separado.
      comandos: |
        mkdir -p semana_04/evidencia
        cat > semana_04/escaner.py <<'PY'
        import argparse, json, socket, time

        def connect(host, puerto, timeout):
            inicio = time.perf_counter()
            sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            sock.settimeout(timeout)
            try:
                sock.connect((host, puerto))
                estado = 'abierto'
            except socket.timeout:
                estado = 'timeout'
            except ConnectionRefusedError:
                estado = 'cerrado'
            finally:
                sock.close()
            return {'puerto': puerto, 'estado': estado,
                    'ms': round((time.perf_counter() - inicio) * 1000, 1)}

        ap = argparse.ArgumentParser()
        ap.add_argument('--host', default='127.0.0.1')
        ap.add_argument('--puertos', default='8081,3000,2222')
        ap.add_argument('--timeout', type=float, default=0.5)
        args = ap.parse_args()
        resultados = [connect(args.host, int(p), args.timeout)
                      for p in args.puertos.split(',')]
        print(json.dumps(resultados, indent=2))
        PY
        python3 semana_04/escaner.py > semana_04/evidencia/propio.json
    - titulo: Añadir sondeo UDP y documentar el SYN
      texto: >-
        UDP se prueba enviando un datagrama y esperando ICMP. El SYN semiabierto exige
        raw sockets y privilegios: si el entorno no lo permite, se documenta la
        limitacion y se compara con nmap -sS en lugar de simularlo.
      comandos: |
        python3 -c "
        import socket
        s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(0.5)
        s.sendto(b'ping',('127.0.0.1',3000))
        try: print('respuesta', s.recvfrom(64))
        except socket.timeout: print('sin respuesta en 500 ms')
        " | tee semana_04/evidencia/udp.txt
        sudo nmap -sS -p 8081,3000,2222 127.0.0.1 -oN semana_04/evidencia/syn_nmap.txt
    - titulo: Comparar y medir tiempos
      texto: >-
        Se ejecuta nmap sobre el mismo objetivo y se tabulan coincidencias, diferencias y
        tiempo por tecnica. Un falso positivo es un puerto que el script da por abierto y
        nmap no confirma.
    - titulo: Explicar los falsos positivos
      texto: >-
        Cada falso positivo tiene una causa concreta: timeout demasiado corto, servicio
        que acepta y cierra, o filtrado que responde distinto. La explicacion se escribe
        junto al resultado.
    tabla:
      titulo: Tecnica, resultado propio y contraste con nmap
      nota: >-
        Los tiempos son de esta maquina y esta sesion; se reportan para comparar tecnicas
        entre si, no como valor absoluto.
      columnas: [Tecnica, Propio, nmap, Tiempo propio, Falso positivo]
      anchos: [2.6, 1.8, 1.8, 2.2, 3.6]
      filas:
      - [TCP connect, 'Abierto 8081, 3000, 2222', 'Abierto en los tres', 'Menos de 1 s', 'Ninguno observado']
      - [TCP SYN, 'No implementado sin privilegios', 'Abierto en los tres', 'Menos de 1 s', 'Se documenta la limitacion']
      - [UDP, 'Sin respuesta en 500 ms', 'Abierto o filtrado', '500 ms por puerto', 'No se puede distinguir con un paquete']
      - [Timeout corto, 'Cerrado por timeout', 'Abierto', '50 ms', 'Si: el limite era menor que la latencia']
    entregable: >-
      Se entrega el script con type hints y docstrings, la salida JSON, la comparacion con
      nmap y la explicacion de cada diferencia.
    estructura: |
      semana_04/
      |-- informe.md
      |-- escaner.py
      |-- evidencia/
      |   |-- propio.json
      |   |-- syn_nmap.txt
      |   |-- udp.txt
      |   `-- comparativa.txt
      `-- README.md
    comprobaciones:
    - El script acepta host, puertos y timeout por linea de comandos.
    - Un puerto cerrado y un timeout se reportan como estados distintos.
    - La comparacion incluye tiempo por tecnica y explica las diferencias.
    - Las limitaciones de privilegios estan declaradas, no simuladas.
    avisos:
    - El escaneo se ejecuta solo contra 127.0.0.1 y los puertos del alcance.
    - Un falso positivo no se corrige bajando el timeout a ojo: se mide y se justifica.
  pasos_fix: true
- numero: 5
  fase: 2
  titulo: Vulnerabilidades web según OWASP Top 10
  objetivo: Explotar de forma controlada inyección SQL, XSS y LFI, y explicar la causa raíz y el control que lo evita.
  contenidos:
  - OWASP Top 10 2021 y categorías con mayor impacto.
  - Control de acceso roto y exposición de datos sensibles.
  - Inyección SQL, XSS reflejado y almacenado, LFI y RFI.
  - Configuración insegura y componentes desactualizados.
  - Evidencia reproducible, capturas y causa raíz en el código.
  herramientas:
  - DVWA
  - Juice Shop
  - Navegador con herramientas de desarrollo
  glosario:
  - OWASP Top 10
  - Control de acceso roto
  - Inyección SQL
  - XSS
  - LFI
  - Causa raíz
  practica:
    titulo: Explotación guiada y evidencia
    escenario: 'Cada grupo explota tres vulnerabilidades en DVWA y resuelve tres retos de Juice Shop, documentando payload, evidencia, causa raíz y mitigación.

      '
    pasos:
    - Ejecutar un XSS reflejado en DVWA y capturar la evidencia del reflejo.
    - Ejecutar una inyección SQL que devuelva datos no previstos y documentar el payload.
    - Explotar un LFI para leer un archivo del sistema del contenedor.
    - Resolver tres retos de Juice Shop y anotar la pista y el razonamiento.
    - Para cada caso, identificar la línea de código o configuración responsable y el control que lo evita.
    entregable: Informe técnico con payloads, evidencia anonimizada, causa raíz y mitigación por hallazgo.
    criterios:
    - criterio: Explotación reproducible de los tres tipos de vulnerabilidad
      peso: 3.0
    - criterio: Causa raíz correctamente identificada
      peso: 2.5
    - criterio: Mitigación concreta y verificable por hallazgo
      peso: 2.0
    - criterio: Evidencia clara y anonimizada
      peso: 1.5
    - criterio: Retos de Juice Shop justificados
      peso: 1.0
  evaluacion: control_fase_2
  ejemplos:
  - grupo: 1
    titulo: Reproducir, mitigar y verificar con el mismo payload
    intro: >-
      El rol Azul reproduce la falla y despues aplica el control que la corta, sin
      cambiar el payload. Si el resultado cambia porque se cambio la peticion, no se
      demostro nada.
    bloques:
    - titulo: Iniciar sesion y fijar el nivel de DVWA
      texto: >-
        Todo se ejecuta con la sesion del laboratorio y el nivel bajo, que es el que se
        quiere demostrar vulnerable. El token CSRF se extrae de la pagina, no se supone.
      comandos: |
        mkdir -p semana_05/evidencia
        curl -s -c semana_05/evidencia/cookies.txt \
          http://127.0.0.1:8081/login.php > semana_05/evidencia/login.html
        TOKEN=$(grep -o "name='user_token' value='[^']*'" \
          semana_05/evidencia/login.html | head -1 | cut -d"'" -f4)
        curl -s -b semana_05/evidencia/cookies.txt -c semana_05/evidencia/cookies.txt \
          -d "username=admin&password=password&Login=Login&user_token=$TOKEN" \
          http://127.0.0.1:8081/login.php -o /dev/null
        curl -s -b semana_05/evidencia/cookies.txt \
          -d "security=low&seclev_submit=Submit" \
          http://127.0.0.1:8081/security.php -o /dev/null
    - titulo: Capturar la evidencia de los tres hallazgos
      texto: >-
        Cada peticion se guarda con su respuesta completa. El reflejo del XSS, la fila
        extra de la inyeccion y el contenido del archivo leido son la prueba, y se
        guardan tal cual.
      comandos: |
        curl -s -b semana_05/evidencia/cookies.txt \
          'http://127.0.0.1:8081/vulnerabilities/xss_r/?name=%3Cscript%3Ealert(1)%3C/script%3E' \
          > semana_05/evidencia/xss_antes.html
        curl -s -b semana_05/evidencia/cookies.txt \
          'http://127.0.0.1:8081/vulnerabilities/sqli/?id=1%27+OR+%271%27%3D%271&Submit=Submit' \
          > semana_05/evidencia/sqli_antes.html
        curl -s -b semana_05/evidencia/cookies.txt \
          'http://127.0.0.1:8081/vulnerabilities/fi/?page=../../../../etc/passwd' \
          > semana_05/evidencia/lfi_antes.txt
        sha256sum semana_05/evidencia/*_antes.* > semana_05/evidencia/antes.sha256
    - titulo: Aplicar el control que elimina la causa
      texto: >-
        El control se aplica donde esta la causa: parametrizacion y codificacion en la
        aplicacion, o nivel alto de DVWA cuando el codigo no se puede editar. Se elige
        uno y se documenta el motivo.
      comandos: |
        curl -s -b semana_05/evidencia/cookies.txt \
          -d "security=high&seclev_submit=Submit" \
          http://127.0.0.1:8081/security.php -o /dev/null
        printf 'nivel alto aplicado; se documenta que el control es de la aplicacion\n' \
          > semana_05/evidencia/control.txt
    - titulo: Repetir exactamente el mismo payload
      texto: >-
        Las mismas URL, el mismo orden y la misma sesion. El resultado esperado es que el
        reflejo se codifique, la inyeccion no devuelva filas extra y el archivo no se
        lea.
      comandos: |
        curl -s -b semana_05/evidencia/cookies.txt \
          'http://127.0.0.1:8081/vulnerabilities/xss_r/?name=%3Cscript%3Ealert(1)%3C/script%3E' \
          > semana_05/evidencia/xss_despues.html
        grep -c '&lt;script&gt;' semana_05/evidencia/xss_despues.html
        curl -s -b semana_05/evidencia/cookies.txt \
          'http://127.0.0.1:8081/vulnerabilities/fi/?page=../../../../etc/passwd' \
          | wc -c > semana_05/evidencia/lfi_despues.txt
    tabla:
      titulo: Hallazgo, control y verificacion con el mismo payload
      nota: >-
        "Neutralizado" solo se escribe si la repeticion del payload lo demuestra; si el
        control no se pudo aplicar, se escribe "no aplicado" con el motivo.
      columnas: [Hallazgo, Control aplicado, Resultado antes, Resultado despues, Verificacion]
      anchos: [2.2, 3.4, 2.8, 2.8, 2.8]
      filas:
      - [XSS reflejado, 'Codificacion de salida y nivel alto', 'Script reflejado sin codificar', 'Texto codificado', 'xss_despues.html']
      - [Inyeccion SQL, 'Consulta parametrizada', 'Filas no previstas', 'Sin filas extra', 'sqli_despues.html']
      - [LFI, 'Lista blanca de archivos', 'Contenido de /etc/passwd', 'Error controlado', 'lfi_despues.txt']
    entregable: >-
      El informe muestra, por hallazgo, la peticion, la respuesta antes, el control
      aplicado y la respuesta despues con el mismo payload, mas el hash de la evidencia.
    estructura: |
      semana_05/
      |-- informe.md
      |-- evidencia/
      |   |-- cookies.txt
      |   |-- xss_antes.html
      |   |-- xss_despues.html
      |   |-- sqli_antes.html
      |   |-- sqli_despues.html
      |   |-- lfi_antes.txt
      |   |-- lfi_despues.txt
      |   `-- antes.sha256
      `-- README.md
    comprobaciones:
    - El payload de antes y el de despues son identicos byte a byte.
    - El control se aplico en la causa, no en el enunciado del informe.
    - La sesion y el nivel de seguridad estan documentados.
    - La evidencia esta anonimizada antes de versionarse.
    avisos:
    - Las cookies de sesion son credenciales: no se suben al repositorio.
    - Subir el nivel de DVWA es un control de laboratorio; no sustituye corregir el codigo.
  - grupo: 2
    titulo: Detectar la explotacion en el registro
    intro: >-
      El rol Púrpura busca la huella de los tres ataques en los registros del servicio.
      La deteccion se disena antes de explotar y se comprueba despues con la evidencia.
    bloques:
    - titulo: Capturar la linea base del registro sin ataques
      texto: >-
        Primero se registra el trafico normal durante un minuto. Sin linea base no se
        puede afirmar que un patron es anomalo.
      comandos: |
        mkdir -p semana_05/evidencia
        docker logs --since 1m objetivo-web \
          > semana_05/evidencia/base_web.txt 2>&1 || true
        wc -l semana_05/evidencia/base_web.txt
    - titulo: Ejecutar los ataques y volver a leer el registro
      texto: >-
        Se repiten las peticiones del grupo Rojo y se extraen del registro solo las lineas
        con los patrones buscados. Cada patron tiene su expresion regular documentada.
      comandos: |
        docker logs --since 10m objetivo-web \
          > semana_05/evidencia/ataque_web.txt 2>&1 || true
        grep -Ei 'union|select|or%20|%27' semana_05/evidencia/ataque_web.txt \
          | tee semana_05/evidencia/sqli_lineas.txt || true
        grep -Ei '<script|%3Cscript' semana_05/evidencia/ataque_web.txt \
          | tee semana_05/evidencia/xss_lineas.txt || true
        grep -Ei 'etc/passwd|\.\./' semana_05/evidencia/ataque_web.txt \
          | tee semana_05/evidencia/lfi_lineas.txt || true
    - titulo: Escribir la regla de deteccion con umbral
      texto: >-
        La regla combina patron y frecuencia. Un `SELECT` suelto no es un ataque; diez
        en un minuto desde la misma origen si es una señal que merece revision.
    - titulo: Probar la regla con trafico limpio
      texto: >-
        Se navega la aplicacion sin atacar y se comprueba que la regla no dispara. Si
        dispara, el patron es demasiado amplio y se corrige.
    tabla:
      titulo: Ataque, patron y regla propuesta
      nota: >-
        La columna de falsos positivos se llena con lo observado al probar la regla, no
        con una estimacion.
      columnas: [Ataque, Patron, Fuente, Regla propuesta, Falsos positivos]
      anchos: [2.0, 3.2, 2.2, 3.6, 2.6]
      filas:
      - [XSS reflejado, 'Script en parametro de la URL', 'Registro de Apache', 'Script codificado o literal en query', 'Ninguno en la prueba']
      - [Inyeccion SQL, 'Union o comillas en id', 'Registro de Apache', 'Mas de 5 consultas anomalas en 1 min', 'Formularios con comillas legitimas']
      - [LFI, 'Secuencias de directorio', 'Registro de Apache', 'Ruta con ../ fuera de la raiz', 'Ninguno en la prueba']
      - [Navegacion normal, 'Solo rutas conocidas', 'Registro de Apache', 'Sin alerta', 'No aplica']
    entregable: >-
      Se entrega la linea base, los extractos del registro por ataque, la regla con su
      umbral y la prueba de no disparo con trafico limpio.
    estructura: |
      semana_05/
      |-- informe.md
      |-- evidencia/
      |   |-- base_web.txt
      |   |-- ataque_web.txt
      |   |-- sqli_lineas.txt
      |   |-- xss_lineas.txt
      |   `-- lfi_lineas.txt
      `-- README.md
    comprobaciones:
    - Existe una linea base anterior a los ataques.
    - Cada regla cita su patron y su umbral.
    - La prueba con trafico limpio esta registrada.
    - Los extractos no incluyen cookies completas.
    avisos:
    - El registro puede contener datos de sesion: se recorta antes de versionarlo.
    - Una regla que dispara con todo no es deteccion, es ruido.
  - grupo: 3
    titulo: Evidencia explotada sin daño y sin datos de terceros
    intro: >-
      El rol Legal revisa como se documenta la explotacion: que se extrajo, cuanto se
      conserva y como se evita que la evidencia se convierta en una fuga.
    bloques:
    - titulo: Declarar que datos se obtuvieron y con que limite
      texto: >-
        De la inyeccion se documenta el esquema y el numero de filas, no el contenido
        personal. Del LFI se guarda la linea que prueba la lectura, no el archivo
        completo.
    - titulo: Recortar y anonimizar la evidencia
      texto: >-
        Los nombres, correos y cualquier identificador se sustituyen por marcadores. El
        recorte se hace antes de guardar la copia que se versiona.
      comandos: |
        mkdir -p semana_05/evidencia
        sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[correo]/g' \
          semana_05/evidencia/extraccion.txt \
          > semana_05/evidencia/extraccion_anonima.txt 2>/dev/null || true
        sha256sum semana_05/evidencia/extraccion_anonima.txt \
          > semana_05/evidencia/extraccion.sha256
    - titulo: Justificar la retencion y el borrado
      texto: >-
        La evidencia se conserva hasta el cierre de la evaluacion y despues se borra. El
        plazo se declara por escrito y se aplica igual para todos los grupos.
    - titulo: Revisar el informe contra el codigo de etica
      texto: >-
        Se comprueba que no hay capturas con datos reales, que no se publico ningun
        payload fuera del repositorio del grupo y que el alcance de la semana 3 cubre lo
        ejecutado.
    tabla:
      titulo: Dato, tratamiento y fundamento
      nota: >-
        La columna de fundamento cita la autorizacion de la semana 3 y la norma
        verificada; si falta, el dato no se conserva.
      columnas: [Dato obtenido, Tratamiento, Se conserva, Plazo, Fundamento]
      anchos: [3.0, 3.2, 1.6, 2.0, 3.6]
      filas:
      - [Esquema de la base, 'Se documenta estructura', 'Si', 'Hasta cerrar', 'Autorizacion del alcance']
      - [Filas de usuarios, 'Solo conteo, sin contenido', 'Si', 'Hasta cerrar', 'Minimizacion']
      - [Contenido de /etc/passwd, 'Solo la linea que prueba acceso', 'Si', 'Hasta cerrar', 'Prueba del hallazgo']
      - [Datos personales reales, 'No se transcriben', 'No', 'Borrado inmediato', 'Proteccion de datos']
    entregable: >-
      Se entrega la evidencia anonimizada con su hash, la declaracion de retencion y la
      revision del informe contra el codigo de etica.
    estructura: |
      semana_05/
      |-- informe.md
      |-- evidencia/
      |   |-- extraccion_anonima.txt
      |   `-- extraccion.sha256
      `-- README.md
    comprobaciones:
    - Ninguna captura contiene datos personales sin anonimizar.
    - El plazo de retencion esta declarado y se cumple.
    - Lo ejecutado esta cubierto por la autorizacion de la semana 3.
    - El hash corresponde al archivo anonimizado, no al original.
    avisos:
    - Copiar datos reales "para demostrar el hallazgo" es una fuga, no una prueba.
    - La anonimizacion se verifica abriendo el archivo final, no confiando en el comando.
  - grupo: 4
    titulo: Tres ataques, payload y causa raiz
    intro: >-
      El rol Rojo explota los tres casos y documenta el payload exacto, la respuesta y la
      linea de codigo o configuracion que lo permite. Un hallazgo sin causa raiz es una
      anecdota.
    bloques:
    - titulo: XSS reflejado con evidencia del reflejo
      texto: >-
        El payload se envia en el parametro y se guarda la respuesta donde aparece sin
        codificar. La captura del reflejo es la prueba; el aviso del navegador es
        secundario.
      comandos: |
        mkdir -p semana_05/evidencia
        curl -s -b semana_05/evidencia/cookies.txt \
          'http://127.0.0.1:8081/vulnerabilities/xss_r/?name=%3Cscript%3Ealert(1)%3C/script%3E' \
          > semana_05/evidencia/xss_reflejo.html
        grep -n '<script>alert(1)</script>' semana_05/evidencia/xss_reflejo.html
    - titulo: Inyeccion SQL que devuelve filas no previstas
      texto: >-
        El payload transforma la consulta y devuelve mas filas de las que el formulario
        pedia. Se documenta el numero de filas y el campo que lo delata.
      comandos: |
        curl -s -b semana_05/evidencia/cookies.txt \
          'http://127.0.0.1:8081/vulnerabilities/sqli/?id=1%27+OR+%271%27%3D%271&Submit=Submit' \
          > semana_05/evidencia/sqli_filas.html
        grep -c 'First name' semana_05/evidencia/sqli_filas.html
    - titulo: LFI para leer un archivo del contenedor
      texto: >-
        Se lee un archivo inocuo del sistema y se guarda solo la prueba de acceso. No se
        recorre el sistema buscando secretos: el objetivo es demostrar la ruta, no
        exprimirla.
      comandos: |
        curl -s -b semana_05/evidencia/cookies.txt \
          'http://127.0.0.1:8081/vulnerabilities/fi/?page=../../../../etc/passwd' \
          | head -5 > semana_05/evidencia/lfi_prueba.txt
        wc -l semana_05/evidencia/lfi_prueba.txt
    - titulo: Resolver tres retos de Juice Shop y anotar el razonamiento
      texto: >-
        De cada reto se anota la pista, la peticion y por que funciono. El reto resuelto
        sin explicacion no cuenta como evidencia.
    tabla:
      titulo: Hallazgo, payload y causa raiz
      nota: >-
        La causa raiz se escribe como linea o configuracion concreta; "falta validacion"
        sin señalar donde no se acepta.
      columnas: [Hallazgo, Payload, Evidencia, Causa raiz, Mitigacion]
      anchos: [1.9, 3.4, 2.6, 3.2, 3.4]
      filas:
      - [XSS reflejado, 'Script en el parametro name', 'xss_reflejo.html', 'Salida sin codificar en la busqueda', 'Escape contextual']
      - [Inyeccion SQL, 'Comilla y OR tautologico en id', 'sqli_filas.html', 'Consulta concatenada', 'Parametrizacion']
      - [LFI, 'Secuencia de directorios en page', 'lfi_prueba.txt', 'Ruta resuelta sin lista blanca', 'Lista blanca y ruta fija']
      - [Juice Shop, 'Peticiones del reto', 'Anotaciones por reto', 'Validacion solo en el cliente', 'Validacion en servidor']
    entregable: >-
      El informe presenta por hallazgo el payload, la evidencia, la causa raiz y la
      mitigacion, ademas de los tres retos de Juice Shop con su razonamiento.
    estructura: |
      semana_05/
      |-- informe.md
      |-- evidencia/
      |   |-- xss_reflejo.html
      |   |-- sqli_filas.html
      |   `-- lfi_prueba.txt
      `-- README.md
    comprobaciones:
    - Cada payload esta escrito de forma literal y reproducible.
    - La causa raiz señala el punto concreto, no una categoria.
    - La mitigacion se puede verificar con una prueba.
    - Los retos de Juice Shop tienen pista y razonamiento.
    avisos:
    - La explotacion se limita a los contenedores del laboratorio y a los datos de prueba.
    - No se usa fuerza bruta ni denegacion de servicio contra el laboratorio.
- numero: 6
  fase: 3
  titulo: Hardening, firewall y detección
  objetivo: '> Aplicar endurecimiento de sistemas, configurar filtrado por defecto y comprobar la detección con Suricata.'
  contenidos:
  - Mínimo privilegio, usuarios del sistema y política de sudo.
  - Permisos SUID, SGID y archivos con escritura global.
  - SSH con claves, desactivación de contraseña y fail2ban.
  - Parcheo, servicios innecesarios y CIS Benchmarks.
  - Endurecimiento de systemd y perfiles de AppArmor.
  - Línea base medible y verificación posterior.
  - Política por defecto, nftables/ufw y segmentación.
  - IDS/IPS con Suricata, firmas y lectura de alertas.
  - TLS en tránsito y verificación de certificados.
  - Comprobar que la detección ve el ataque frenado por la política.
  herramientas:
  - systemd-analyze security
  - fail2ban
  - openssh
  - Suricata
  - ubuntu 24.04
  - nftables
  - ufw
  glosario:
  - Mínimo privilegio
  - SUID
  - CIS Benchmarks
  - AppArmor
  - Línea base
  - nftables
  - IDS/IPS
  - Suricata
  practica:
    titulo: Línea base, hardening, firewall y detección
    requiere_codigo: true
    escenario: '> Cada grupo endurece el contenedor, aplica política de filtrado, repite el escaneo y analiza las alertas de Suricata.'
    pasos:
    - Documentar el estado inicial de doce controles antes de cambiar nada.
    - Aplicar los cambios de endurecimiento y reiniciar los servicios afectados.
    - Aplicar la política de filtrado en deny por defecto y permitir solo lo necesario.
    - Repetir el escaneo, verificar qué puertos dejaron de responder y clasificar las alertas de Suricata.
    - Justificar las excepciones de hardening y proponer una regla de detección específica.
    entregable: Auditor propio, hardening antes/después, reglas de firewall, comparativa de alcance y alertas de Suricata clasificadas.
    criterios:
    - criterio: Doce controles documentados y verificables
      peso: 2.0
    - criterio: Auditor funcional con veredicto por control
      peso: 2.0
    - criterio: Política de filtrado correcta y sistema operativo
      peso: 2.5
    - criterio: Alertas de Suricata clasificadas y regla propuesta
      peso: 2.5
    - criterio: Antes/después comparables y justificación de excepciones
      peso: 1.0
  evaluacion: formativa
  ejemplos:
  - grupo: 1
    titulo: Instrumentar la linea base y clasificar alertas
    intro: >-
      El rol Púrpura mide antes y despues con el mismo auditor, y convierte las alertas
      de Suricata en una tabla con decision. Una alerta sin clasificar no es deteccion.
    bloques:
    - titulo: Capturar doce controles antes de cambiar nada
      texto: >-
        El auditor recorre los doce controles y emite un veredicto por cada uno. Se
        ejecuta antes del hardening para que la comparacion tenga sentido.
      comandos: |
        mkdir -p semana_06/evidencia
        cat > semana_06/auditor.sh <<'SH'
        #!/bin/sh
        echo "usuario_root_ssh: $(sshd -T 2>/dev/null | awk '/^permitrootlogin/{print $2}')"
        echo "password_auth: $(sshd -T 2>/dev/null | awk '/^passwordauthentication/{print $2}')"
        echo "suid_total: $(find / -perm -4000 -type f 2>/dev/null | wc -l)"
        echo "world_writable: $(find / -xdev -type f -perm -0002 2>/dev/null | wc -l)"
        echo "puertos_escucha: $(ss -tulpn 2>/dev/null | grep -c LISTEN)"
        echo "ufw: $(ufw status 2>/dev/null | head -1)"
        SH
        chmod +x semana_06/auditor.sh
        sudo semana_06/auditor.sh | tee semana_06/evidencia/antes.txt
    - titulo: Ejecutar el hardening y repetir el auditor
      texto: >-
        Los cambios se aplican con comandos reproducibles y se recargan los servicios. El
        auditor se repite sin modificarlo: la unica variable es el sistema.
      comandos: |
        sudo sed -i -E 's/^#?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
        sudo sed -i -E 's/^#?PasswordAuthentication.*/PasswordAuthentication no/' \
          /etc/ssh/sshd_config
        sudo sshd -t && sudo systemctl reload ssh 2>/dev/null || sudo kill -HUP 1
        sudo ufw default deny incoming
        sudo ufw allow 2222/tcp
        sudo ufw --force enable
        sudo semana_06/auditor.sh | tee semana_06/evidencia/despues.txt
    - titulo: Leer y clasificar las alertas de Suricata
      texto: >-
        Se extraen las alertas de la ventana de pruebas y se clasifican en verdaderas,
        esperadas y ruido. Cada clasificacion tiene un motivo escrito.
      comandos: |
        sudo suricata -T -c /etc/suricata/suricata.yaml 2>&1 | tail -3 \
          | tee semana_06/evidencia/suricata_check.txt
        sudo python3 - <<'PY' | tee semana_06/evidencia/alertas.txt
        import json
        rutas = ['/var/log/suricata/eve.json']
        for ruta in rutas:
            try:
                for linea in open(ruta, errors='ignore'):
                    evento = json.loads(linea)
                    if evento.get('event_type') == 'alert':
                        print(evento['timestamp'], evento['alert']['signature'])
            except FileNotFoundError:
                print('sin eve.json: se documenta como no verificado')
        PY
    - titulo: Proponer una regla concreta
      texto: >-
        La regla cubre el ataque que la politica freno: repetir el escaneo y detectar el
        intento contra el puerto cerrado. Se escribe para el motor que ya esta en uso.
    tabla:
      titulo: Control, umbral y accion
      nota: >-
        El estado inicial se copia de antes.txt; si un control no se pudo medir, se marca
        como no verificado y se explica por que.
      columnas: [Control, Verificacion, Estado inicial, Umbral, Accion]
      anchos: [2.6, 3.2, 2.4, 2.4, 2.6]
      filas:
      - [Acceso de root por SSH, 'sshd -T', 'Permitido', 'Prohibido', 'Corregir']
      - [Autenticacion por contrasena, 'sshd -T', 'Habilitada', 'Deshabilitada', 'Corregir']
      - [Archivos SUID, 'find -perm -4000', 'Conteo base', 'Sin cambios no justificados', 'Revisar']
      - [Puertos en escucha, 'ss -tulpn', 'Conteo base', 'Solo los necesarios', 'Cerrar']
      - [Politica de filtrado, 'ufw status', 'Inactiva', 'Deny por defecto', 'Activar']
    entregable: >-
      Se entrega el auditor, las salidas antes y despues, la tabla de alertas clasificadas
      y la regla propuesta con su justificacion.
    estructura: |
      semana_06/
      |-- informe.md
      |-- auditor.sh
      |-- evidencia/
      |   |-- antes.txt
      |   |-- despues.txt
      |   |-- suricata_check.txt
      |   `-- alertas.txt
      `-- README.md
    comprobaciones:
    - El auditor es el mismo archivo antes y despues.
    - Cada alerta tiene clasificacion y motivo.
    - La regla propuesta se refiere a un ataque concreto observado.
    - Las limitaciones de Suricata en el contenedor estan declaradas.
    avisos:
    - Recargar SSH puede cortar la sesion: se usa una sesion de consola separada.
    - Si Suricata no arranca en el contenedor, se documenta y se evalua con las firmas disponibles.
  - grupo: 2
    titulo: Excepciones justificadas y control del cambio
    intro: >-
      El rol Legal decide que excepcion de hardening se acepta y cual no. Una excepcion
      sin riesgo declarado, responsable y fecha de revision es una puerta abierta.
    bloques:
    - titulo: Registrar el cambio con su motivo
      texto: >-
        Cada cambio de configuracion entra en un registro con fecha, autor, motivo y
        vuelta atras. El registro es el que permite reconstruir el estado si algo falla.
      comandos: |
        mkdir -p semana_06/evidencia
        printf '%s | sshd | PermitRootLogin no | Grupo 4 | vuelta: copia previa\n' \
          "$(date -u +%FT%TZ)" > semana_06/evidencia/cambios.txt
        cp /etc/ssh/sshd_config semana_06/evidencia/sshd_config.bak 2>/dev/null || true
        sha256sum semana_06/evidencia/sshd_config.bak \
          > semana_06/evidencia/sshd_config.bak.sha256 2>/dev/null || true
    - titulo: Clasificar cada excepcion por riesgo
      texto: >-
        Se acepta una excepcion solo si el riesgo es bajo, el responsable esta nombrado y
        hay fecha de revision. Las de riesgo alto no se aceptan: se corrigen.
    - titulo: Comprobar que la excepcion no reabre el hallazgo
      texto: >-
        Una excepcion se verifica igual que un control: con el mismo comando. Si la
        excepcion permite el acceso que se queria cerrar, no era una excepcion.
      comandos: |
        sudo sshd -T | grep -E '^(permitrootlogin|passwordauthentication)' \
          | tee semana_06/evidencia/excepcion_ssh.txt
    - titulo: Definir la fecha de revision
      texto: >-
        Toda excepcion caduca. La fecha se escribe en el registro y se revisa aunque nadie
        la recuerde.
    tabla:
      titulo: Excepcion, riesgo y decision
      nota: >-
        La decision se escribe como aceptada, rechazada o pendiente. "Se vera" no es una
        decision.
      columnas: [Excepcion, Riesgo, Responsable, Revision, Decision]
      anchos: [3.2, 2.0, 2.4, 2.2, 3.4]
      filas:
      - [PasswordAuthentication si en laboratorio, 'Medio', 'Grupo 4', 'Fin de semana 6', 'Rechazada']
      - [Puerto 22 abierto en lugar de 2222, 'Bajo', 'Grupo 4', 'Fin de curso', 'Aceptada con registro']
      - [Servicio de base de datos en escucha, 'Alto', 'Grupo 4', 'Inmediato', 'Rechazada']
      - [Sin fail2ban en contenedor, 'Bajo', 'Grupo 4', 'Fin de semana 7', 'Aceptada temporal']
    entregable: >-
      Se entrega el registro de cambios, la tabla de excepciones con su decision y la
      verificacion de que ninguna excepcion reabre el hallazgo.
    estructura: |
      semana_06/
      |-- informe.md
      |-- auditor.sh
      |-- evidencia/
      |   |-- cambios.txt
      |   |-- excepcion_ssh.txt
      |   `-- sshd_config.bak.sha256
      `-- README.md
    comprobaciones:
    - Cada cambio tiene autor, fecha y vuelta atras.
    - Cada excepcion tiene responsable y fecha de revision.
    - Las excepciones de riesgo alto estan rechazadas.
    - La excepcion aceptada se verifico con el mismo comando del auditor.
    avisos:
    - Aceptar una excepcion no es ignorar el control: queda registrada y con caducidad.
    - Si no hay copia previa del archivo modificado, el cambio no se aplica.
  - grupo: 3
    titulo: Verificar el cierre del alcance desde fuera
    intro: >-
      El rol Rojo repite el escaneo despues del hardening y comprueba que lo que debia
      cerrarse se cerro. Tambien busca el camino que la politica dejo abierto sin
      querer.
    bloques:
    - titulo: Escanear el alcance antes y despues
      texto: >-
        El mismo comando, la misma tasa y el mismo objetivo. La comparacion es puerto por
        puerto, no una impresion general.
      comandos: |
        mkdir -p semana_06/evidencia
        nmap -sT -p 22,2222,8081,3000 --max-rate 20 127.0.0.1 \
          -oN semana_06/evidencia/antes.txt
        nmap -sT -p 22,2222,8081,3000 --max-rate 20 127.0.0.1 \
          -oN semana_06/evidencia/despues.txt
        diff -u semana_06/evidencia/antes.txt semana_06/evidencia/despues.txt \
          | tee semana_06/evidencia/diff.txt
    - titulo: Probar si el puerto cerrado responde de otra forma
      texto: >-
        Un puerto filtrado no es lo mismo que uno cerrado: se distingue con la salida de
        nmap y con una conexion directa cronometrada.
      comandos: |
        python3 - <<'PY' | tee semana_06/evidencia/cierre.txt
        import socket, time
        for puerto in (22, 2222):
            s = socket.socket(); s.settimeout(1.0)
            t = time.perf_counter()
            try:
                s.connect(('127.0.0.1', puerto)); estado = 'abierto'
            except socket.timeout:
                estado = 'filtrado'
            except ConnectionRefusedError:
                estado = 'cerrado'
            finally:
                s.close()
            print(puerto, estado, round(time.perf_counter() - t, 3), 's')
        PY
    - titulo: Buscar el servicio que quedo expuesto
      texto: >-
        La politica por defecto deja pasar solo lo autorizado. Se revisa la lista de
        reglas y se comprueba que no haya un allow mas amplio de lo necesario.
      comandos: |
        sudo ufw status numbered | tee semana_06/evidencia/ufw_reglas.txt
    - titulo: Documentar el intento fallido
      texto: >-
        Un intento que no funciona tambien es resultado: demuestra que el control esta en
        el camino y no solo en el documento.
    tabla:
      titulo: Puerto, estado y conclusion
      nota: >-
        La conclusion se escribe como control efectivo, control parcial o sin cambio. El
        "sin cambio" se justifica.
      columnas: [Puerto, Antes, Despues, Intento posterior, Conclusion]
      anchos: [1.6, 2.0, 2.0, 3.6, 3.6]
      filas:
      - ['22', 'Abierto', 'Filtrado', 'Conexion directa', 'Control efectivo']
      - ['2222', 'Abierto', 'Abierto', 'Acceso con clave', 'Permitido por alcance']
      - ['8081', 'Abierto', 'Abierto', 'Peticion HTTP', 'Permitido por alcance']
      - ['3000', 'Abierto', 'Abierto', 'Peticion HTTP', 'Permitido por alcance']
    entregable: >-
      Se entrega el escaneo antes y despues, el diff, la prueba del cierre por puerto y la
      revision de las reglas de filtrado.
    estructura: |
      semana_06/
      |-- informe.md
      |-- auditor.sh
      |-- evidencia/
      |   |-- antes.txt
      |   |-- despues.txt
      |   |-- diff.txt
      |   |-- cierre.txt
      |   `-- ufw_reglas.txt
      `-- README.md
    comprobaciones:
    - El escaneo usa el mismo comando antes y despues.
    - Se distingue filtrado de cerrado con una prueba cronometrada.
    - Las reglas de filtrado se revisan, no solo se activan.
    - Cada "sin cambio" esta justificado por el alcance.
    avisos:
    - Cerrar un puerto que el grupo necesita rompe el laboratorio: se comprueba el alcance.
    - El escaneo se hace solo contra 127.0.0.1.
  - grupo: 4
    titulo: Auditor con veredicto y hardening reproducible
    intro: >-
      El rol Azul escribe el auditor que decide, aplica los cambios y demuestra con la
      misma herramienta que el estado cambio. El entregable es la comparacion, no la
      configuracion sola.
    bloques:
    - titulo: Escribir el auditor con veredicto por control
      texto: >-
        El auditor emite una linea por control con estado y veredicto. Un control no
        medible devuelve "no_verificado", no un aprobado por defecto.
      comandos: |
        mkdir -p semana_06/evidencia
        cat > semana_06/auditor.py <<'PY'
        import subprocess

        def sshd(clave):
            salida = subprocess.run(['sshd', '-T'], capture_output=True, text=True)
            for linea in salida.stdout.splitlines():
                if linea.startswith(clave):
                    return linea.split()[1]
            return 'no_verificado'

        controles = {
            'permitrootlogin': sshd('permitrootlogin'),
            'passwordauthentication': sshd('passwordauthentication'),
        }
        for nombre, valor in controles.items():
            if valor == 'no_verificado':
                veredicto = 'no_verificado'
            else:
                veredicto = 'ok' if valor == 'no' else 'fallo'
            print(nombre, valor, veredicto)
        PY
        python3 semana_06/auditor.py | tee semana_06/evidencia/veredictos_antes.txt
    - titulo: Aplicar el hardening por lotes con vuelta atras
      texto: >-
        Se copia la configuracion antes de tocarla y se recarga solo lo necesario. Si un
        servicio no vuelve a arrancar, se restaura la copia.
      comandos: |
        sudo cp /etc/ssh/sshd_config semana_06/evidencia/sshd_config.orig
        sudo sed -i -E 's/^#?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
        sudo sshd -t && sudo systemctl reload ssh 2>/dev/null || sudo kill -HUP 1
        sudo ufw default deny incoming
        sudo ufw allow 2222/tcp
        sudo ufw --force enable
        python3 semana_06/auditor.py | tee semana_06/evidencia/veredictos_despues.txt
    - titulo: Comparar y justificar excepciones
      texto: >-
        Se comparan los veredictos y se justifica cada control que sigue en fallo. La
        excepcion se documenta con su motivo y su fecha de revision.
    - titulo: Verificar que el sistema sigue operativo
      texto: >-
        Un hardening que deja el sistema inaccesible no es un hardening. Se comprueba el
        acceso permitido y el servicio que el grupo necesita.
      comandos: |
        ss -tulpn | tee semana_06/evidencia/puertos_final.txt
        curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8081/ \
          | tee semana_06/evidencia/http_final.txt
    tabla:
      titulo: Control, antes, cambio y verificacion
      nota: >-
        La columna de verificacion cita la salida del auditor que soporta el veredicto.
      columnas: [Control, Antes, Cambio, Despues, Verificacion]
      anchos: [2.8, 2.2, 3.4, 2.2, 3.4]
      filas:
      - [Root por SSH, 'Si', 'PermitRootLogin no', 'No', 'sshd -T']
      - [Contrasena SSH, 'Si', 'PasswordAuthentication no', 'No', 'sshd -T']
      - [Filtrado, 'Inactivo', 'Deny por defecto y allow 2222', 'Activo', 'ufw status']
      - [SUID, 'Conteo base', 'Sin cambios', 'Igual', 'find -perm -4000']
      - [Puertos, 'Conteo base', 'Solo los del alcance', 'Reducido', 'ss -tulpn']
    entregable: >-
      Se entrega el auditor con veredicto, los veredictos antes y despues, los comandos de
      hardening y la justificacion de cada excepcion.
    estructura: |
      semana_06/
      |-- informe.md
      |-- auditor.py
      |-- auditor.sh
      |-- evidencia/
      |   |-- veredictos_antes.txt
      |   |-- veredictos_despues.txt
      |   |-- puertos_final.txt
      |   `-- http_final.txt
      `-- README.md
    comprobaciones:
    - El auditor devuelve no_verificado cuando no puede medir.
    - Los veredictos de antes y despues salen del mismo script.
    - Cada excepcion tiene motivo y fecha de revision.
    - El sistema sigue operativo despues del hardening.
    avisos:
    - Un control no medible no se escribe como aprobado.
    - Recargar SSH en la sesion activa puede expulsar al estudiante: se usa consola local.
- numero: 7
  fase: 3
  titulo: Desarrollo seguro y cadena de suministro
  objetivo: Corregir vulnerabilidades en código y demostrar la mitigación repitiendo el mismo payload, con controles automatizados en la cadena de suministro.
  contenidos:
  - Validación de entrada y salida, parametrización de consultas.
  - Codificación de salida, CSP y cabeceras de seguridad.
  - Gestión de dependencias, SBOM y pip-audit.
  - Análisis estático con bandit y escaneo de secretos.
  - Revisión de código y criterios de aceptación de seguridad.
  herramientas:
  - bandit
  - pip-audit
  - DVWA editado
  glosario:
  - Validación de entrada
  - Parametrización de consultas
  - CSP
  - SBOM
  - Análisis estático
  - Cabeceras de seguridad
  practica:
    titulo: Parchear y demostrar la mitigación
    escenario: 'Cada grupo corrige tres vulnerabilidades de la semana 5 en su copia del laboratorio y demuestra que el payload original ya no funciona.

      '
    pasos:
    - Reproducir los tres hallazgos sobre la copia sin parchear y guardar la evidencia.
    - Aplicar la corrección con parametrización, codificación de salida y validación.
    - Repetir exactamente el mismo payload y documentar el nuevo resultado.
    - Ejecutar bandit, pip-audit y escaneo de secretos, y adjuntar la salida.
    - Escribir el criterio de aceptación de seguridad que impediría la regresión.
    entregable: Parches, evidencia antes y después con el mismo payload, y salida de los tres controles.
    criterios:
    - criterio: Correcciones que eliminan la causa raíz, no el síntoma
      peso: 3.0
    - criterio: Demostración antes y después con el mismo payload
      peso: 2.5
    - criterio: Controles automatizados ejecutados e interpretados
      peso: 2.0
    - criterio: Criterio de aceptación que previene la regresión
      peso: 1.5
    - criterio: Sin regresiones funcionales en la aplicación
      peso: 1.0
  evaluacion: control_fase_3
  ejemplos:
  - grupo: 1
    titulo: Controles automatizados con umbral y veredicto
    intro: >-
      El rol Púrpura convierte la revision en un control que falla solo. Cada herramienta
      tiene umbral, veredicto y una salida que se puede citar en el informe.
    bloques:
    - titulo: Ejecutar analisis estatico y fijar el umbral
      texto: >-
        El umbral se declara antes de mirar el resultado. Un hallazgo de severidad alta
        bloquea la entrega; los de severidad baja se registran y se deciden.
      comandos: |
        mkdir -p semana_07/evidencia
        bandit -r semana_07/codigo -f json -o semana_07/evidencia/bandit.json || true
        python3 - <<'PY' | tee semana_07/evidencia/bandit_resumen.txt
        import json
        datos = json.load(open('semana_07/evidencia/bandit.json'))
        for hallazgo in datos.get('results', []):
            print(hallazgo['severity'], hallazgo['test_id'], hallazgo['filename'])
        PY
    - titulo: Auditar dependencias y generar el inventario
      texto: >-
        El inventario de componentes permite saber que se usa y que version. Sin el, una
        vulnerabilidad publicada no se puede correlacionar con lo instalado.
      comandos: |
        pip-audit -r semana_07/requirements.txt \
          -f json -o semana_07/evidencia/pip_audit.json || true
        python3 - <<'PY' | tee semana_07/evidencia/sbom.txt
        import json
        datos = json.load(open('semana_07/evidencia/pip_audit.json'))
        for dep in datos.get('dependencies', []):
            print(dep['name'], dep['version'], len(dep.get('vulns', [])))
        PY
    - titulo: Buscar secretos antes de que lleguen al historial
      texto: >-
        El escaneo mira el arbol y el historial. Un secreto retirado del arbol sigue
        estando en el commit anterior.
      comandos: |
        git grep -nEi '(api[_-]?key|secret|token|password)[[:space:]]*=' \
          > semana_07/evidencia/secretos.txt || true
        git log --all -p -S 'BEGIN RSA PRIVATE KEY' --oneline \
          >> semana_07/evidencia/secretos.txt || true
    - titulo: Convertir el resultado en veredicto
      texto: >-
        El veredicto por herramienta es pasa, falla o no_verificado. Si una herramienta no
        se pudo ejecutar, el veredicto no es pasa.
    tabla:
      titulo: Control, umbral y veredicto
      nota: >-
        El veredicto se copia del resumen, no se interpreta de memoria. Un control no
        ejecutado se escribe como no verificado.
      columnas: [Control, Umbral, Hallazgos, Veredicto, Accion]
      anchos: [2.4, 2.6, 4.0, 2.2, 2.6]
      filas:
      - [Bandit, 'Severidad alta igual a cero', 'Conteo del resumen', 'Pasa o falla', 'Corregir antes de entregar']
      - [pip-audit, 'Cero vulnerabilidades conocidas', 'Conteo del SBOM', 'Pasa o falla', 'Actualizar dependencia']
      - [Secretos, 'Cero coincidencias', 'Conteo del escaneo', 'Pasa o falla', 'Rotar y retirar']
      - [Regresion funcional, 'Todo en verde', 'Resultado de las pruebas', 'Pasa o falla', 'Corregir el parche']
    entregable: >-
      Se entrega la salida cruda de los tres controles, el resumen con veredicto y la
      decision tomada por cada hallazgo.
    estructura: |
      semana_07/
      |-- informe.md
      |-- codigo/
      |-- requirements.txt
      |-- evidencia/
      |   |-- bandit.json
      |   |-- bandit_resumen.txt
      |   |-- pip_audit.json
      |   |-- sbom.txt
      |   `-- secretos.txt
      `-- README.md
    comprobaciones:
    - Los umbrales estan escritos antes de ejecutar los controles.
    - El veredicto de cada herramienta se apoya en su resumen.
    - Un control no ejecutado figura como no verificado.
    - El escaneo de secretos incluye el historial.
    avisos:
    - Un analisis estatico con cero hallazgos no demuestra que el codigo sea seguro.
    - Las dependencias actualizadas sin prueba de regresion no son una correccion.
  - grupo: 2
    titulo: Cadena de suministro, licencias y criterio de aceptacion
    intro: >-
      El rol Legal revisa lo que el equipo instala: licencia, origen y riesgo. Una
      dependencia sin licencia declarada es un problema legal aunque funcione.
    bloques:
    - titulo: Inventariar dependencias y licencias
      texto: >-
        Se listan las dependencias directas con su version y su licencia. Lo que no se
        puede verificar se marca como pendiente, no se asume permisivo.
      comandos: |
        mkdir -p semana_07/evidencia
        python3 -m pip list --format=json > semana_07/evidencia/instalado.json
        python3 - <<'PY' | tee semana_07/evidencia/licencias.txt
        import json
        for paquete in json.load(open('semana_07/evidencia/instalado.json'))[:40]:
            print(paquete['name'], paquete['version'], 'licencia: pendiente de verificar')
        PY
    - titulo: Decidir que se acepta en el repositorio
      texto: >-
        Se acepta una dependencia si tiene licencia compatible, origen conocido y version
        fijada. Las que no cumplen se sustituyen o se aisan.
    - titulo: Escribir el criterio de aceptacion de seguridad
      texto: >-
        El criterio es una condicion verificable: por ejemplo, ninguna consulta se
        construye por concatenacion y toda ruta de archivo pasa por lista blanca. Se
        escribe para que otra persona pueda comprobarlo sin preguntar.
    - titulo: Comprobar que el criterio se puede auditar
      texto: >-
        Cada criterio se asocia a un comando o a una prueba. Si no se puede comprobar de
        forma automatica, se documenta como revision manual con responsable.
    tabla:
      titulo: Dependencia, licencia y decision
      nota: >-
        La licencia se cita tal como aparece en el paquete; "open source" no es una
        licencia y no sirve como decision.
      columnas: [Dependencia, Version, Licencia, Riesgo, Decision]
      anchos: [3.0, 1.8, 3.0, 2.4, 3.6]
      filas:
      - [Flask, 'Version instalada', 'BSD-3-Clause', 'Bajo', 'Aceptada']
      - [Dependencia sin metadatos, 'Version instalada', 'Pendiente de verificar', 'Medio', 'No se acepta hasta verificar']
      - [Paquete sin mantenimiento, 'Version instalada', 'MIT', 'Medio', 'Se aisla y se vigila']
      - [Herramienta de analisis, 'Version instalada', 'Apache-2.0', 'Bajo', 'Aceptada']
    entregable: >-
      Se entrega el inventario con licencias, la decision por dependencia y el criterio de
      aceptacion con su forma de verificacion.
    estructura: |
      semana_07/
      |-- informe.md
      |-- codigo/
      |-- requirements.txt
      |-- evidencia/
      |   |-- instalado.json
      |   `-- licencias.txt
      `-- README.md
    comprobaciones:
    - Cada dependencia directa tiene licencia o queda como pendiente.
    - Las decisiones distinguen aceptada, aislada y rechazada.
    - El criterio de aceptacion es comprobable por un tercero.
    - Las versiones estan fijadas en requirements.
    avisos:
    - Una licencia "pendiente" no se puede presentar como aceptada.
    - Fijar la version sin revisar vulnerabilidades no resuelve el riesgo de suministro.
  - grupo: 3
    titulo: Repetir el ataque y demostrar que ya no funciona
    intro: >-
      El rol Rojo conserva los payloads de la semana 5 y los repite contra la copia
      parcheada. La prueba es el mismo ataque, no uno parecido.
    bloques:
    - titulo: Guardar la evidencia del antes en la copia sin parchear
      texto: >-
        Se reproduce cada hallazgo y se guardan peticion y respuesta. Esta evidencia es la
        referencia contra la que se compara el despues.
      comandos: |
        mkdir -p semana_07/evidencia
        curl -s -b semana_07/evidencia/cookies.txt \
          'http://127.0.0.1:8081/vulnerabilities/sqli/?id=1%27+OR+%271%27%3D%271&Submit=Submit' \
          > semana_07/evidencia/sqli_antes.html
        grep -c 'First name' semana_07/evidencia/sqli_antes.html \
          > semana_07/evidencia/sqli_antes_conteo.txt
    - titulo: Reaplicar el mismo payload sobre el codigo parcheado
      texto: >-
        Se cambia solo el destino: mismo parametro, mismo orden, misma sesion. Si el
        resultado ya no devuelve filas extra, la mitigacion se sostiene.
      comandos: |
        curl -s -b semana_07/evidencia/cookies.txt \
          'http://127.0.0.1:8081/vulnerabilities/sqli/?id=1%27+OR+%271%27%3D%271&Submit=Submit' \
          > semana_07/evidencia/sqli_despues.html
        grep -c 'First name' semana_07/evidencia/sqli_despues.html \
          > semana_07/evidencia/sqli_despues_conteo.txt
        diff semana_07/evidencia/sqli_antes_conteo.txt \
          semana_07/evidencia/sqli_despues_conteo.txt || true
    - titulo: Probar una variante del mismo ataque
      texto: >-
        Cambiar mayusculas, comentarios o codificacion es parte del mismo ataque. Si la
        variante funciona, el parche cubrio el ejemplo y no la causa.
    - titulo: Documentar la regresion funcional
      texto: >-
        Ademas de que el ataque falle, la funcionalidad legitima debe seguir funcionando.
        Se prueban los casos normales del formulario.
    tabla:
      titulo: Hallazgo, payload y resultado despues
      nota: >-
        La columna de variante se llena solo si se probo; si no, se marca como no probada
        en lugar de suponer que tambien falla.
      columnas: [Hallazgo, Payload original, Resultado, Variante probada, Conclusion]
      anchos: [2.2, 3.6, 2.4, 3.2, 2.6]
      filas:
      - [Inyeccion SQL, 'Comilla y OR tautologico', 'Sin filas extra', 'Mayusculas y comentario', 'Mitigado']
      - [XSS reflejado, 'Script en name', 'Texto codificado', 'Etiqueta img', 'Mitigado']
      - [LFI, 'Secuencia ../ en page', 'Error controlado', 'Codificacion URL', 'Mitigado']
      - [Formulario legitimo, 'Consulta normal', 'Funciona igual', 'No aplica', 'Sin regresion']
    entregable: >-
      Se entrega la evidencia antes y despues con el mismo payload, el resultado de la
      variante y la comprobacion de que la funcionalidad legitima sigue operativa.
    estructura: |
      semana_07/
      |-- informe.md
      |-- codigo/
      |-- evidencia/
      |   |-- sqli_antes.html
      |   |-- sqli_despues.html
      |   |-- sqli_antes_conteo.txt
      |   `-- sqli_despues_conteo.txt
      `-- README.md
    comprobaciones:
    - El payload de antes y el de despues son identicos.
    - La variante se probo o se declaro no probada.
    - La funcionalidad legitima se verifico despues del parche.
    - La conclusion distingue mitigado de no verificado.
    avisos:
    - Cambiar el payload para que falle no demuestra nada.
    - Un parche que rompe la aplicacion no es una mitigacion aceptable.
  - grupo: 4
    titulo: Parchear la causa y probar la regresion
    intro: >-
      El rol Azul escribe el parche en el punto donde nace la falla: parametrizacion,
      codificacion y lista blanca. Despues lo prueba con el payload del grupo Rojo.
    bloques:
    - titulo: Parametrizar la consulta
      texto: >-
        La consulta deja de concatenar y recibe el valor como parametro. El cambio se ve
        en el diff y se explica en una linea.
      comandos: |
        mkdir -p semana_07/evidencia
        git diff -- semana_07/codigo/ > semana_07/evidencia/parche.diff
        grep -nE 'execute|cursor' semana_07/codigo/*.py \
          | tee semana_07/evidencia/consulta.txt
    - titulo: Codificar la salida y validar la entrada
      texto: >-
        La salida se codifica en el contexto donde se usa y la entrada se valida contra
        un formato esperado. Validar sin codificar no evita el XSS.
    - titulo: Resolver la ruta con lista blanca
      texto: >-
        El nombre de archivo se compara contra una lista permitida y se compone con una
        raiz fija. Concatenar la entrada del usuario y despues "limpiar" no es suficiente.
      comandos: |
        python3 - <<'PY' | tee semana_07/evidencia/rutas.txt
        permitidos = {'inicio.php', 'ayuda.php'}
        for pedido in ('inicio.php', '../../../../etc/passwd'):
            print(pedido, 'aceptado' if pedido in permitidos else 'rechazado')
        PY
    - titulo: Ejecutar la prueba de regresion
      texto: >-
        La prueba automatizada usa el mismo payload y espera el rechazo. Si la prueba
        falla, el parche no esta completo.
      comandos: |
        python3 -m pytest semana_07/pruebas -q \
          | tee semana_07/evidencia/pytest.txt
    tabla:
      titulo: Vulnerabilidad, parche y prueba
      nota: >-
        La prueba se cita por su nombre y su resultado; "se probo a mano" no sustituye una
        prueba reproducible.
      columnas: [Vulnerabilidad, Parche, Archivo, Prueba, Resultado]
      anchos: [2.4, 3.4, 2.6, 3.0, 2.2]
      filas:
      - [Inyeccion SQL, 'Consulta parametrizada', 'consulta.py', 'test_sqli_rechaza', 'Pasa']
      - [XSS reflejado, 'Codificacion de salida', 'vista.py', 'test_xss_codifica', 'Pasa']
      - [LFI, 'Lista blanca de rutas', 'archivos.py', 'test_lfi_rechaza', 'Pasa']
      - [Regresion, 'Sin cambios de contrato', 'consulta.py', 'test_caso_normal', 'Pasa']
    entregable: >-
      Se entrega el diff del parche, la prueba de regresion con su salida y la explicacion
      de por que la correccion ataca la causa.
    estructura: |
      semana_07/
      |-- informe.md
      |-- codigo/
      |-- pruebas/
      |-- evidencia/
      |   |-- parche.diff
      |   |-- rutas.txt
      |   `-- pytest.txt
      `-- README.md
    comprobaciones:
    - El diff muestra el cambio en la causa, no en el mensaje de error.
    - La prueba usa el payload original y espera rechazo.
    - La regresion funcional sigue en verde.
    - La lista blanca se comprueba con el intento de salir de la raiz.
    avisos:
    - Escapar la salida sin validar la entrada deja otras rutas abiertas.
    - Una prueba que solo comprueba el caso malo no demuestra que el bueno sigue vivo.
- numero: 8
  fase: 4
  titulo: 'Forense digital: adquisición, artefactos y línea de tiempo'
  objetivo: '> Adquirir evidencia forense con cadena de custodia, reconstruir el incidente a partir de artefactos y extraer IoCs.'
  contenidos:
  - Principio de intercambio de Locard y orden de volatilidad.
  - Adquisición lógica y física; diferencia y cuándo usar cada una.
  - Herramientas dd y dcfldd, y montaje en solo lectura.
  - Hash antes y después, y verificación de integridad.
  - Formulario de cadena de custodia y registro de transferencias.
  - Registros de autenticación, journald y syslog.
  - Historial de shell, cron, timers y servicios añadidos.
  - Usuarios, grupos, SUID y paquetes instalados fuera de política.
  - Persistencia típica en Linux y su rastro.
  - Construcción de línea de tiempo e indicadores de compromiso.
  herramientas:
  - dcfldd
  - grep y awk
  - mount en solo lectura
  - sha256sum
  - journalctl
  glosario:
  - Principio de Locard
  - Orden de volatilidad
  - Adquisición lógica
  - Imagen forense
  - Persistencia
  - Línea de tiempo
  - Indicador de compromiso
  practica:
    titulo: Imagen forense, reconstrucción y línea de tiempo
    escenario: '> Cada grupo adquiere imagen forense, reconstruye la secuencia del compromiso simulado y construye línea de tiempo con IoCs.'
    pasos:
    - Documentar el estado del sistema y el orden de volatilidad elegido antes de tocar nada.
    - Adquirir la imagen con dcfldd calculando el hash en el mismo paso, y verificar ambos hashes.
    - Montar la imagen en solo lectura y comprobar que el contenido es accesible.
    - Extraer eventos y persistencia, y construir la línea de tiempo con al menos diez eventos.
    - Listar los indicadores de compromiso y completar el formulario de cadena de custodia.
    entregable: Imagen forense con hashes, formulario de custodia, línea de tiempo, relato del incidente y tabla de IoCs.
    criterios:
    - criterio: Adquisición reproducible con integridad verificada
      peso: 2.0
    - criterio: Cadena de custodia completa
      peso: 2.0
    - criterio: Artefactos correctamente interpretados
      peso: 2.5
    - criterio: Línea de tiempo coherente con persistencia identificada
      peso: 2.5
    - criterio: IoCs reutilizables y separación hecho/hipótesis
      peso: 1.0
  evaluacion: formativa
  ejemplos:
  - grupo: 1
    titulo: Cadena de custodia y admisibilidad de la imagen
    intro: >-
      El rol Legal custodia la evidencia desde el primer minuto: quien la adquiere, con
      que, cuando y con que hash. Sin ese registro, la imagen es un archivo mas.
    bloques:
    - titulo: Abrir el formulario antes de adquirir
      texto: >-
        El formulario se abre antes de tocar el sistema. Se anotan hora UTC, operador,
        herramienta y estado del equipo; despues se completa con los hashes.
      comandos: |
        mkdir -p semana_08/evidencia
        printf '%s | adquisicion | operador=%s | herramienta=dcfldd\n' \
          "$(date -u +%FT%TZ)" "$(id -un)" > semana_08/evidencia/custodia.txt
        printf 'estado del equipo: encendido, orden de volatilidad documentado\n' \
          >> semana_08/evidencia/custodia.txt
    - titulo: Registrar hash de origen y de destino
      texto: >-
        El hash se calcula durante la copia, no despues. Si los dos hashes no coinciden,
        la imagen no se usa: se repite la adquisicion.
      comandos: |
        sha256sum caso.dd | tee semana_08/evidencia/origen.sha256
        sha256sum semana_08/imagen.dd | tee semana_08/evidencia/destino.sha256
        cmp -s semana_08/evidencia/origen.sha256 semana_08/evidencia/destino.sha256 \
          && echo 'hashes coinciden' || echo 'NO coinciden: repetir'
    - titulo: Registrar cada transferencia
      texto: >-
        Cada cambio de manos se anota con hora, quien entrega, quien recibe y para que. El
        registro se firma y se conserva junto a la imagen.
    - titulo: Decidir que evidencia se excluye
      texto: >-
        La evidencia adquirida sin autorizacion o sin integridad verificable se excluye
        del informe. Se explica el motivo en lugar de corregir el registro.
    tabla:
      titulo: Pieza, integridad y admisibilidad
      nota: >-
        La ultima columna justifica la decision con el registro; si falta la autorizacion,
        la pieza no entra aunque el hash sea correcto.
      columnas: [Pieza, Hash, Autorizacion, Integridad, Decision]
      anchos: [2.6, 2.4, 2.6, 2.2, 3.0]
      filas:
      - [Imagen del disco, 'SHA-256 doble', 'Alcance semana 3', 'Verificada', 'Admisible']
      - [Registro de autenticacion, 'SHA-256', 'Alcance semana 3', 'Verificada', 'Admisible']
      - [Captura de memoria, 'Pendiente', 'No incluida en el alcance', 'No verificada', 'Excluida']
      - [Nota del analista, 'No aplica', 'No es evidencia', 'No aplica', 'Solo contexto']
    entregable: >-
      Se entrega el formulario de custodia completo, los hashes de origen y destino, el
      registro de transferencias y la decision por pieza.
    estructura: |
      semana_08/
      |-- informe.md
      |-- imagen.dd
      |-- evidencia/
      |   |-- custodia.txt
      |   |-- origen.sha256
      |   `-- destino.sha256
      `-- README.md
    comprobaciones:
    - El formulario se abrio antes de adquirir y tiene hora UTC.
    - Los hashes de origen y destino coinciden o la adquisicion se repitio.
    - Cada transferencia tiene hora y responsable.
    - La pieza excluida esta excluida aunque su hash sea correcto.
    avisos:
    - La imagen no se abre en modo lectura y escritura en ningun momento.
    - Un hash correcto no sustituye la autorizacion del alcance.
  - grupo: 2
    titulo: Adquirir, verificar y localizar persistencia
    intro: >-
      El rol Rojo adquiere la imagen con hash en el mismo paso y busca los mecanismos que
      sobreviven al reinicio. La busqueda es dirigida por hipotesis, no por barrido.
    bloques:
    - titulo: Adquirir con hash simultaneo
      texto: >-
        La copia y el hash se hacen en la misma operacion. Si la herramienta no esta
        disponible, se usa dd y se documenta la limitacion en lugar de omitir el hash.
      comandos: |
        mkdir -p semana_08/evidencia
        dcfldd if=caso.dd of=semana_08/imagen.dd hash=sha256 \
          hashlog=semana_08/evidencia/dcfldd.sha256 2>&1 \
          | tail -5 | tee semana_08/evidencia/dcfldd.txt
        sha256sum semana_08/imagen.dd | tee -a semana_08/evidencia/dcfldd.sha256
    - titulo: Montar en solo lectura y confirmar el contenido
      texto: >-
        El montaje se hace con loop y solo lectura. Se comprueba que el arbol se lee y que
        no se modifico nada comparando el hash despues de desmontar.
      comandos: |
        sudo mkdir -p /mnt/caso
        sudo mount -o ro,loop,noload semana_08/imagen.dd /mnt/caso
        ls /mnt/caso | tee semana_08/evidencia/raiz.txt
        sudo umount /mnt/caso
        sha256sum semana_08/imagen.dd
    - titulo: Buscar persistencia por mecanismo
      texto: >-
        Se revisan tareas programadas, servicios añadidos, claves de arranque y usuarios
        creados. Cada hallazgo se contrasta con la fecha de creacion del archivo.
      comandos: |
        sudo mount -o ro,loop,noload semana_08/imagen.dd /mnt/caso
        find /mnt/caso -xdev -type f -newermt '2026-01-01' \
          -printf '%T@ %p\n' 2>/dev/null | sort -n \
          | tee semana_08/evidencia/archivos_recientes.txt
        grep -RIn 'curl\|wget\|base64' /mnt/caso/etc/cron* /mnt/caso/var/spool/cron 2>/dev/null \
          | tee semana_08/evidencia/cron.txt || true
        sudo umount /mnt/caso
    - titulo: Enlazar cada persistencia con su artefacto
      texto: >-
        Una persistencia aislada es una hipotesis. Se enlaza con el registro de acceso, el
        historial o el paquete instalado que la origino.
    tabla:
      titulo: Persistencia, ruta y prueba
      nota: >-
        La prueba cita el archivo y su marca de tiempo; "parece sospechoso" no es una
        prueba.
      columnas: [Mecanismo, Ruta, Marca de tiempo, Artefacto asociado, Conclusion]
      anchos: [2.6, 3.4, 2.4, 3.2, 2.2]
      filas:
      - [Cron, 'Archivo en /etc/cron.d', 'Fecha del archivo', 'Descarga remota en el script', 'Confirmada']
      - [Servicio systemd, 'Unidad añadida', 'Fecha de la unidad', 'Ejecutable fuera de /usr/bin', 'Hipotesis']
      - [Usuario nuevo, 'Entrada en passwd', 'Fecha de alta', 'Acceso en auth.log', 'Confirmada']
      - [Clave SSH, 'authorized_keys', 'Fecha del archivo', 'Acceso desde IP externa', 'Confirmada']
    entregable: >-
      Se entrega la imagen con sus hashes, la busqueda de persistencia y la tabla que
      enlaza cada mecanismo con su prueba.
    estructura: |
      semana_08/
      |-- informe.md
      |-- imagen.dd
      |-- evidencia/
      |   |-- dcfldd.sha256
      |   |-- raiz.txt
      |   |-- archivos_recientes.txt
      |   `-- cron.txt
      `-- README.md
    comprobaciones:
    - La adquisicion calcula el hash durante la copia.
    - El montaje es de solo lectura y se desmonta al terminar.
    - Cada mecanismo de persistencia tiene su artefacto asociado.
    - La hipotesis se distingue de la confirmacion.
    avisos:
    - Nunca se monta la imagen en lectura y escritura, ni para "mirar rapido".
    - Los artefactos con datos personales se citan sin transcribirlos.
  - grupo: 3
    titulo: Reconstruir la linea de tiempo y el relato
    intro: >-
      El rol Azul convierte los artefactos en una secuencia coherente: que paso, en que
      orden y que lo demuestra. La linea de tiempo es la prueba, no un resumen.
    bloques:
    - titulo: Extraer eventos con marca de tiempo
      texto: >-
        Se normalizan fechas a UTC y se descartan las lineas sin hora. Cada evento
        conserva su archivo de origen para poder citarlo.
      comandos: |
        mkdir -p semana_08/evidencia
        sudo mount -o ro,loop,noload semana_08/imagen.dd /mnt/caso
        awk '{print $1" "$2" "$3" auth: "$0}' /mnt/caso/var/log/auth.log \
          > semana_08/evidencia/eventos_auth.txt 2>/dev/null || true
        printf 'eventos extraidos: '; wc -l < semana_08/evidencia/eventos_auth.txt
        sudo umount /mnt/caso
    - titulo: Ordenar y deduplicar
      texto: >-
        La misma accion puede aparecer en dos registros. Se unifica por instante y se
        anota la fuente doble en lugar de contarla dos veces.
      comandos: |
        sort -u semana_08/evidencia/eventos_auth.txt \
          > semana_08/eventos_ordenados.txt
        head -20 semana_08/eventos_ordenados.txt
    - titulo: Construir al menos diez eventos con fuente
      texto: >-
        La linea de tiempo tiene diez filas minimo, cada una con instante, evento, fuente y
        si es hecho o inferencia.
    - titulo: Contrastar el relato con la persistencia
      texto: >-
        Si la persistencia aparecio antes del primer acceso, el relato falla. La
        incoherencia se documenta como pendiente de explicar, no se oculta.
    tabla:
      titulo: Instante, evento y fuente
      nota: >-
        La columna de tipo distingue hecho comprobado de inferencia; la inferencia no se
        presenta como concluyente.
      columnas: [Instante UTC, Evento, Fuente, Tipo, Coherencia]
      anchos: [2.6, 4.2, 3.0, 2.0, 2.0]
      filas:
      - ['00:12:03', 'Acceso SSH correcto', 'auth.log', 'Hecho', 'Coherente']
      - ['00:13:40', 'Creacion de usuario', 'passwd', 'Hecho', 'Coherente']
      - ['00:15:02', 'Alta de cron', 'cron.d', 'Hecho', 'Coherente']
      - ['00:16:10', 'Descarga remota', 'cron', 'Hecho', 'Coherente']
      - ['00:20:00', 'Conexion saliente', 'firewall', 'Inferencia', 'Pendiente']
    entregable: >-
      Se entrega la linea de tiempo con al menos diez eventos, su fuente y el relato del
      incidente separando hechos de inferencias.
    estructura: |
      semana_08/
      |-- informe.md
      |-- imagen.dd
      |-- eventos_ordenados.txt
      |-- evidencia/
      |   `-- eventos_auth.txt
      `-- README.md
    comprobaciones:
    - Todos los instantes estan en UTC.
    - Cada evento cita archivo y linea de origen.
    - Hay al menos diez eventos y la secuencia es coherente.
    - Las inferencias estan marcadas como tales.
    avisos:
    - Una linea de tiempo con huecos no se rellena con suposiciones.
    - El desfase horario del contenedor se documenta antes de normalizar.
  - grupo: 4
    titulo: Indicadores reutilizables y reglas de deteccion
    intro: >-
      El rol Púrpura extrae indicadores del incidente y los convierte en reglas
      comprobables. Un indicador sirve si permite detectar el mismo comportamiento en
      otro equipo.
    bloques:
    - titulo: Extraer indicadores de los artefactos
      texto: >-
        Se extraen rutas, nombres de usuario, hashes de archivos y patrones de comando.
        Cada indicador se clasifica por tipo y por grado de confianza.
      comandos: |
        mkdir -p semana_08/evidencia
        sha256sum semana_08/imagen.dd > semana_08/evidencia/imagen.sha256
        grep -RhoE '/tmp/[A-Za-z0-9._/-]+' /mnt/caso/var/log 2>/dev/null \
          | sort -u > semana_08/evidencia/rutas_tmp.txt || true
        grep -RhoE '([0-9]{1,3}\.){3}[0-9]{1,3}' /mnt/caso/var/log 2>/dev/null \
          | sort -u > semana_08/evidencia/ips.txt || true
    - titulo: Distinguir indicador de coincidencia
      texto: >-
        Una ruta en /tmp no es un indicador por si sola; lo es combinada con ejecucion y
        persistencia. Se documenta la combinacion que eleva la confianza.
    - titulo: Escribir la regla y probarla contra el caso
      texto: >-
        La regla se prueba contra la evidencia del caso y contra un archivo limpio. Debe
        disparar en el primero y no en el segundo.
      comandos: |
        cat > semana_08/regla.yar <<'YAR'
        rule persistencia_tmp_cron {
          strings:
            $a = "/tmp/" ascii
            $b = "curl" ascii
          condition:
            $a and $b
        }
        YAR
        yara semana_08/regla.yar semana_08/imagen.dd \
          | tee semana_08/evidencia/yara.txt || true
    - titulo: Publicar los indicadores sin datos sensibles
      texto: >-
        La tabla final no incluye nombres reales ni direcciones internas fuera del
        laboratorio. Se anonimiza antes de versionar.
    tabla:
      titulo: Indicador, tipo y confianza
      nota: >-
        La confianza se justifica por la combinacion observada; un indicador aislado no
        pasa de baja.
      columnas: [Indicador, Tipo, Fuente, Confianza, Regla]
      anchos: [3.0, 2.6, 2.4, 2.1, 2.7]
      filas:
      - [Ruta en /tmp con descarga, 'Comportamiento', 'cron y log', 'Alta', 'Contiene /tmp y curl']
      - [Usuario fuera de politica, 'Cuenta', 'passwd', 'Alta', 'No pertenece a la lista base']
      - [IP externa en auth.log, 'Red', 'auth.log', 'Media', 'Correlacionar con hora']
      - [Hash de ejecutable, 'Archivo', 'find y sha256sum', 'Alta', 'Coincidencia exacta']
    entregable: >-
      Se entrega la tabla de indicadores con confianza, la regla probada contra el caso y
      contra un archivo limpio, y la evidencia anonimizada.
    estructura: |
      semana_08/
      |-- informe.md
      |-- regla.yar
      |-- evidencia/
      |   |-- rutas_tmp.txt
      |   |-- ips.txt
      |   |-- yara.txt
      |   `-- imagen.sha256
      `-- README.md
    comprobaciones:
    - Cada indicador cita su fuente.
    - La regla se probo contra el caso y contra un limpio.
    - La confianza se justifica por la combinacion observada.
    - La tabla esta anonimizada.
    avisos:
    - Un indicador de IP puede ser infraestructura compartida: la confianza lo refleja.
    - La regla no se publica fuera del repositorio del grupo.
- numero: 9
  fase: 4
  titulo: Respuesta a incidentes y triage estático de malware
  objetivo: Aplicar un playbook de respuesta y realizar triage estático de una muestra inerte sin ejecutarla.
  contenidos:
  - 'NIST SP 800-61: preparación, detección, contención, erradicación y recuperación.'
  - Playbooks, roles, comunicación y registro de decisiones.
  - Triage estático con hashes, strings, cabeceras y reglas YARA.
  - Límites legales y técnicos del análisis dinámico.
  - Informe post mortem y acciones de mejora.
  herramientas:
  - file y strings
  - YARA
  - sha256sum
  glosario:
  - NIST SP 800-61
  - Playbook
  - Contención
  - Triage
  - YARA
  - Análisis dinámico
  - Post mortem
  practica:
    titulo: Playbook y triage estático
    escenario: 'Cada grupo escribe el playbook del incidente reconstruido en la semana 8 y realiza triage estático de una muestra inerte entregada por el docente.

      '
    pasos:
    - Redactar el playbook en una página con fases, responsables y criterios de escalado.
    - Calcular el hash de la muestra y buscar su reputación sin subir datos sensibles.
    - Extraer cadenas relevantes e identificar indicios de funcionalidad.
    - Escribir una regla YARA que detecte la muestra y probarla contra ella.
    - Redactar el post mortem con acciones de mejora priorizadas.
    entregable: Playbook de una página, informe de triage y regla YARA probada, más post mortem.
    criterios:
    - criterio: Playbook operativo con fases y responsables
      peso: 3.0
    - criterio: Triage estático completo y sin ejecutar la muestra
      peso: 2.5
    - criterio: Regla YARA que detecta la muestra
      peso: 2.0
    - criterio: Post mortem con mejoras priorizadas
      peso: 1.5
    - criterio: Cumplimiento de las reglas de manejo de muestras
      peso: 1.0
  evaluacion: formativa
  ejemplos:
  - grupo: 1
    titulo: Playbook, roles y limites legales del manejo
    intro: >-
      El rol Legal escribe el playbook como un documento operativo: quien decide en cada
      fase, que se comunica y que no se puede hacer con la muestra. La claridad legal es
      parte de la respuesta.
    bloques:
    - titulo: Fijar fases, responsables y criterios de escalado
      texto: >-
        Cada fase tiene un responsable nombrado y un criterio de salida. Un playbook sin
        criterio de salida se queda en la fase de deteccion para siempre.
      comandos: |
        mkdir -p semana_09/evidencia
        printf '%s | playbook v1 | responsable: Grupo 1\n' \
          "$(date -u +%FT%TZ)" > semana_09/evidencia/playbook_registro.txt
    - titulo: Declarar los limites del analisis dinamico
      texto: >-
        La muestra no se ejecuta. Se documenta por que: riesgo de propagacion, falta de
        aislamiento y reglas del curso. Si en el futuro se autoriza, se exige entorno
        aislado y registro.
    - titulo: Definir la ruta de comunicacion
      texto: >-
        Quien avisa, a quien, por que canal y en cuanto tiempo. La comunicacion incluye a
        quien no debe informarse todavia para no contaminar la investigacion.
    - titulo: Cerrar con post mortem y decisiones registradas
      texto: >-
        El post mortem lista decisiones, aciertos y errores, y prioriza acciones por
        impacto y esfuerzo. Cada accion tiene responsable y fecha.
    tabla:
      titulo: Fase, responsable y criterio de salida
      nota: >-
        El criterio de salida es verificable; "cuando este claro" no se puede auditar.
      columnas: [Fase, Responsable, Criterio de salida, Comunicacion, Plazo]
      anchos: [1.9, 2.2, 4.0, 3.4, 1.8]
      filas:
      - [Preparacion, 'Grupo 1', 'Playbook aprobado y contactos vigentes', 'Canal del curso', 'Antes del corte']
      - [Deteccion, 'Grupo 4', 'Alerta clasificada como verdadera', 'Docente', '15 minutos']
      - [Contencion, 'Grupo 3', 'Servicio aislado y evidencia preservada', 'Docente y grupo', '30 minutos']
      - [Erradicacion, 'Grupo 2', 'Persistencia eliminada y verificada', 'Grupo', '2 horas']
      - [Recuperacion, 'Grupo 3', 'Servicio restaurado y comprobado', 'Grupo', '4 horas']
    entregable: >-
      Se entrega el playbook de una pagina con fases, responsables, criterios, ruta de
      comunicacion y limites legales, mas el post mortem con acciones priorizadas.
    estructura: |
      semana_09/
      |-- playbook.md
      |-- post_mortem.md
      |-- informe.md
      |-- evidencia/
      |   `-- playbook_registro.txt
      `-- README.md
    comprobaciones:
    - Cada fase tiene responsable y criterio de salida verificable.
    - Los limites del analisis dinamico estan escritos.
    - La ruta de comunicacion indica canal y plazo.
    - El post mortem prioriza acciones con responsable y fecha.
    avisos:
    - Ejecutar la muestra queda prohibido aunque el playbook lo contemple: falta aislamiento.
    - Un playbook que no se puede ejecutar en una hora no es un playbook de una pagina.
  - grupo: 2
    titulo: Triage estatico sin ejecutar la muestra
    intro: >-
      El rol Rojo describe la muestra sin ejecutarla: tipo de archivo, cabeceras, cadenas
      y hash. La regla es simple: se lee, no se corre.
    bloques:
    - titulo: Identificar el tipo y calcular el hash
      texto: >-
        El tipo se lee de la cabecera y se contrasta con la extension. El hash es la
        identidad de la muestra y se calcula antes de cualquier analisis.
      comandos: |
        mkdir -p semana_09/evidencia
        file muestra.bin | tee semana_09/evidencia/tipo.txt
        sha256sum muestra.bin | tee semana_09/evidencia/sha256.txt
        md5sum muestra.bin | tee semana_09/evidencia/md5.txt
    - titulo: Leer cabeceras sin ejecutar
      texto: >-
        Para un ELF se leen cabecera y secciones; para un documento se revisan objetos
        embebidos. Nada de abrir el archivo con el programa que lo interpretaria.
      comandos: |
        readelf -h muestra.bin | tee semana_09/evidencia/elf.txt 2>/dev/null || true
        xxd -l 128 muestra.bin | tee semana_09/evidencia/hex.txt
    - titulo: Extraer cadenas y clasificarlas
      texto: >-
        Las cadenas se agrupan por interes: rutas, dominios, comandos, mensajes. La lista
        cruda va como evidencia; la clasificacion va en el informe.
      comandos: |
        strings -n 6 muestra.bin > semana_09/evidencia/strings.txt
        grep -Ei 'http|curl|wget|/tmp/|base64|chmod|system' \
          semana_09/evidencia/strings.txt | head -30 \
          | tee semana_09/evidencia/indicadores.txt || true
    - titulo: Consultar reputacion sin subir la muestra
      texto: >-
        Se consulta solo el hash. Si no hay API disponible, se documenta como no
        verificado en lugar de inventar un veredicto.
    tabla:
      titulo: Artefacto, hallazgo y valor probatorio
      nota: >-
        La columna de valor probatorio distingue indicio de prueba; un string suelto es
        indicio.
      columnas: [Artefacto, Hallazgo, Valor probatorio, Accion]
      anchos: [2.6, 4.4, 2.8, 3.0]
      filas:
      - [Tipo y hash, 'ELF de 64 bits con SHA-256 propio', 'Identidad de la muestra', 'Registrar y buscar reputacion']
      - [Cabecera, 'Entrada y secciones legibles', 'Estructura del binario', 'Documentar']
      - [Cadenas, 'Rutas y comandos de descarga', 'Indicio de funcionalidad', 'Correlacionar con la regla']
      - [Reputacion, 'No consultada por falta de API', 'No verificado', 'Declarar limitacion']
    entregable: >-
      Se entrega el informe de triage con tipo, hashes, cabeceras, cadenas clasificadas y
      la declaracion de lo que no se pudo verificar.
    estructura: |
      semana_09/
      |-- informe.md
      |-- muestra.bin
      |-- evidencia/
      |   |-- tipo.txt
      |   |-- sha256.txt
      |   |-- elf.txt
      |   |-- hex.txt
      |   |-- strings.txt
      |   `-- indicadores.txt
      `-- README.md
    comprobaciones:
    - La muestra no se ejecuto en ningun momento.
    - El hash se calculo antes de abrir el archivo con otras herramientas.
    - Las cadenas estan clasificadas, no solo volcadas.
    - Lo no verificado esta declarado.
    avisos:
    - La muestra no se abre con el programa que la interpreta, ni con doble clic.
    - Subir la muestra a un servicio externo puede exponer datos: solo se consulta el hash.
  - grupo: 3
    titulo: Contener, erradicar y verificar la recuperacion
    intro: >-
      El rol Azul aplica el playbook al incidente de la semana 8: contiene, erradica y
      comprueba que el servicio vuelve sin el mecanismo de persistencia.
    bloques:
    - titulo: Contener sin destruir evidencia
      texto: >-
        Se aísla el servicio y se preserva la evidencia antes de borrar nada. Contener no
        es limpiar: es evitar la propagacion sin perder el rastro.
      comandos: |
        mkdir -p semana_09/evidencia
        docker stop objetivo-linux | tee semana_09/evidencia/contencion.txt
        docker inspect objetivo-linux > semana_09/evidencia/contenedor_antes.json
    - titulo: Erradicar la persistencia identificada
      texto: >-
        Se eliminan solo los mecanismos confirmados en la semana 8. Cada eliminacion se
        registra con el comando y el motivo.
      comandos: |
        docker start objetivo-linux
        docker exec objetivo-linux sh -c 'crontab -l 2>/dev/null || true' \
          > semana_09/evidencia/cron_antes.txt
        docker exec objetivo-linux sh -c 'rm -f /etc/cron.d/sospechoso' \
          | tee semana_09/evidencia/erradicacion.txt
    - titulo: Verificar que la persistencia no volvio
      texto: >-
        Se repite la busqueda del mecanismo eliminado. Si el archivo reaparece, hay otra
        persistencia que alimenta el primero y la erradicacion no termino.
      comandos: |
        docker exec objetivo-linux sh -c 'ls /etc/cron.d/ 2>/dev/null' \
          | tee semana_09/evidencia/cron_despues.txt
        docker exec objetivo-linux sh -c 'ps -eo pid,cmd' \
          | tee semana_09/evidencia/procesos_despues.txt
    - titulo: Comprobar la recuperacion del servicio
      texto: >-
        El servicio se prueba con la misma peticion que antes del incidente. La
        recuperacion se demuestra con la respuesta, no con el arranque del contenedor.
      comandos: |
        curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8081/ \
          | tee semana_09/evidencia/recuperacion.txt
    tabla:
      titulo: Fase, accion y verificacion
      nota: >-
        La verificacion se hace con la misma busqueda que detecto el mecanismo; si se
        cambia el criterio, no demuestra nada.
      columnas: [Fase, Accion, Evidencia, Verificacion, Resultado]
      anchos: [2.0, 3.2, 2.6, 3.0, 2.2]
      filas:
      - [Contencion, 'Detener el contenedor', 'contencion.txt', 'Estado del contenedor', 'Aislado']
      - [Erradicacion, 'Eliminar cron confirmado', 'erradicacion.txt', 'Listado de cron.d', 'Sin el archivo']
      - [Verificacion, 'Buscar persistencia', 'cron_despues.txt', 'Archivo ausente', 'Confirmado']
      - [Recuperacion, 'Peticion HTTP al servicio', 'recuperacion.txt', 'Codigo 200', 'Restaurado']
    entregable: >-
      Se entrega la secuencia de contencion, erradicacion y recuperacion con la
      verificacion de cada fase y el servicio probado.
    estructura: |
      semana_09/
      |-- informe.md
      |-- evidencia/
      |   |-- contencion.txt
      |   |-- contenedor_antes.json
      |   |-- erradicacion.txt
      |   |-- cron_antes.txt
      |   |-- cron_despues.txt
      |   `-- recuperacion.txt
      `-- README.md
    comprobaciones:
    - La evidencia se preserva antes de eliminar nada.
    - Solo se elimina lo confirmado, no lo sospechoso.
    - La verificacion repite la busqueda original.
    - El servicio responde despues de la recuperacion.
    avisos:
    - Detener el contenedor sin preservar la evidencia destruye la prueba.
    - Si el archivo reaparece, no se insiste en borrarlo: se busca el origen.
  - grupo: 4
    titulo: Regla YARA probada y deteccion reutilizable
    intro: >-
      El rol Púrpura escribe la regla que detecta la muestra y la prueba contra un archivo
      limpio. Una regla que detecta todo no sirve; una que no se prueba tampoco.
    bloques:
    - titulo: Elegir cadenas discriminantes
      texto: >-
        Se eligen cadenas que no aparezcan en archivos normales. Las rutas genericas o
        palabras comunes producen falsos positivos y se descartan.
      comandos: |
        mkdir -p semana_09/evidencia
        strings -n 8 muestra.bin | grep -E '/tmp/|http|chmod' \
          | sort -u | tee semana_09/evidencia/cadenas_candidatas.txt || true
    - titulo: Escribir la regla con condicion estricta
      texto: >-
        La condicion exige varias cadenas a la vez. Se documenta por que cada una esta y
        que se elimino por ser demasiado comun.
      comandos: |
        cat > semana_09/regla.yar <<'YAR'
        rule muestra_curso {
          meta:
            autor = "Grupo 4"
            descripcion = "Ruta temporal y descarga en la misma muestra"
          strings:
            $a = "/tmp/" ascii
            $b = "http" ascii
            $c = "chmod" ascii
          condition:
            all of them
        }
        YAR
        yara semana_09/regla.yar muestra.bin | tee semana_09/evidencia/yara_muestra.txt
    - titulo: Probar contra archivos limpios
      texto: >-
        Se ejecuta contra archivos del sistema que no deberian coincidir. Si coinciden, la
        regla se ajusta y se vuelve a probar.
      comandos: |
        yara semana_09/regla.yar /bin/ls > semana_09/evidencia/yara_limpio.txt 2>&1 || true
        wc -l < semana_09/evidencia/yara_limpio.txt
    - titulo: Documentar la cobertura y el limite
      texto: >-
        La regla detecta esta muestra, no la familia. El informe dice que cambios la
        evaden y que se necesitaria para generalizarla.
    tabla:
      titulo: Cadena, motivo y resultado de la prueba
      nota: >-
        La columna de falsos positivos se llena con la prueba real contra archivos limpios.
      columnas: [Cadena, Motivo, Discriminante, Prueba, Resultado]
      anchos: [2.4, 3.2, 2.1, 2.9, 2.4]
      filas:
      - ['/tmp/', 'Ruta temporal usada en la muestra', 'Media', 'Contra /bin/ls', 'No coincide']
      - ['http', 'Descarga remota', 'Baja', 'Contra /bin/ls', 'No coincide']
      - ['chmod', 'Cambio de permisos', 'Media', 'Contra /bin/ls', 'No coincide']
      - [Combinacion, 'Exige las tres a la vez', 'Alta', 'Contra la muestra', 'Detecta']
    entregable: >-
      Se entrega la regla con metadatos, el resultado contra la muestra, la prueba contra
      archivos limpios y la declaracion de cobertura.
    estructura: |
      semana_09/
      |-- informe.md
      |-- regla.yar
      |-- muestra.bin
      |-- evidencia/
      |   |-- cadenas_candidatas.txt
      |   |-- yara_muestra.txt
      |   `-- yara_limpio.txt
      `-- README.md
    comprobaciones:
    - La regla exige una combinacion, no una cadena suelta.
    - Se probo contra la muestra y contra al menos un archivo limpio.
    - La cobertura se declara como muestra concreta, no como familia.
    - Las cadenas descartadas estan justificadas.
    avisos:
    - Una regla sin prueba contra limpios es una hipotesis, no una deteccion.
    - La regla no se ejecuta sobre archivos del sistema fuera de la prueba declarada.
- numero: 10
  fase: 5
  titulo: Evaluación final práctica de alcance cerrado
  objetivo: Ejecutar una auditoría completa de alcance cerrado sobre el laboratorio y comunicar los resultados en dos registros, técnico y ejecutivo.
  contenidos:
  - Repaso integrado de las cuatro fases.
  - Diferencia entre informe técnico y resumen ejecutivo.
  - Priorización de hallazgos por riesgo y esfuerzo de remediación.
  - Defensa oral de decisiones y limitaciones del alcance.
  herramientas:
  - Todo el laboratorio
  glosario:
  - Resumen ejecutivo
  - Remediación
  practica:
    titulo: Auditoría de alcance cerrado
    escenario: 'Evaluación individual de cuatro horas sobre un alcance definido por el docente. Se entregan informe técnico, resumen ejecutivo y una defensa oral de diez minutos.

      '
    pasos:
    - Leer el alcance entregado y firmar la aceptación antes de empezar.
    - Ejecutar reconocimiento, al menos una explotación controlada y su mitigación.
    - Recolectar y preservar la evidencia con hashes.
    - Redactar el informe técnico con hallazgos, evidencia y recomendaciones.
    - Redactar el resumen ejecutivo sin jerga y preparar la defensa oral.
    entregable: Informe técnico, resumen ejecutivo, evidencia preservada y defensa oral.
    criterios:
    - criterio: Cobertura completa del alcance declarado
      peso: 3.0
    - criterio: Evidencia preservada y verificable
      peso: 2.5
    - criterio: Informe técnico preciso y trazable
      peso: 2.0
    - criterio: Resumen ejecutivo comprensible sin jerga
      peso: 1.5
    - criterio: Defensa oral que reconoce limitaciones
      peso: 1.0
  evaluacion: final
  ejemplos:
  - grupo: 0
    titulo: Auditoria de alcance cerrado, informe y defensa
    intro: >-
      Ejemplo de cierre para el trabajo individual. El recorrido completo en cuatro horas:
      aceptar el alcance, reconocer, explotar de forma controlada, preservar la evidencia
      y comunicar en dos registros. No hay roles: cada estudiante responde por todo el
      ciclo.
    bloques:
    - titulo: Aceptar el alcance antes de ejecutar
      texto: >-
        Se firma la aceptacion con activos incluidos, ventana y limites. El reloj de las
        cuatro horas empieza cuando la aceptacion esta firmada, no antes.
      comandos: |
        mkdir -p semana_10/evidencia
        date -u +%FT%TZ > semana_10/evidencia/inicio.txt
        sha256sum semana_10/alcance_firmado.pdf > semana_10/evidencia/alcance.sha256
    - titulo: Reconocimiento y explotacion controlada
      texto: >-
        Se documenta la superficie observada y se elige un hallazgo para explotar. La
        explotacion se detiene en la prueba: no se extraen datos ni se persiste acceso.
      comandos: |
        nmap -sT -p 8081,3000,2222 --max-rate 20 127.0.0.1 \
          -oN semana_10/evidencia/nmap.txt
        curl -s -b semana_10/evidencia/cookies.txt \
          'http://127.0.0.1:8081/vulnerabilities/xss_r/?name=%3Cscript%3Ealert(1)%3C/script%3E' \
          > semana_10/evidencia/xss_antes.html
    - titulo: Preservar la evidencia con hash
      texto: >-
        Cada pieza se hashea al producirse y el conjunto se sella al final. La evidencia
        anonimizada es la que se versiona; la cruda queda fuera del repositorio.
      comandos: |
        sha256sum semana_10/evidencia/*.txt semana_10/evidencia/*.html \
          > semana_10/evidencia/evidencia.sha256
        sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[correo]/g' \
          semana_10/evidencia/xss_antes.html \
          > semana_10/evidencia/xss_anonima.html
    - titulo: Aplicar y verificar la mitigacion
      texto: >-
        Se aplica el control y se repite el mismo payload. La defensa se demuestra con el
        antes y el despues, igual que en la semana 7.
    - titulo: Redactar los dos registros
      texto: >-
        El informe tecnico cita evidencia y causa raiz; el resumen ejecutivo explica el
        riesgo y la decision sin jerga. La defensa oral reconoce los limites del alcance.
    tabla:
      titulo: Producto, contenido y criterio
      nota: >-
        La columna de evidencia se llena con el archivo concreto; un criterio sin archivo
        que lo respalde no esta cubierto.
      columnas: [Producto, Contenido, Evidencia, Criterio]
      anchos: [2.4, 4.2, 2.8, 3.6]
      filas:
      - [Alcance aceptado, 'Activos, ventana y limites', 'alcance.sha256', 'Cobertura declarada']
      - [Reconocimiento, 'Puertos y servicios observados', 'nmap.txt', 'Evidencia verificable']
      - [Explotacion, 'Payload y resultado', 'xss_antes.html', 'Hallazgo trazable']
      - [Mitigacion, 'Control y repeticion', 'xss_despues.html', 'Control demostrado']
      - [Informe tecnico, 'Hallazgos, causa y remediacion', 'evidencia.sha256', 'Precision y trazabilidad']
      - [Resumen ejecutivo, 'Riesgo y decision en lenguaje llano', 'resumen.md', 'Comprensible sin jerga']
      - [Defensa oral, 'Decisiones y limitaciones', 'guion.md', 'Reconoce limites']
    entregable: >-
      Se entrega el informe tecnico, el resumen ejecutivo, la evidencia anonimizada con su
      hash y el guion de la defensa oral, con el alcance firmado al inicio.
    estructura: |
      semana_10/
      |-- alcance_firmado.pdf
      |-- informe_tecnico.md
      |-- resumen_ejecutivo.md
      |-- guion.md
      |-- evidencia/
      |   |-- inicio.txt
      |   |-- nmap.txt
      |   |-- xss_antes.html
      |   |-- xss_anonima.html
      |   |-- xss_despues.html
      |   `-- evidencia.sha256
      `-- README.md
    comprobaciones:
    - El alcance esta firmado antes de la primera prueba.
    - Cada hallazgo del informe tecnico cita un archivo de evidencia.
    - El resumen ejecutivo se entiende sin conocer las herramientas.
    - La defensa oral declara al menos una limitacion del alcance.
    - La evidencia versionada esta anonimizada y sellada con hash.
    avisos:
    - Las cuatro horas incluyen la redaccion: se reserva al menos una hora para escribir.
    - No se explota nada fuera del alcance aunque quede tiempo disponible.
controles:
- fase: 1
  titulo: Control de fase uno, fundamentos y marco legal
  duracion_min: 45
  instrumento: Prueba escrita individual
  preguntas:
  - enunciado: Explique la diferencia entre vulnerabilidad, amenaza y riesgo con un ejemplo del laboratorio.
    puntaje: 2.5
  - enunciado: Un compañero propone escanear el portal de la universidad para practicar. Indique qué norma se incumple y qué alternativa propone.
    puntaje: 2.5
  - enunciado: Explique por qué AES-GCM verifica integridad y AES-CBC no, y qué implica al cifrar un archivo.
    puntaje: 2.5
  - enunciado: Enumere cuatro elementos que debe contener una autorización de auditoría y justifique cada uno.
    puntaje: 2.5
- fase: 2
  titulo: Control de fase dos, ofensiva controlada
  duracion_min: 45
  instrumento: Prueba escrita individual con ejercicios
  preguntas:
  - enunciado: Explique la diferencia entre un escaneo connect y uno SYN, y qué revela cada respuesta del objetivo.
    puntaje: 2.5
  - enunciado: Dado un formulario vulnerable a inyección SQL, escriba el payload de prueba y explique la corrección parametrizada.
    puntaje: 2.5
  - enunciado: Indique tres datos que aporta el reconocimiento pasivo y dos que solo se obtienen con tráfico activo.
    puntaje: 2.5
  - enunciado: Clasifique tres hallazgos del laboratorio según OWASP Top 10 y justifique la categoría asignada.
    puntaje: 2.5
- fase: 3
  titulo: Control de fase tres, defensa y desarrollo seguro
  duracion_min: 45
  instrumento: Prueba escrita individual con ejercicios
  preguntas:
  - enunciado: Proponga cinco controles de endurecimiento para un servidor SSH y explique el riesgo que reduce cada uno.
    puntaje: 2.5
  - enunciado: Escriba una regla de firewall que permita solo el puerto de la aplicación y explique la política por defecto.
    puntaje: 2.5
  - enunciado: Explique por qué parametrizar la consulta elimina la inyección SQL y por qué escapar comillas no basta.
    puntaje: 2.5
  - enunciado: Describa cómo comprobaría que una mitigación funciona repitiendo el ataque original.
    puntaje: 2.5
evaluacion_final:
  titulo: Evaluación final práctica de alcance cerrado
  duracion_min: 240
  instrumento: Evaluación individual práctica con entregables
  secciones:
  - nombre: Ejecución técnica sobre el alcance
    puntaje: 4
    detalle: Reconocimiento, explotación controlada y evidencia preservada con hash.
  - nombre: Informe técnico
    puntaje: 3
    detalle: Hallazgos con causa raíz, evidencia trazable y recomendaciones verificables.
  - nombre: Resumen ejecutivo
    puntaje: 2
    detalle: Comprensible sin jerga, con riesgo y prioridad de remediación.
  - nombre: Defensa oral
    puntaje: 1
    detalle: Justificación de decisiones y reconocimiento de limitaciones del alcance.
bibliografia:
- autor: Stuttard, D. y Pinto, M.
  titulo: The Web Application Hacker's Handbook
  detalle: Referencia para reconocimiento y explotación de aplicaciones web.
- autor: OWASP Foundation
  titulo: OWASP Top 10 2021
  detalle: Categorías de riesgo en aplicaciones web.
- autor: OWASP Foundation
  titulo: Web Security Testing Guide y ASVS
  detalle: Metodología de pruebas y estándar de verificación.
- autor: NIST
  titulo: CSF 2.0 y SP 800-61r2
  detalle: Marco de ciberseguridad y guía de respuesta a incidentes.
- autor: ISO IEC
  titulo: ISO IEC 27001 2022
  detalle: Sistema de gestión de seguridad de la información.
- autor: MITRE
  titulo: ATT&CK Enterprise Matrix
  detalle: Tácticas y técnicas de adversario para nombrar lo observado.
- autor: Asamblea Nacional de Venezuela
  titulo: Ley Especial contra los Delitos Informáticos
  detalle: Tipificación de delitos informáticos aplicable al curso.
- autor: Sikorski, M. y Honig, A.
  titulo: Practical Malware Analysis
  detalle: Referencia opcional para el triage estático de la semana 9.
politicas:
- Cada grupo mantiene su propio repositorio GitHub y lo entrega actualizado antes del corte semanal; el docente revisa ese repositorio.
- El trabajo se hace desde el equipo y la conexión de cada grupo: solo objetivos propios, el laboratorio provisto o sistemas con autorización escrita; nunca infraestructura de la universidad ni de terceros.
- Solo se atacan objetivos propios o con autorización escrita y firmada.
- El laboratorio es local y nunca se expone a Internet.
- Las muestras de malware no se ejecutan y se manejan como copias inertes.
- La evidencia se anonimiza antes de entregarse.
- El uso indebido de las técnicas del curso tiene consecuencias académicas y legales.
- El código entregado usa type hints, docstrings estilo Google y manejo explícito de errores.

glosario:
  - termino: "Activo"
    definicion: "Cualquier cosa que tiene valor para el curso o para el negocio: datos, servicios, cuentas, equipos o reputación. Se protege porque perderla o exponerla tiene un costo."
  - termino: "Amenaza"
    definicion: "Agente o evento con capacidad de causar daño a un activo. Puede ser oportunista, crimen organizado, insider o APT; la amenaza no es la vulnerabilidad."
  - termino: "Vulnerabilidad"
    definicion: "Debilidad concreta que una amenaza puede aprovechar: un servicio sin parche, una contraseña débil, un permiso de más o un diseño sin validación."
  - termino: "Riesgo"
    definicion: "Función de la probabilidad de que una amenaza explote una vulnerabilidad y del impacto que tendría sobre el activo. No es lo mismo que el impacto: se pondera con la probabilidad."
  - termino: "Superficie de ataque"
    definicion: "Conjunto de puntos por donde se puede intentar entrar: puertos abiertos, servicios, interfaces, cuentas y configuraciones expuestas. Inventariarla es el primer paso de la práctica."
  - termino: "Vector de ataque"
    definicion: "Camino concreto que usa el atacante para llegar al activo, por ejemplo un servicio con una versión vulnerable o una credencial por defecto."
  - termino: "Cadena de explotación"
    definicion: "Secuencia de pasos que va del reconocimiento al efecto final: reconocer, obtener acceso, escalar, persistir, moverse y actuar. Un control en cualquier eslabón puede romperla."
  - termino: "Tríada CIA"
    definicion: "Confidencialidad, integridad y disponibilidad: las tres propiedades que se protegen por defecto. A ellas se suman autenticidad, integridad de origen y no repudio."
  - termino: "No repudio"
    definicion: "Garantía de que quien realizó una acción no puede negar haberla hecho. Se apoya en firmas, registros confiables y control de identidad."
  - termino: "APT"
    definicion: "Amenaza persistente avanzada: un adversario con recursos, tiempo y objetivos concretos que opera de forma sigilosa y sostenida. No es un ataque puntual ni un script suelto."
  - termino: "Insider"
    definicion: "Persona con acceso legítimo que abusa de él, por negligencia o de forma deliberada. Su ventaja es que conoce la red y no necesita romper el perímetro."
  - termino: "STRIDE"
    definicion: "Modelo de amenazas con seis categorías: suplantación, manipulación, repudio, revelación de información, denegación de servicio y elevación de privilegios. Ayuda a no olvidar categorías al analizar un servicio."
  - termino: "Cyber Kill Chain"
    definicion: "Modelo de siete fases del ataque, del reconocimiento a la acción final. Sirve para ubicar en qué punto se puede detectar o interrumpir cada ataque."
  - termino: "MITRE ATT&CK"
    definicion: "Catálogo de tácticas y técnicas reales de adversarios, con identificadores estables. Se usa como vocabulario común para describir lo observado y lo detectado."
  - termino: "Equipo rojo, azul y púrpura"
    definicion: "Rojo ejecuta la ofensiva controlada; azul defiende y mitiga; púrpura mide la detección y acerca a los otros dos. En este curso son roles de grupo que rotan por fase."
  - termino: "Enumeración de servicios"
    definicion: "Descubrir qué puertos están abiertos y qué software y versión responde en cada uno. Se hace solo contra objetivos autorizados, en este laboratorio desde localhost."
  - termino: "Evidencia reproducible"
    definicion: "Salida, captura o hash que permite a otra persona repetir el paso y obtener lo mismo. Una descripción sin evidencia no es un hallazgo verificable."
  - termino: "Localhost"
    definicion: "La propia máquina (127.0.0.1). En el laboratorio el objetivo vive aquí, así que las pruebas no salen del equipo ni alcanzan infraestructura de terceros."
  - termino: "Cifrado simétrico"
    definicion: "Cifrado que usa la misma clave para cifrar y descifrar. Es rápido y adecuado para volumen, pero exige repartir la clave por un canal seguro."
  - termino: "Cifrado asimétrico"
    definicion: "Cifrado con un par de claves: la pública cifra o verifica y la privada descifra o firma. Resuelve el reparto de claves a cambio de ser más lento."
  - termino: "Hash criptográfico"
    definicion: "Función de un solo sentido que produce una huella de tamaño fijo; cambiar un byte cambia la huella. No cifra ni se puede revertir."
  - termino: "HMAC"
    definicion: "Hash con clave que autentica un mensaje y detecta manipulación. Aporta integridad y autenticidad de origen, no confidencialidad."
  - termino: "Derivación de claves"
    definicion: "Convertir una contraseña o secreto débil en una clave del tamaño adecuado con un coste deliberado (PBKDF2, Argon2) para frenar la fuerza bruta."
  - termino: "TLS"
    definicion: "Protocolo que cifra y autentica una conexión entre cliente y servidor. HTTPS es HTTP sobre TLS."
  - termino: "Cadena de certificados"
    definicion: "Secuencia de certificados firmados que enlaza la clave del servidor con una autoridad de confianza. Si falta un eslabón o es inválido, la validación falla."
  - termino: "Gestión de secretos"
    definicion: "Crear, almacenar, rotar y revocar claves y contraseñas sin dejarlas en el código, en los argumentos ni en el historial de git."
  - termino: "Autorización escrita"
    definicion: "Permiso firmado que delimita qué se puede probar, desde dónde y en qué ventana de tiempo. Sin ella no hay prueba técnica legítima."
  - termino: "Reglas de enfrentamiento"
    definicion: "Condiciones operativas de la prueba: alcance, ventana, sistemas excluidos, contacto y criterios de parada. Se acuerdan antes de empezar."
  - termino: "ISO/IEC 27001"
    definicion: "Norma de sistemas de gestión de seguridad de la información. Exige política, análisis de riesgos, controles y mejora continua."
  - termino: "NIST CSF"
    definicion: "Marco voluntario con las funciones identificar, proteger, detectar, responder y recuperar. Ordena el programa de seguridad sin prescribir productos."
  - termino: "OWASP ASVS"
    definicion: "Estándar de verificación de seguridad de aplicaciones con requisitos por nivel. Se usa como lista de comprobación técnica."
  - termino: "Cadena de custodia"
    definicion: "Registro que documenta quién tuvo la evidencia, cuándo, dónde y con qué integridad. Una rotura de la cadena le quita valor probatorio."
  - termino: "Código de ética"
    definicion: "Reglas de conducta del curso: solo objetivos autorizados, evidencia anonimizada, sin daño y con divulgación responsable."
  - termino: "Registro DNS"
    definicion: "Entrada de la zona que publica datos como A, AAAA, MX, NS, TXT o SOA. Es información pública y parte del reconocimiento."
  - termino: "WHOIS"
    definicion: "Consulta del registro de un dominio que devuelve registrante, fechas y servidores. Se está sustituyendo por RDAP, con salida estructurada."
  - termino: "Enumeración de subdominios"
    definicion: "Descubrir nombres bajo un dominio (dev, staging, vpn) para localizar servicios que no aparecen en el inventario."
  - termino: "Google dorks"
    definicion: "Consultas con operadores de búsqueda que encuentran documentos y paneles indexados. Solo se usan sobre el alcance autorizado."
  - termino: "OPSEC"
    definicion: "Hábitos que evitan filtrar identidad, infraestructura o intención durante la recolección de información."
  - termino: "Escaneo SYN"
    definicion: "Sondeo semiabierto que no completa la conexión TCP. Es más sigiloso que connect y requiere privilegios."
  - termino: "Banner grabbing"
    definicion: "Leer la cabecera que anuncia el servicio para identificar producto y versión; es la base del fingerprinting."
  - termino: "Fingerprinting"
    definicion: "Inferir sistema operativo y software a partir de las respuestas, los tiempos y los detalles del protocolo."
  - termino: "OWASP Top 10"
    definicion: "Lista de las categorías de riesgo web con mayor impacto, revisada periódicamente. Es un punto de partida, no un catálogo exhaustivo."
  - termino: "Control de acceso roto"
    definicion: "Fallo que permite ver o modificar recursos de otro usuario cambiando un identificador o una petición (IDOR, BOLA)."
  - termino: "Inyección SQL"
    definicion: "Introducir sintaxis SQL en una entrada no parametrizada para alterar la consulta. Se evita parametrizando y validando."
  - termino: "XSS"
    definicion: "Inyectar script que se ejecuta en el navegador de otra persona. Puede ser reflejado, almacenado o en el DOM según dónde persista."
  - termino: "LFI"
    definicion: "Inclusión local de ficheros que permite leer archivos del servidor a través de una ruta manipulada."
  - termino: "Causa raíz"
    definicion: "Defecto concreto que permite la vulnerabilidad, como una consulta concatenada o una salida sin codificar. Es distinto del síntoma observado."
  - termino: "Mínimo privilegio"
    definicion: "Cada cuenta, servicio y proceso tiene solo los permisos necesarios para su función."
  - termino: "SUID"
    definicion: "Bit que hace que un ejecutable corra con los permisos de su propietario. Un SUID mal configurado es una vía de elevación."
  - termino: "CIS Benchmarks"
    definicion: "Guías de configuración segura con comprobaciones concretas por sistema y servicio. Sirven para construir la línea base."
  - termino: "AppArmor"
    definicion: "Módulo del kernel que confina un programa a los archivos y capacidades que declara su perfil."
  - termino: "Línea base"
    definicion: "Estado medido y documentado de una configuración. Sin ella no se puede demostrar que el endurecimiento cambió algo."
  - termino: "nftables"
    definicion: "Framework de filtrado del kernel que sustituye a iptables. ufw es una interfaz simplificada sobre él."
  - termino: "IDS/IPS"
    definicion: "Sistema que detecta (IDS) o bloquea (IPS) tráfico y comportamiento según firmas o reglas."
  - termino: "Suricata"
    definicion: "Motor IDS/IPS de código abierto con firmas y extracción de eventos. Sus alertas se leen, no solo se cuentan."
  - termino: "Validación de entrada"
    definicion: "Comprobar tipo, formato, longitud y rango de lo que llega antes de usarlo. No sustituye la parametrización."
  - termino: "Parametrización de consultas"
    definicion: "Enviar los datos como parámetros separados de la sentencia, de modo que no puedan alterar su estructura."
  - termino: "CSP"
    definicion: "Cabecera que restringe desde dónde puede cargar recursos la página y mitiga XSS. No repara una salida sin codificar."
  - termino: "SBOM"
    definicion: "Inventario de componentes y versiones de un producto. Permite responder qué dependencia está afectada por una vulnerabilidad."
  - termino: "Análisis estático"
    definicion: "Revisar código sin ejecutarlo para encontrar patrones inseguros. Es rápido y repetible, pero produce falsos positivos."
  - termino: "Cabeceras de seguridad"
    definicion: "Respuestas HTTP como HSTS, X-Content-Type-Options o Referrer-Policy que reducen la superficie del navegador."
  - termino: "Principio de Locard"
    definicion: "Todo contacto deja un rastro. En forense, el atacante deja artefactos y el analista también puede alterarlos."
  - termino: "Orden de volatilidad"
    definicion: "Recoger primero lo que se pierde antes: memoria y procesos, luego red, disco y por último respaldos o logs externos."
  - termino: "Adquisición lógica"
    definicion: "Copiar archivos y metadatos del sistema de archivos. Es suficiente para muchos casos y menos invasiva que la física."
  - termino: "Imagen forense"
    definicion: "Copia bit a bit de un soporte, verificada con hash antes y después, para analizar sin tocar el original."
  - termino: "Persistencia"
    definicion: "Mecanismo que mantiene el acceso tras reiniciar: servicio, cron, timer o clave SSH añadida. Su rastro es un indicador clave."
  - termino: "Línea de tiempo"
    definicion: "Ordenar los artefactos por marca temporal para reconstruir qué ocurrió y en qué secuencia."
  - termino: "Indicador de compromiso"
    definicion: "Huella observable (hash, IP, ruta, usuario) que sugiere actividad maliciosa. Por sí sola no prueba el compromiso."
  - termino: "NIST SP 800-61"
    definicion: "Guía de respuesta a incidentes con preparación, detección y análisis, contención, erradicación, recuperación y lecciones aprendidas."
  - termino: "Playbook"
    definicion: "Procedimiento escrito con pasos, responsables y criterios de decisión para un tipo de incidente."
  - termino: "Contención"
    definicion: "Limitar el alcance del incidente, aislando el equipo o cortando la cuenta, antes de erradicarlo y preservando la evidencia."
  - termino: "Triage"
    definicion: "Clasificación rápida de un incidente o una muestra por gravedad, urgencia y confianza para decidir el siguiente paso."
  - termino: "YARA"
    definicion: "Lenguaje de reglas para identificar muestras por cadenas y patrones binarios. Se valida contra muestras conocidas."
  - termino: "Análisis dinámico"
    definicion: "Ejecutar la muestra en un entorno aislado y observar su comportamiento. El curso lo limita y nunca lo hace sobre el equipo real."
  - termino: "Post mortem"
    definicion: "Informe posterior, sin culpables, que documenta cronología, decisiones, causas y acciones de mejora."
  - termino: "Resumen ejecutivo"
    definicion: "Versión breve y sin jerga del informe para quien decide. Prioriza impacto, riesgo y recomendación."
  - termino: "Remediación"
    definicion: "Acción concreta que elimina o mitiga un hallazgo, con responsable, esfuerzo y verificación posterior."
